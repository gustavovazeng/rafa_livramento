// ── Corte de data: a captação real começou em 22/09 ───────────────────────
// A base trazia cadastros e respostas de pesquisa de maio a 21/09 que NÃO são
// do lançamento (re-etiquetagem de base antiga, testes). Tudo antes desta
// data é descartado na leitura, ANTES do dedup — se ficasse pra depois, uma
// lead velha da mesma pessoa "absorveria" a inscrição real de agora (o dedup
// guarda a mais antiga) e a lead real sumiria do período.
// Vale pra Base leads e pra Base pesquisa. Para ver a base inteira de novo,
// basta apagar o valor (deixar em null).
const DATA_INICIO_CAPTACAO = null; // och_nov26: base começa no lançamento, sem corte
function antesDaCaptacao(dataISO){
  return !!DATA_INICIO_CAPTACAO && !!dataISO && dataISO < DATA_INICIO_CAPTACAO;
}
// NFKD + remoção de acentos + barra invertida: "5600 MXN \/ USD $300" vira
// "5600 mxn / usd $300". Deixa o cruzamento imune a acento, caixa, espaço
// duplo e ao escape "\/" que a exportação insere — que é o que mais varia
// entre exportações da planilha.
function normResposta(s){
  return String(s||"").normalize("NFKD").replace(/[\u0300-\u036f]/g,"")
    .replace(/\\/g,"").toLowerCase().replace(/\s+/g," ").trim();
}
// Pontuação de uma resposta, já passando pelos apelidos.
function pontosResposta(chave,resposta){
  const n=normResposta(resposta);
  const tabela=SCORE_PONTOS[chave]||{};
  const pt=tabela[n];
  if(pt!==undefined)return pt;
  const alias=SCORE_ALIASES[n];
  return alias!==undefined?tabela[alias]:undefined;
}
// Cortes oficiais das faixas do och_nov26. Limite INFERIOR inclusivo,
// superior exclusivo — é isso que garante que cada lead caia em uma única
// faixa, sem sobreposição nas bordas (score 225 exato é A, nunca B).
// Amplitude possível do score: 98,82 (pior resposta em tudo) a 358,71.
const FAIXA_CORTES = [["A",225],["B",193],["C",154],["D",0]];
// Vira true sozinho quando TODA resposta tiver pontuação e TODO corte de
// faixa estiver preenchido.
const SCORE_TABELA_PRONTA = (()=>{
  for(const k in SCORE_PONTOS)
    for(const o in SCORE_PONTOS[k])
      if(SCORE_PONTOS[k][o]==null) return false;
  return FAIXA_CORTES.every(([,min])=>min!=null);
})();
// Soma dos pontos das 6 respostas de UMA LINHA DA BASE PESQUISA. Devolve null
// se a lead não respondeu a pesquisa, ou se qualquer resposta estiver ausente
// ou não reconhecida — nesse caso ela não recebe faixa e fica fora do
// denominador de todas as métricas de faixa.
function scoreLead(pesq){
  if(!pesq||!SCORE_TABELA_PRONTA) return null;
  let total=0;
  for(const k in SCORE_COLS){
    const pt=pontosResposta(k,pesq[SCORE_COLS[k]]);
    if(pt==null)return null;
    total+=pt;
  }
  return Math.round(total*100)/100;
}
function faixaFromScore(score){
  if(score==null)return "";
  const hit=FAIXA_CORTES.find(([,min])=>min!=null&&score>=min);
  return hit?hit[0]:"";
}
// Índice da Base pesquisa por e-mail. A coluna "telefone" da pesquisa vem
// vazia na exportação, então o e-mail é a única chave possível. Quando a
// mesma pessoa responde mais de uma vez (acontece: hoje são ~50 reenvios),
// vale a resposta MAIS ANTIGA — mesmo critério do dedup de leads, que guarda
// a primeira inscrição de cada pessoa.
function processPesquisa(rowsRaw){
  const byEmail={};
  let descartadas=0;
  for(const r of rowsRaw){
    const em=normalizeEmail(r[PESQUISA_COLS.email]);
    if(!em)continue;
    const quando=String(r[PESQUISA_COLS.criadoEm]||"").trim();
    // Respostas anteriores ao início da captação não são deste lançamento.
    const qISO=(toISOLead(quando)||{}).date||null;
    if(antesDaCaptacao(qISO)){ descartadas++; continue; }
    const atual=byEmail[em];
    if(!atual||(quando&&quando<atual.__quando)){ byEmail[em]={...r,__quando:quando}; }
  }
  S.pesquisasDescartadas=descartadas;
  return byEmail;
}

// Temperatura do público vem no NOME DA CAMPANHA (ex.: "...-conversao-quente-...",
// "...-conversao-frio-faixaAB_2.0-leva01") — não no campo "temperature_name" da
// Base leads, que nesta base vem sempre "Frio" independente da campanha real.
function campaignTemperature(campName){
  const c=String(campName||"").toLowerCase();
  if(c.includes("quente"))return "Quente";
  if(c.includes("morno"))return "Morno";
  if(c.includes("frio"))return "Frio";
  return "";
}
// Etapa do lançamento a que uma campanha pertence, extraída do NOME DA
// CAMPANHA (mesmo princípio da temperatura) — ex.: campanha de Lembrete
// contém "lembrete" no nome, Aquecimento contém "aquecimento", etc. Sem
// nenhuma dessas palavras, assume Captação (é a etapa atual do lançamento e
// a maioria das campanhas de hoje são dela). Usado pra não deixar o
// investimento de uma campanha vazar pro "realizado" de outra etapa só
// porque a data bate — cada real é filtrado por campanha, não só por data.
function campaignStage(campName){
  const c=String(campName||"").toLowerCase();
  if(c.includes("lembrete"))return "Lembrete";
  if(c.includes("aquecimento"))return "Aquecimento";
  if(c.includes("aula"))return "Aulas";
  if(c.includes("vip"))return "Grupo VIP";
  if(c.includes("carrinho"))return "Carrinho";
  return "Captação";
}
// Linhas de investimento de uma etapa. Aquecimento/Lembrete/Aulas têm sheet
// própria (S.aquecimentoRows/S.lembreteRows/S.aulasRows — mesma fonte que já
// alimenta as abas dessas etapas e o Resumo diário), então usamos elas
// direto. Captação e Carrinho não têm sheet de mídia própria — continuam
// vindo da Base Meta - captação, filtrada por campanha (via campaignStage).
// Antes, Aquecimento/Lembrete/Aulas também tentavam filtrar S.metaRows por
// campaignStage, mas as campanhas dessas 3 etapas não estão nessa sheet (só
// nas sheets próprias) — por isso "Planejado/Realizado" sempre mostrava
// R$0,00 de realizado ali, mesmo com investimento normal nas outras abas.
// Mídia do Carrinho: usa a aba própria ("Base Carrinho") quando existir; se
// estiver vazia, cai no comportamento antigo (Base Meta - captação filtrada
// por campanha), pra não quebrar enquanto a aba nova não tem linhas.
function carrinhoMetaRows(){
  if(S.carrinhoMetaRows&&S.carrinhoMetaRows.length)return S.carrinhoMetaRows;
  return S.metaRows.filter(r=>campaignStage(r.campName)==="Carrinho");
}
function stageRowsForStage(stage){
  if(stage==="Carrinho")return carrinhoMetaRows();
  if(stage==="Aquecimento")return S.aquecimentoRows||[];
  if(stage==="Lembrete")return S.lembreteRows||[];
  if(stage==="Aulas")return S.aulasRows||[];
  if(stage==="Grupo VIP")return S.grupoVipRows||[];
  return S.metaRows.filter(r=>campaignStage(r.campName)===stage);
}
// Investimento realizado de uma etapa numa data específica.
function stageSpendForDate(stage,date){
  return stageRowsForStage(stage).filter(r=>r.date===date).reduce((a,r)=>a+r.spend,0);
}
// Investimento realizado total de uma etapa (todas as datas) — usado no
// "Resumo por etapa" do Planejado/Realizado.
function totalSpendForStage(stage){
  return stageRowsForStage(stage).reduce((a,r)=>a+r.spend,0);
}

// Mesma lógica do metaEmoji() usado no Resumo diário (🟢/🟡/🔴/⚪), só que
// acessível globalmente pras novas abas de etapa (Aquecimento/Lembrete/Aulas).
function metaEmojiGlobal(val,meta,higherIsBetter){
  if(meta==null) return "";   // sem meta definida → não pontua status
  if(val==null) return "⚪";
  if(!val) return "🔴";
  const c=statusColor(val,meta,higherIsBetter);
  if(c==="#34d399")return "🟢";
  if(c==="#fbbf24")return "🟡";
  return "🔴";
}
// Número da aula (1/2/3) a partir do nome da campanha — ex.: contém "aula01"
// ou "aula 1". null se não identificar nenhuma aula no nome.
function aulaNumberFromCampaign(campName){
  const c=String(campName||"").toLowerCase();
  const m=c.match(/aula\s*0?(\d)/);
  return m?m[1]:null;
}
function sumStageRows(rows){
  return rows.reduce((a,r)=>({spend:a.spend+r.spend,clicks:a.clicks+r.clicks,impressions:a.impressions+r.impressions,video75:a.video75+r.video75,view3s:a.view3s+(r.view3s||0)}),
    {spend:0,clicks:0,impressions:0,video75:0,view3s:0});
}
// Métricas agregadas de uma etapa (Aquecimento/Lembrete/Aulas): CPC vem de
// spend/clicks (recalculado, não da coluna pronta do CSV, pra consistência
// com o resto do dashboard).
// ⚠️ Tx 75% = 75% assistido ÷ QUEM VIU 3 SEGUNDOS (não ÷ impressões).
// Decisão do Gustavo (09/10): o denominador é o público que de fato começou a
// assistir, que é a base usada no gerenciador — com impressões a taxa saía
// bem mais baixa e não comparava com a meta. A coluna é "Action 3s Video
// Views" (com "Action Video View" como alternativa, ver parseStageRows).
// Sem view3s na base, a taxa fica "—" em vez de inventar um número.
function stageMetrics(rows){
  const t=sumStageRows(rows);
  const cpc=t.clicks>0?t.spend/t.clicks:null;
  const tx75=t.view3s>0?(t.video75/t.view3s)*100:null;
  const cptx75=t.video75>0?t.spend/t.video75:null;
  return{...t,cpc,tx75,cptx75};
}

// ── Carrinho: vendas (Base Vendas) ──────────────────────────────────────────
// O och_nov26 NÃO tem etapa de fichas de interesse. O carrinho aqui é só
// TRÁFEGO (aba "Base Carrinho", a mídia da etapa) e VENDA (aba "Base Vendas",
// a exportação do checkout da Hotmart). A venda já chega com a própria
// atribuição nos campos de origem do checkout — não existe mais o casamento
// por telefone/e-mail com uma ficha intermediária.
//
// Venda com UTM contendo FBAds → tráfego (entra em campanha/anúncio).
// Qualquer outra (sem UTM, ou UTM de e-mail/WhatsApp/disparo) → orgânica:
// conta em vendas, faturamento e ROAS, aparece na aba Vendas pela origem
// dela, mas não é atribuída a nenhum anúncio.

// Dedup genérico por contato (telefone OU e-mail, union-find — liga registros
// transitivamente mesmo quando só um dos dois campos bate) — mantém, de cada
// grupo, o registro com menor "ms" (o registro mais antigo da pessoa).
// Espera itens com {phone,email,ms} já normalizados (normalizePhone/
// normalizeEmail). Usado pela Base leads (Captação).
function dedupByContact(items){
  const parent={};
  function find(x){ if(!(x in parent))parent[x]=x; while(parent[x]!==x){parent[x]=parent[parent[x]];x=parent[x];} return x; }
  function union(a,b){ const ra=find(a),rb=find(b); if(ra!==rb)parent[ra]=rb; }
  items.forEach((it,i)=>{
    const kRow="r:"+i; find(kRow);
    if(it.phone)union(kRow,"p:"+it.phone);
    if(it.email)union(kRow,"e:"+it.email);
  });
  const groups={};
  items.forEach((it,i)=>{
    const root=find("r:"+i);
    if(!groups[root]||it.ms<groups[root].ms)groups[root]=it;
  });
  return Object.values(groups);
}
// Busca tolerante de coluna: ignora acento, hífen, ponto, espaço e caixa no
// cabeçalho. Necessária porque a Base Vendas vem com os nomes crus do webhook
// ("data.purchase.price.value") e, se um dia virar exportação manual, os
// mesmos campos aparecem como "Valor"/"Preço" — as duas formas passam aqui.
function getCol(r,...alts){
  const norm=k=>String(k||"").normalize("NFKD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]/g,"");
  const chaves=Object.keys(r);
  for(const alt of alts){
    const a=norm(alt);
    const hit=chaves.find(k=>norm(k)===a);
    if(hit!=null&&String(r[hit]||"").trim()!=="")return r[hit];
  }
  return "";
}
// Valor da venda em dólar. A Hotmart entrega o preço na moeda do comprador
// (MXN, USD, BRL…) numa coluna e a moeda em outra. As taxas são as MESMAS da
// conversão do investimento (metaSpendToUSD) — se uma mudar, muda a outra.
function vendaValorUSD(valor,moeda){
  // och_nov26: vendas em R$, sem conversão.
  return valor||0;
}
// Fuso usado pra transformar o timestamp da venda em DATA. O webhook manda
// epoch em UTC; o lançamento é no México, então o dia da venda vira no
// horário de lá — a mesma referência do gerenciador de anúncios. É só mudar
// esta constante se o corte do dia tiver que ser em outro fuso.
const VENDAS_TZ_OFFSET_H = -3; // horário de Brasília
// Data da venda em milissegundos, aceitando os formatos que já apareceram:
// epoch em ms (webhook), epoch em segundos, "DD/MM/YYYY HH:MM:SS" e ISO.
function vendaDataMs(raw){
  const s=String(raw||"").trim();
  if(!s)return null;
  if(/^\d{13}$/.test(s))return parseInt(s,10);
  if(/^\d{10}$/.test(s))return parseInt(s,10)*1000;
  const ms=parseFichaDateTimeMs(s);
  if(ms!=null)return ms;
  const t=Date.parse(s.replace(" ","T"));
  return isNaN(t)?null:t;
}
// Status da Hotmart. Só os "OK" entram em vendas/faturamento; devolução e
// chargeback são contados à parte pra aparecer como aviso, e o resto
// (boleto gerado, aguardando pagamento, checkout abandonado) é ignorado.
const VENDA_STATUS_OK=["APPROVED","COMPLETE","COMPLETED"];
const VENDA_STATUS_DEVOLVIDA=["REFUNDED","CHARGEBACK","CANCELED","CANCELLED","DISPUTE"];
// Só conta como venda de TRÁFEGO a que traz "FBAds" na UTM do checkout. As
// outras UTMs que aparecem por lá (e-mail, WhatsApp, disparo, link direto)
// NÃO vêm de anúncio — mesmo trazendo origem preenchida, entram no balde de
// orgânico/outras origens e ficam fora da atribuição por campanha/anúncio.
// É só mudar esta expressão se a nomenclatura da UTM paga mudar.
const VENDA_UTM_TRAFEGO = /fbads/i;
// Atribuição da venda. O checkout carrega a origem em "origin.xcod" (e, como
// reserva, "origin.sck"). Não há um formato único: o campo pode vir como
// pares "utm_x=valor", como uma sequência separada por "|" (padrão do src do
// Meta: campanha|conjunto|anúncio) ou vazio. O parser aceita as três formas
// pra não depender de como o checkout foi configurado — e campo VAZIO é o
// sinal de venda orgânica.
function parseVendaOrigem(xcod,sck){
  const raw=(String(xcod||"").trim()||String(sck||"").trim());
  if(!raw)return{tipo:"org",origem:"(orgânico / sem UTM)",canal:"(orgânico / sem UTM)",campName:null,adName:null,raw:""};
  const partes=raw.split(/[|;]/).map(p=>p.trim()).filter(Boolean);
  const kv={}, livres=[];
  for(const p of partes){
    const i=p.indexOf("=");
    if(i>0)kv[p.slice(0,i).trim().toLowerCase()]=p.slice(i+1).trim();
    else livres.push(p);
  }
  let src=kv["utm_source"]||kv["source"]||kv["src"]||"";
  let med=kv["utm_medium"]||kv["medium"]||"";
  let camp=kv["utm_campaign"]||kv["campaign"]||"";
  let cont=kv["utm_content"]||kv["content"]||kv["utm_term"]||"";
  // Nenhum par chave=valor: trata como posicional "origem|campanha|…|anúncio".
  if(!src&&!med&&!camp&&!cont&&livres.length){
    src=livres[0];
    camp=livres.length>1?livres[1]:livres[0];
    cont=livres.length>2?livres[livres.length-1]:"";
  }
  // Mesmo padrão "{nome}id{id}" da Base leads: quando o id do anúncio vem
  // colado no nome, o nome oficial vem da Base Meta (S.adIdMap).
  const campoCamp=camp||med;
  let campName=extractNamePrefix(campoCamp)||campoCamp||null;
  let adName=extractNamePrefix(cont)||cont||null;
  const adId=extractIdSuffix(cont);
  if(adId&&S.adIdMap&&S.adIdMap[adId]){
    adName=S.adIdMap[adId].adName||adName;
    campName=S.adIdMap[adId].campName||campName;
  }
  const origem=src||campName||"(sem identificação)";
  const canal=med||campName||"(sem identificação)";
  // UTM preenchida mas sem FBAds: a origem é mantida (aparece nas tabelas de
  // origem/canal da aba Vendas), só que sem campanha/anúncio — não é tráfego.
  if(!VENDA_UTM_TRAFEGO.test(raw))return{tipo:"org",origem,canal,campName:null,adName:null,raw};
  return{tipo:"traf",origem,canal,
    campName:campName||"(sem atribuição)",
    adName:adName||"(sem atribuição)",
    raw};
}
// Processa a "Base Vendas" inteira e popula o estado S.carrinho* de uma vez.
// Roda DEPOIS da Base Meta (usa S.adIdMap pra resolver o nome do anúncio).
function processCarrinhoVendas(rowsRaw){
  const vendas=[], porDia={}, fatPorDia={};
  let total=0, aprovadas=0, devolvidas=0, trafego=0, outras=0, faturamento=0, semData=0;
  for(const r of rowsRaw){
    const nome=String(getCol(r,"data.buyer.name","Nome","Name","Comprador")||"").trim();
    const email=normalizeEmail(getCol(r,"data.buyer.email","E-mail","Email","Mail"));
    const phone=normalizePhone(getCol(r,"data.buyer.checkout_phone","Whatsapp1","Whatsapp","Telefone","Celular","Phone"));
    const status=String(getCol(r,"data.purchase.status","Status")||"").trim().toUpperCase();
    if(!nome&&!email&&!phone&&!status)continue; // linha vazia
    total++;
    if(VENDA_STATUS_DEVOLVIDA.includes(status)){devolvidas++;continue;}
    if(status&&!VENDA_STATUS_OK.includes(status))continue; // boleto gerado, aguardando pagamento etc.
    const ms=vendaDataMs(getCol(r,"data.purchase.order_date","Data Correta","Data","Data da venda","created_at"));
    const date=ms!=null?msToISO(ms+VENDAS_TZ_OFFSET_H*60*60*1000):null;
    if(date==null)semData++;
    const moeda=String(getCol(r,"data.purchase.price.currency_value","Moeda","Currency")||"").trim().toUpperCase();
    const valor=parseNum(getCol(r,"data.purchase.price.value","valor","Valor","Preço","Price"));
    const valorUSD=vendaValorUSD(valor,moeda);
    const o=parseVendaOrigem(getCol(r,"data.purchase.origin.xcod","xcod","utm","UTM"),
                             getCol(r,"data.purchase.origin.sck","sck"));
    aprovadas++;
    if(o.tipo==="traf")trafego++;else outras++;
    faturamento+=valorUSD;
    if(date){porDia[date]=(porDia[date]||0)+1; fatPorDia[date]=(fatPorDia[date]||0)+valorUSD;}
    vendas.push({date,ms,nome,email,phone,status,moeda,valor,valorUSD,
      tipo:o.tipo,origem:o.origem,canal:o.canal,campName:o.campName,adName:o.adName,utmRaw:o.raw,
      produto:String(getCol(r,"data.product.name","Produto","Product")||"").trim()});
  }
  S.carrinhoVendas=vendas;
  S.carrinhoVendasPorDia=porDia;
  S.carrinhoFatPorDia=fatPorDia;
  S.carrinhoVendasLinhas=total;
  S.carrinhoVendasTotal=aprovadas;
  S.carrinhoVendasDevolvidas=devolvidas;
  S.carrinhoVendasTrafego=trafego;
  S.carrinhoVendasOutras=outras;
  S.carrinhoVendasSemData=semData;
  S.carrinhoFaturamento=faturamento;
}

// ── Base GA4 (dados de página) ──────────────────────────────────────────────
// Regras combinadas com o usuário:
//  • Só sessões de tráfego pago reconhecido (Session Source começa com
//    "FBAds") — exclui orgânico (ActiveCampaign, whatsapp, ytb-ramon etc.).
//  • Exclusão da página de PESQUISA (quiz, acessada só DEPOIS do cadastro —
//    não deve entrar no Connect Rate nem na conversão de página, que medem o
//    funil até o cadastro): FEITA — ver GA4_PATHS_EXCLUIDOS abaixo.
//  • "Sessions" = visitas únicas (métrica usada pra Connect Rate/conversão);
//    "Page Views" fica disponível mas não usado nesses dois cálculos.
// Temperatura extraída do "Session Medium" (= utm_medium = nome da campanha),
// mesmo critério já usado pra Base Meta/Base leads (campaignTemperature).
// Páginas que NÃO fazem parte do funil até o cadastro e por isso ficam fora
// de toda a análise de páginas (Connect Rate, Tx conv Pg cadastro e a tabela
// "Página (GA4)" da aba Principal):
//  • /mdi-obrigado-forms-newls → pesquisa, acessada só DEPOIS do cadastro
// Comparação normalizada (sem barra final e sem querystring) pra não
// escapar por causa de "/mdi-obrigado-forms-newls/" ou "?email=...".
// Paths do och_nov26:
//   • página de captura  → /mdi-2026-setp-captura-v1/  (é a que CONTA; é o
//     único "Page Path" que aparece na Base GA4 hoje)
//   • página de obrigado → /mdi-obrigado-forms-newls/  (a pesquisa, acessada
//     só DEPOIS do cadastro — não pode entrar no denominador da conversão)
const GA4_PATHS_EXCLUIDOS = ["/mdi-obrigado-forms-newls"];
// Ponte entre a página que a LEAD diz ter usado e a que o GA4 registrou. A
// Base leads grava sempre a mesma URL ("/mdi-2026-jun-captura-v6/"), herdada
// do lançamento de junho — é campo fixo do ActiveCampaign, não a página real;
// tanto que as leads de maio também vêm com ela. O GA4 registra a página de
// verdade ("/mdi-2026-setp-captura-v1/"). Sem esta ponte a tabela por página
// mostraria as sessões de um lado com 0 cadastros e os cadastros do outro com
// 0 sessões, e a conversão por página ficaria zerada nas duas linhas.
// och_nov26: a ponte jun-v6→setp-v1 era específica das páginas do och_nov26.
// Lançamento novo começa sem apelidos; acrescente aqui se reaparecer o caso.
const GA4_PATH_ALIASES = {
};
function ga4PathCanonico(p){
  const v=normPath(p);
  return GA4_PATH_ALIASES[v]||v;
}
// Páginas de captura 100% ORGÂNICAS: toda lead cadastrada nelas conta como
// Orgânico, qualquer que seja a UTM (inclusive sem UTM — que no resto da base
// é tratada como tráfego sem tracking). Comparação pelo path normalizado,
// ignorando domínio, query string, barra final e caixa.
const LEAD_PATHS_ORGANICOS = [];
function pathOrganico(p){
  const v=normPath(p);
  return !!v&&LEAD_PATHS_ORGANICOS.some(x=>normPath(x)===v);
}
function normPath(p){
  return String(p||"").trim().split("?")[0].split("#")[0].replace(/\/+$/,"").toLowerCase();
}
function ga4PathExcluido(p){
  const v=normPath(p);
  return GA4_PATHS_EXCLUIDOS.some(x=>normPath(x)===v);
}
// Origens do GA4 que NÃO são tráfego pago pra página de captura e por isso
// ficam fora da conta. Neste lançamento o GA4 não está recebendo as UTMs — as
// colunas Session Source/Medium/Term/Ad Content vêm "(not set)" em quase toda
// linha —, então filtrar por "FBAds" como nos outros funis zeraria a métrica
// inteira. O critério aqui é o inverso: conta tudo que chegou na página de
// captura e descarta só o que é reconhecidamente de outra origem.
const GA4_SOURCES_EXCLUIDAS = ["eventsmanager.facebook.com","business.facebook.com","adsmanager.facebook.com"];
function ga4SourceExcluida(source,medium){
  const src=String(source||"").trim().toLowerCase();
  if(GA4_SOURCES_EXCLUIDAS.includes(src))return true;
  // Visita interna de ferramenta (referral do próprio gerenciador) não é lead.
  return String(medium||"").trim().toLowerCase()==="referral"&&src.includes("facebook.com");
}
function processGA4(rowsRaw){
  const rows=[];
  for(const r of rowsRaw){
    const date=toISO(r["Date"]);if(!date)continue;
    const source=(r["Session Source"]||"").trim();
    const pagePath=(r["Page Path"]||"").trim();
    if(ga4SourceExcluida(source,r["Session Medium"]))continue;
    if(ga4PathExcluido(pagePath))continue;
    const sessionMedium=(r["Session Medium"]||"").trim();
    const sessions=parseInt(r["Sessions"],10)||0;
    const pageViews=parseInt(r["Page Views"],10)||0;
    // A temperatura sai do Session Medium, que é onde o nome da campanha
    // chega quando a UTM funciona. Hoje vem "(not set)", então fica "" e as
    // sessões só entram no recorte "Todos" — o filtro por temperatura das
    // Métricas do Tráfego mostra "—" pra Connect Rate/Tx Pág até a UTM
    // começar a chegar no GA4.
    rows.push({date,pagePath:ga4PathCanonico(pagePath),sessions,pageViews,
      temperatureName:campaignTemperature(sessionMedium)});
  }
  return rows;
}
// start/end = null → sem limite naquele lado (mesma convenção de leadsInRange
// / periodTotals — usado pelo "Total - Consolidado" do Resumo diário).
// SEMPRE exclui o dia de hoje: o GA4 tem atraso de processamento e os dados
// de "hoje" ainda não fecharam — contá-los distorceria Connect Rate, Tx conv
// Pg cadastro e a tabela de página. Vale independente do range pedido (se o
// range pedir "hoje", ele simplesmente não aparece).
function ga4RowsInRange(start,end,temp){
  const map={quente:"Quente",morno:"Morno",frio:"Frio"};
  const today=todayISO();
  return S.ga4Rows.filter(r=>r.date!==today&&(start===null||r.date>=start)&&(end===null||r.date<=end)&&(!temp||temp==="todos"||r.temperatureName===map[temp]));
}
function ga4Metrics(start,end,temp){
  const rows=ga4RowsInRange(start,end,temp);
  return rows.reduce((a,r)=>({sessions:a.sessions+r.sessions,pageViews:a.pageViews+r.pageViews}),{sessions:0,pageViews:0});
}
// Tabela "Página (GA4)" da aba Principal: sessões por Page Path no período,
// casadas com os cadastros REAIS daquela página — a Base leads tem a coluna
// "path" (a página onde a pessoa se cadastrou), que usa o mesmo valor do
// "Page Path" da Base GA4 (ex.: "/v1/h3/f"). Nada de estimativa/rateio:
// cada cadastro é contado só na página em que ele realmente aconteceu.
// Quantas pessoas chegaram na página de captura no período, pela fonte
// configurada em FONTE_PAGINA. Devolve junto o rótulo da fonte, pra que a
// tela diga de onde veio o número em vez de deixar o leitor adivinhar.
function paginaMetrics(start,end,temp){
  if(FONTE_PAGINA==="meta"){
    const m=sumMetaRows(metaRowsFiltered(start,end,temp));
    return{sessions:m.lpv||0,fonte:"gerenciador"};
  }
  const g=ga4Metrics(start,end,temp);
  return{sessions:g.sessions,fonte:"GA4"};
}
function fontePaginaLabel(){ return FONTE_PAGINA==="meta"?"gerenciador":"GA4"; }

function getGA4PageRows(start,end){
  const rows=ga4RowsInRange(start,end,"todos");
  const byPath={};
  for(const r of rows){
    const key=r.pagePath||"(sem página)";
    if(!byPath[key])byPath[key]={pagePath:key,sessions:0};
    byPath[key].sessions+=r.sessions;
  }
  const leadsTrafego=leadsForChannel(leadsInRange(start,end),"trafego");
  const cadastrosByPath={};
  for(const l of leadsTrafego){
    const key=l.path?ga4PathCanonico(l.path):"(sem página)";
    cadastrosByPath[key]=(cadastrosByPath[key]||0)+1;
  }
  // Garante que uma página com cadastro apareça mesmo sem sessão de GA4
  // registrada no período (ex.: GA4 ainda não propagou aquele dia).
  for(const key in cadastrosByPath){
    if(!byPath[key])byPath[key]={pagePath:key,sessions:0};
  }
  // Sessão digitada à mão manda no número do GA4 (ver S.manualSessions).
  // "sessionsGA4" fica guardado pra mostrar de onde veio o valor quando a
  // pessoa apagar o campo.
  return Object.values(byPath).map(p=>{
    const cadastros=cadastrosByPath[p.pagePath]||0;
    const manual=S.manualSessions[p.pagePath];
    const sessions=(manual!=null&&manual>0)?manual:p.sessions;
    return{...p,sessions,sessionsGA4:p.sessions,manual:manual!=null&&manual>0,cadastros,
      convPagina:sessions>0?(cadastros/sessions)*100:null};
  }).sort((a,b)=>b.sessions-a.sessions);
}

// ── Load data ─────────────────────────────────────────────────────────────
async function loadData(){
  // Guarda extra: se o funil ativo não tiver sheetId configurado, nem tenta
  // buscar — evita fetch com URL quebrada ("…/d/null/gviz/…").
  if(!SHEET_ID){
    S.error=`Funil "${FUNIS[S.funilAtivo].label}" ainda não tem planilha configurada — passe o link do Google Sheets pra eu conectar (preencher sheetId em FUNIS.mdi).`;
    S.loading=false; render();
    return;
  }
  S.loading=true; S.error=null; render();
  try{
    // A pesquisa vem junto do bloco essencial: sem ela não há quiz nem faixa,
    // e as duas coisas aparecem já na primeira tela.
    const [metaCsv, leadsCsv, pesquisaCsv] = await Promise.all([
      fetchSheetCSV(SHEET_META_NAME),
      fetchSheetCSV(SHEET_LEADS_NAME),
      fetchSheetCSVOpt(SHEET_PESQUISA_NAME),
    ]);
    const metaRowsRaw = parseRows(parseCSVText(metaCsv));
    const leadsRowsRaw = parseRows(parseCSVText(leadsCsv));
    const pesquisaByEmail = processPesquisa(parseRows(parseCSVText(pesquisaCsv)));
    S.pesquisaByEmail = pesquisaByEmail;

    // ── Base Meta (investimento) ──
    const mD={}, metaRows=[], adIdMap={};
    for(const r of metaRowsRaw){
      const d=toISO(r["Date"]);if(!d)continue;
      const sp=spendUSD(r); // convertido pra dólar pela moeda da conta (ver metaSpendToUSD)
      const cl=parseInt(r["Action Link Clicks"]||0)||0;
      const im=parseInt(r["Impressions"]||0)||0;
      const al=parseInt(r["Action Leads"]||0)||0;
      // Visualizações da página de destino — é o equivalente do gerenciador a
      // uma "sessão" na página de captura. ⚠️ A exportação atual da Base Meta -
      // Captação NÃO traz esta coluna; sem ela o Connect Rate fica "—" e a Tx
      // conv Pg cai na aproximação por cliques. É só incluir "Action Landing
      // Page View" no export que as duas métricas ligam sozinhas.
      const lpv=parseInt(r["Action Landing Page View"]||0)||0;
      const vv=parseInt(r["Action Video View"]||0)||0;
      const adId=(r["Ad ID"]||"").trim();
      const adName=(r["Ad Name"]||"").trim();
      const campId=(r["Campaign ID"]||"").trim();
      const campName=(r["Campaign Name"]||"").trim();
      const adsetName=(r["Adset Name"]||"").trim();
      const igUrl=(r["Instagram Permalink URL"]||"").trim();
      const platform=(r["Publisher Platform (Breakdown)"]||"").trim();

      if(!mD[d])mD[d]={spend:0,clicks:0,impressions:0,actionLeads:0,videoViews:0,lpv:0};
      mD[d].spend+=sp;mD[d].clicks+=cl;mD[d].impressions+=im;mD[d].actionLeads+=al;mD[d].videoViews+=vv;mD[d].lpv+=lpv;

      metaRows.push({date:d,adId,adName,campId,campName,adsetName,spend:sp,clicks:cl,impressions:im,actionLeads:al,videoViews:vv,lpv,igUrl,platform,
        temperatureName:campaignTemperature(campName)});

      if(adId&&!adIdMap[adId])adIdMap[adId]={adName,campName,campId,adsetName,igUrl};
      if(adId&&igUrl&&!adIdMap[adId].igUrl)adIdMap[adId].igUrl=igUrl;
    }

    // ── Leads reais (Base leads) ──
    // Dedup por telefone/e-mail (mesmo critério das fichas do Carrinho):
    // uma pessoa pode reenviar o formulário mais de uma vez (reabrir a
    // página, refazer o quiz, etc.) e isso infla a contagem de leads. Monta
    // TODAS as linhas primeiro (leadsRowsAll) e só depois de-duplica,
    // mantendo a inscrição mais antiga de cada pessoa — leadsByDate (usado
    // no "leads/dia" do resumo e do planejado x realizado) é contado já em
    // cima da lista deduplicada, não da lista crua.
    const leadsRowsAll=[];
    // Gabarito de páginas + ids da Base Meta: usados pra pôr cada valor da
    // linha no campo certo, mesmo quando a exportação trocou as colunas.
    const paginasCaptura=paginasCapturaConhecidas(leadsRowsRaw);
    const campIds=new Set(metaRows.map(m=>m.campId).filter(Boolean));
    const nomesMeta=nomesDaBaseMeta(metaRows);
    let leadsDescartadas=0, leadsDataCorrigida=0;
    for(const r of leadsRowsRaw){
      const parsed=dataLeadBR(r);if(!parsed)continue;
      // ── Data da lead: a MAIS ANTIGA entre a Base leads e a Base pesquisa ──
      // Quando a mesma pessoa existe nas duas bases, vale a data mais antiga
      // das duas. A Base leads não é confiável como fonte de data: importação
      // manual grava a lista inteira com a data da importação, não a do
      // cadastro, e aí o dia da importação ganha centenas de "leads novas"
      // enquanto os dias de origem ficam vazios.
      // No caminho normal a pesquisa é respondida DEPOIS do cadastro, então a
      // data dela é igual ou posterior e nada muda — ela só vence quando é
      // anterior.
      // ⚠️ Roda ANTES do corte de data e ANTES do dedup: a data corrigida é
      // que vale pras duas coisas.
      const emailLead=normalizeEmail(leadCol(r,"email"));
      const pesq=emailLead?(pesquisaByEmail[emailLead]||null):null;
      let date=parsed.date, ms=parsed.ms, dataDaPesquisa=false;
      if(pesq){
        const pq=toISOLead(pesq[PESQUISA_COLS.criadoEm]);
        if(pq&&pq.ms<ms){ date=pq.date; ms=pq.ms; dataDaPesquisa=true; }
      }
      // Cadastro anterior ao início da captação: fora, antes do dedup.
      if(antesDaCaptacao(date)){ leadsDescartadas++; continue; }
      if(dataDaPesquisa)leadsDataCorrigida++;

      const utm=realinhaLead(r,adIdMap,campIds,paginasCaptura,nomesMeta);
      const utmMed=utm.medium;
      const utmCont=utm.content||utm.term;
      const rawAdId=extractIdSuffix(utmCont);
      const rawAdName=extractNamePrefix(utmCont);
      const rawCampName=extractNamePrefix(utmMed);

      let adName=rawAdName, campName=rawCampName;
      if(rawAdId&&adIdMap[rawAdId]){
        adName=adIdMap[rawAdId].adName||rawAdName;
        campName=adIdMap[rawAdId].campName||rawCampName;
      }
      if(!adName)adName=SEM_UTM_LABEL;
      if(!campName)campName=SEM_UTM_LABEL;

      // ── Canal (Tráfego × Orgânico) ──────────────────────────────────────
      // Critério pelo utm_source:
      //  • começa com "FBAds"  → Tráfego (Meta Ads, com UTM reconhecida)
      //  • vazio/em branco     → Tráfego sem UTM (ainda é tráfego pago — só
      //                          não veio com o parâmetro, por falha de
      //                          tracking; não é orgânico)
      //  • qualquer outro valor → Orgânico (fonte com nome próprio, ainda não
      //                          vista nesta base — ex.: disparo/lista/bio)
      // Hoje (02/08/26) a base só tem FBAds_* e vazio, então "organico"
      // fica em 0 até aparecer um utm_source de fato orgânico nos dados.
      const platformName=(r["platform_name"]||"").trim();
      const utmSourceRaw=utm.source;
      const hasUtm=utmSourceRaw.length>0;
      const pathLead=pathFromUrl(utm.url);
      // Página orgânica manda em tudo: a lead é Orgânico mesmo que venha com
      // utm_source FBAds ou sem UTM (ver LEAD_PATHS_ORGANICOS).
      const channel=pathOrganico(pathLead)?"organico"
        :((!hasUtm||utmSourceRaw.startsWith("FBAds"))?"trafego":"organico");
      // Pesquisa da lead (cruzada por e-mail, já buscada no topo do laço).
      // Responder a pesquisa É o critério de "quiz respondido" — a Base leads
      // não tem coluna pra isso.
      const scoreQuiz=scoreLead(pesq);

      leadsRowsAll.push({
        date,ms,
        dataDaPesquisa,  // true = a data veio da pesquisa (era mais antiga)
        path:pathLead, // página onde a lead se cadastrou (bate com "Page Path" da Base GA4)
        quizOk:!!pesq,
        // faixa: só existe quando a tabela de pontos estiver preenchida
        // (ver SCORE_TABELA_PRONTA). Até lá, fica vazia e as métricas de
        // faixa aparecem como "—" em vez de um número inventado.
        faixa:faixaFromScore(scoreQuiz),
        score:scoreQuiz,
        name:(r["Nome"]||r["Nombre"]||r["name"]||"").trim(),
        email:emailLead,                                  // já normalizado — usado tb como chave de dedup
        phone:normalizePhone(leadCol(r,"telefone")),      // já normalizado — usado tb como chave de dedup
        utmSource:utmSourceRaw||SEM_UTM_LABEL,
        platformName,channel,hasUtm,
        temperatureName:campaignTemperature(campName),
        adName,campName,
        // As 6 respostas vêm da linha da Base pesquisa cruzada acima — nomes
        // de coluna em SCORE_COLS, os mesmos usados no score/faixa, então
        // trocar o cabeçalho lá conserta score e aba Análise qualificação de
        // uma vez só.
        idade:pesq?(pesq[SCORE_COLS.idade]||"").trim():"",
        genero:pesq?(pesq[SCORE_COLS.genero]||"").trim():"",
        situacao:pesq?(pesq[SCORE_COLS.situacao]||"").trim():"",
        conhecimento:pesq?(pesq[SCORE_COLS.conhecimento]||"").trim():"",
        tecnica:pesq?(pesq[SCORE_COLS.tecnica]||"").trim():"",
        renda:pesq?(pesq[SCORE_COLS.renda]||"").trim():"",
      });
    }
    // ── Leads que só existem na Base pesquisa ─────────────────────────────
    // Mesma data de corte e mesmo dedup das demais: entram na lista ANTES de
    // dedupByContact, então se a pessoa aparecer nas duas bases vale sempre o
    // cadastro real da Base leads (mais antigo) e nada é duplicado.
    let leadsDaPesquisa=0;
    if(LEADS_SO_DA_PESQUISA){
      // O "já é lead" olha a Base leads INTEIRA, inclusive as linhas que o
      // corte de data descartou. Sem isso, quem tem cadastro antigo (cortado)
      // e respondeu a pesquisa depois voltaria pela porta dos fundos, com a
      // data da pesquisa — seria ressuscitar justamente o que o corte tirou.
      const jaTemLead=new Set(leadsRowsRaw.map(r=>normalizeEmail(leadCol(r,"email"))).filter(Boolean));
      for(const em in pesquisaByEmail){
        if(!em||jaTemLead.has(em))continue;
        const pq=pesquisaByEmail[em];
        const parsed=toISOLead(pq[PESQUISA_COLS.criadoEm]);
        if(!parsed)continue;                      // sem data não dá pra alocar no período
        const {date,ms}=parsed;
        if(antesDaCaptacao(date))continue;
        const scoreQuiz=scoreLead(pq);
        leadsDaPesquisa++;
        leadsRowsAll.push({
          date,ms,
          path:"",                                // não veio página nenhuma
          quizOk:true,                            // respondeu a pesquisa, por definição
          faixa:faixaFromScore(scoreQuiz),
          score:scoreQuiz,
          name:"",
          email:em,
          phone:normalizePhone(pq["telefone"]),
          utmSource:SO_PESQUISA_LABEL,
          platformName:"",
          channel:"trafego",                      // decisão do usuário: conta como tráfego
          hasUtm:false,
          temperatureName:campaignTemperature(SEM_UTM_LABEL),
          adName:SEM_UTM_LABEL, campName:SEM_UTM_LABEL,
          soDaPesquisa:true,
          idade:(pq[SCORE_COLS.idade]||"").trim(),
          genero:(pq[SCORE_COLS.genero]||"").trim(),
          situacao:(pq[SCORE_COLS.situacao]||"").trim(),
          conhecimento:(pq[SCORE_COLS.conhecimento]||"").trim(),
          tecnica:(pq[SCORE_COLS.tecnica]||"").trim(),
          renda:(pq[SCORE_COLS.renda]||"").trim(),
        });
      }
    }
    const leadsRows=dedupByContact(leadsRowsAll);
    const leadsByDate={};
    for(const l of leadsRows)leadsByDate[l.date]=(leadsByDate[l.date]||0)+1;

    S.meta=mD; S.metaRows=metaRows; S.adIdMap=adIdMap;
    S.leadsRows=leadsRows; S.leadsRowsRaw=leadsRowsAll; S.leadsByDate=leadsByDate;
    S.leadsDescartadas=leadsDescartadas;
    S.leadsDataCorrigida=leadsDataCorrigida;
    S.leadsDaPesquisa=leadsDaPesquisa;

    const allDates=[...new Set([...Object.keys(mD),...Object.keys(leadsByDate)])].sort();
    S.updated=allDates.length?fDateBR(allDates[allDates.length-1]):"—";

    if(!S.startDate){
      // A Base leads traz ~20 cadastros antigos re-etiquetados (maio/junho),
      // de antes do lançamento. Sem isto o período padrão abria em 01/05 e
      // diluía tudo: CPL, faixas e gráficos vinham misturados com base velha.
      // O padrão passa a começar no primeiro dia do PLANO de captação.
      const inicioPlano=(PLANO_DIARIO[0]||{}).date;
      let first=allDates[0]||todayISO();
      if(inicioPlano&&inicioPlano>first) first=inicioPlano;
      S.startDate=first;S.endDate=todayISO();S.activeQuick="";
    }
  }catch(e){
    S.error="Erro ao carregar dados do Google Sheets: "+e.message;
    console.error(e);
  }

  // A partir daqui o essencial (Captação) já está pronto — libera a tela.
  // As seções abaixo (etapas, Carrinho, GA4) são buscadas EM PARALELO e SEM
  // bloquear esse loading, cada uma no seu próprio try/catch: se uma aba
  // travar, atrasar ou não existir, o resto do dashboard (que já está de
  // pé) continua normal — só a seção daquela aba demora um pouco mais pra
  // aparecer, em vez de prender o "Carregando dados…" pra sempre.
  S.loading=false;
  render();

  // Etapas Aquecimento/Lembrete/Aulas — cada uma no seu próprio try/catch.
  // Antes as três vinham num Promise.all: bastava UMA aba faltar (nome
  // errado, planilha não compartilhada) pra derrubar as três de uma vez, e o
  // único sinal era um console.error que ninguém vê. Agora uma aba quebrada
  // não afeta as outras, e o erro fica guardado em S.stageErrors pra aparecer
  // na própria página da etapa — em vez do genérico "nenhum dado carregado",
  // que não distingue "aba vazia" de "aba não encontrada".
  carregarEtapa("aquecimento", SHEET_AQUECIMENTO_NAME, rows=>{S.aquecimentoRows=rows;});
  carregarEtapa("lembrete",    SHEET_LEMBRETE_NAME,    rows=>{S.lembreteRows=rows;});
  carregarEtapa("aulas",       SHEET_AULAS_NAME,       rows=>{S.aulasRows=rows;});
  carregarEtapa("grupovip",    SHEET_GRUPO_VIP_NAME,   rows=>{S.grupoVipRows=rows;});

  // Mídia do Carrinho (aba própria).
  (async()=>{
    try{
      const carrinhoMetaCsv = await fetchSheetCSVOpt(SHEET_CARRINHO_META_NAME);
      S.carrinhoMetaRows = parseStageRows(parseRows(parseCSVText(carrinhoMetaCsv)));
      render();
    }catch(e){
      console.error("Erro ao carregar a mídia do Carrinho (Base Carrinho):",e);
    }
  })();

  // Lives da captação (aba própria, só realizado).
  (async()=>{
    try{
      const livesCsv = await fetchSheetCSVOpt(SHEET_LIVES_CAPTACAO_NAME);
      S.livesCaptacaoRows = parseStageRows(parseRows(parseCSVText(livesCsv)));
      render();
    }catch(e){
      console.error("Erro ao carregar as lives da captação (Base Meta - lives captação):",e);
    }
  })();

  // Vendas do Carrinho (aba "Base Vendas"). Roda depois da Base Meta porque
  // usa S.adIdMap pra resolver o nome do anúncio a partir da UTM da venda.
  (async()=>{
    try{
      const vendasCsv = await fetchSheetCSVOpt(SHEET_CARRINHO_VENDAS_NAME);
      processCarrinhoVendas(parseRows(parseCSVText(vendasCsv)));
      render();
    }catch(e){
      console.error("Erro ao carregar vendas do Carrinho (Base Vendas):",e);
    }
  })();

  // Base GA4 (dados de página) — usada pra Connect Rate e Tx conv Pg
  // cadastro reais.
  (async()=>{
    try{
      const ga4Csv = await fetchSheetCSVOpt(SHEET_GA4_NAME);
      S.ga4Rows = processGA4(parseRows(parseCSVText(ga4Csv)));
      render();
    }catch(e){
      console.error("Erro ao carregar dados de página (Base GA4):",e);
    }
  })();

}

// Carrega uma aba de etapa isoladamente. Guarda o erro em S.stageErrors[chave]
// pra que a página da etapa possa mostrar o motivo real da falha.
async function carregarEtapa(chave, sheetName, aplicar){
  if(!sheetName) return;
  try{
    const rows=parseStageRows(parseRows(parseCSVText(await fetchSheetCSV(sheetName))));
    aplicar(rows);
    delete S.stageErrors[chave];
    if(rows.length===0) S.stageErrors[chave]=`A aba "${sheetName}" respondeu, mas sem nenhuma linha de dado — confira se ela tem conteúdo e se a coluna "Date" está preenchida.`;
    render();
  }catch(e){
    S.stageErrors[chave]=e.message||String(e);
    console.error(`Erro ao carregar a etapa ${chave} (aba "${sheetName}"):`,e);
    render();
  }
}

// ── Derived metrics ───────────────────────────────────────────────────────
// channel: "total" (tudo) | "trafego" (platform_name=Meta) | "organico" (sem UTM)
// Investimento só existe pro tráfego pago (é a única fonte de custo na Base
// Meta) — em "organico" o investimento é sempre 0; em "total" soma-se todo o
// gasto (blended) contra o total de leads (tráfego + orgânico).
function leadsForChannel(rows,channel){
  if(!channel||channel==="total")return rows;
  return rows.filter(l=>l.channel===channel);
}
// temp: "todos" | "quente" | "morno" | "frio" — comparado com a temperatura
// extraída do NOME DA CAMPANHA (ver campaignTemperature), tanto nos leads
// quanto nas linhas da Base Meta — isso permite filtrar investimento também,
// já que cada campanha do Meta Ads já nasce com a temperatura no nome.
function leadsForTemp(rows,temp){
  if(!temp||temp==="todos")return rows;
  const map={quente:"Quente",morno:"Morno",frio:"Frio"};
  return rows.filter(l=>l.temperatureName===map[temp]);
}
function sumMetaRows(rows){
  return rows.reduce((a,r)=>({spend:a.spend+r.spend,clicks:a.clicks+r.clicks,impressions:a.impressions+r.impressions,actionLeads:a.actionLeads+r.actionLeads,lpv:a.lpv+(r.lpv||0)}),
    {spend:0,clicks:0,impressions:0,actionLeads:0,lpv:0});
}
// start/end = null → sem limite naquele lado (mesma convenção de leadsInRange)
function metaRowsFiltered(start,end,temp){
  let rows=S.metaRows.filter(r=>(start===null||r.date>=start)&&(end===null||r.date<=end));
  if(temp&&temp!=="todos"){
    const map={quente:"Quente",morno:"Morno",frio:"Frio"};
    rows=rows.filter(r=>r.temperatureName===map[temp]);
  }
  return rows;
}
function getDaily(start,end,channel="total",temp="todos"){
  const allDates=new Set([...Object.keys(S.meta),...Object.keys(S.leadsByDate)]);
  return Array.from(allDates).sort().filter(d=>d>=start&&d<=end).map(date=>{
    const m=sumMetaRows(metaRowsFiltered(date,date,temp));
    const dayLeadsAll=S.leadsRows.filter(l=>l.date===date);
    const leads=leadsForTemp(leadsForChannel(dayLeadsAll,channel),temp).length;
    // GAP usa leads TOTAIS (sem dedup) — o gerenciador do Meta (actionLeads)
    // também não deduplica por contato, então comparar contra a contagem já
    // deduplicada infla o GAP artificialmente. O gráfico de volume continua
    // mostrando "leads" (deduplicado) normalmente — só o GAP muda a base.
    const dayLeadsAllRaw=S.leadsRowsRaw.filter(l=>l.date===date);
    const leadsTotal=leadsForTemp(leadsForChannel(dayLeadsAllRaw,channel),temp).length;
    const spend=channel==="organico"?0:m.spend;
    const actionLeads=m.actionLeads||0;
    // GAP % = diferença entre o que o gerenciador (Meta) reportou e os leads
    // totais da planilha (sem dedup), relativa aos leads totais. Positivo =
    // Meta reportou mais leads do que realmente caíram na planilha
    // (duplicidade/atraso etc).
    const gapPct=leadsTotal>0?((actionLeads-leadsTotal)/leadsTotal)*100:null;
    return{date,label:fDate(date),spend,leads,actionLeads,gapPct,
      cpl:leads>0?spend/leads:0};
  });
}
// Séries diárias de qualidade (faixa/quiz/temperatura), % sempre sobre
// quem respondeu naquele dia especificamente (dias com poucos respondentes
// podem oscilar bastante — é esperado).
function getDailyQuality(start,end,channel="total",temp="todos"){
  const allDates=new Set([...Object.keys(S.meta),...Object.keys(S.leadsByDate)]);
  return Array.from(allDates).sort().filter(d=>d>=start&&d<=end).map(date=>{
    const q=qualityMetrics(date,date,channel,temp);
    return{date,label:fDate(date),...q};
  });
}
function getTotals(daily){
  return daily.reduce((a,d)=>({spend:a.spend+d.spend,leads:a.leads+d.leads}),{spend:0,leads:0});
}
// Investimento/leads/custo-lead da aba Principal, considerando os filtros de
// canal e temperatura. OBS: investimento/CPC/CTR/CPM só reagem ao canal — a
// Base Meta não segmenta gasto por temperatura de público, então filtrar por
// temperatura só restringe a contagem de leads/qualidade, não o investimento.
function principalTotals(start,end,channel,temp="todos"){
  // Gasto/cliques/impressões filtrados pela temperatura da campanha (nome da
  // campanha já indica quente/morno/frio) — não é mais um "blended" único.
  const m=sumMetaRows(metaRowsFiltered(start,end,temp));
  const rows=leadsForTemp(leadsForChannel(leadsInRange(start,end),channel),temp);
  const leads=rows.length;
  const spend=channel==="organico"?0:m.spend;
  const cpl=(spend>0&&leads>0)?spend/leads:null;
  return{spend,leads,cpl,clicks:m.clicks,impressions:m.impressions,actionLeads:m.actionLeads,lpv:m.lpv};
}
// % de faixa/quiz/temperatura — sempre sobre quem respondeu (não-resposta não
// entra no denominador), exceto a própria taxa de resposta do quiz, cujo
// denominador é o total de leads do canal/período.
function qualityMetrics(start,end,channel,temp="todos"){
  const rows=leadsForTemp(leadsForChannel(leadsInRange(start,end),channel),temp);
  const total=rows.length;
  const quizRows=rows.filter(l=>l.quizOk);
  const quizPct=total>0?(quizRows.length/total)*100:null;
  // null (vira "—" na tela) quando ninguém respondeu OU quando a tabela de
  // pontos ainda não foi preenchida — sem isso a divisão daria 0%, e um zero
  // pintado de vermelho parece resultado ruim em vez de "ainda não calculado".
  const faixaPct=f=>(quizRows.length>0&&SCORE_TABELA_PRONTA)?(quizRows.filter(l=>l.faixa===f).length/quizRows.length)*100:null;
  const faixaPcts=Object.fromEntries(FAIXA_LETTERS.map(l=>[FAIXA_FIELD_KEY[l],faixaPct(l)]));
  // Tx quente / Tx frio: % das leads do período cuja CAMPANHA é de público
  // quente / frio (ver campaignTemperature). Denominador = só as leads
  // CLASSIFICADAS (quente, morno ou frio); quem não tem campanha fica fora.
  const t=tempPcts(rows);
  return{total,quizRespondidoN:quizRows.length,quizPct,...faixaPcts,...t};
}
// Percentuais por temperatura de campanha, reaproveitados pela aba Principal
// e pelo Resumo diário (mesma conta nos dois lugares).
function tempPcts(rows){
  const cnt=t=>rows.filter(l=>l.temperatureName===t).length;
  const q=cnt("Quente"), m=cnt("Morno"), f=cnt("Frio");
  // Denominador = só quem TEM temperatura. Lead sem UTM (e as que vieram só
  // da pesquisa) não tem campanha, logo não é quente, morno nem frio — ficava
  // no denominador puxando as três taxas pra baixo e fazendo a soma não
  // fechar 100%. Agora quente + morno + frio = 100% sempre.
  // "classificadas" vai junto pra tela poder mostrar sobre quantas leads a
  // conta foi feita, e "semTemperatura" quantas ficaram de fora.
  const n=q+m+f, fora=rows.length-n;
  return{
    quenteN:q, mornoN:m, frioN:f,
    classificadas:n, semTemperatura:fora,
    quentePct:n>0?(q/n)*100:null,
    mornoPct:n>0?(m/n)*100:null,
    frioPct:n>0?(f/n)*100:null,
    quenteMornoPct:n>0?((q+m)/n)*100:null,
    quenteMornoN:q+m,
  };
}
function fPctOrDash(v){ return v==null?"—":fPct(v); }
// Pacote de métricas usado no Resumo diário: sempre "total" (tráfego+orgânico),
// pois o resumo consolidado do lançamento não segmenta por canal.
function resumoMetrics(s,e){
  const per=periodTotals(s,e);
  // TODAS as métricas de qualidade do Resumo diário são calculadas SÓ sobre
  // leads de TRÁFEGO (faixas, % quente/frio/quente+morno, tx de resposta da
  // pesquisa). Orgânico fica de fora do numerador e do denominador —
  // antes o canal era "total" e as faixas não batiam com a aba de Captação
  // filtrada por tráfego. As linhas "Cadastros no AC Orgânico/Total"
  // continuam existindo, mas são só contagem informativa.
  const qm=qualityMetrics(s,e,"trafego");
  const rowsAll=leadsInRange(s,e);
  const rows=leadsForChannel(rowsAll,"trafego");
  const leadsTrafego=rows.length;
  const leadsOrganico=leadsForChannel(rowsAll,"organico").length;
  // Tx conv Pg cadastro: leads de tráfego ÷ quem chegou na página, pela
  // fonte configurada (ver FONTE_PAGINA). SEM fallback aqui (diferente de
  // trafficMetrics/Métricas de Tráfego): o Resumo diário usa só dado real —
  // fica "—" quando não há número de página no período, em vez de aproximar
  // por cliques.
  const pag=paginaMetrics(s,e,"todos");
  // Sem número de página no período (é o caso enquanto a Base Meta não trouxer
  // "Action Landing Page View"), a taxa cai pra cadastros ÷ CLIQUES. Não é a
  // mesma coisa — é o funil inteiro do clique ao cadastro, não da página pro
  // cadastro —, por isso txConvPgAprox marca o número e a tela avisa.
  const txConvPgAprox=pag.sessions===0&&per.clicks>0;
  const txConvPg=pag.sessions>0?(leadsTrafego/pag.sessions)*100
    :(per.clicks>0?(leadsTrafego/per.clicks)*100:null);
  // Connect Rate: quem chegou na página ÷ cliques no link. Sem o número de
  // página não existe aproximação honesta — fica "—" mesmo.
  const connectRate=(per.clicks>0&&pag.sessions>0)?(pag.sessions/per.clicks)*100:null;
  // Custo por cadastro AC Tráfego: todo o gasto é pago (tráfego), então o
  // custo/lead "oficial" da meta é sobre os cadastros de tráfego — não o
  // blended (que dilui com orgânico, hoje sempre 0 leads).
  const cpl=leadsTrafego>0?per.spend/leadsTrafego:null;
  return{...per,...qm,leadsTrafego,leadsOrganico,cpl,txConvPg,txConvPgAprox,connectRate,paginaSessions:pag.sessions,paginaFonte:pag.fonte};
}
// s,e = null → todo o período (all-time)
function periodTotals(s,e){
  const dates=new Set([...Object.keys(S.leadsByDate),...Object.keys(S.meta)]);
  let leads=0,spend=0,clicks=0,impressions=0,actionLeads=0,lpv=0;
  for(const d of dates){
    if(s!==null&&d<s)continue;
    if(e!==null&&d>e)continue;
    leads+=S.leadsByDate[d]||0;
    const m=S.meta[d];
    if(m){ spend+=m.spend||0; clicks+=m.clicks||0; impressions+=m.impressions||0; actionLeads+=m.actionLeads||0; lpv+=m.lpv||0; }
  }
  return{leads,spend,clicks,impressions,actionLeads,lpv,
    cpl:leads>0?spend/leads:0,
    cpc:clicks>0?spend/clicks:0,
    ctr:impressions>0?(clicks/impressions)*100:0,
    cpm:impressions>0?(spend/impressions)*1000:0};
}
// start/end = null → sem limite naquele lado (usado pelo "Total - Consolidado")
function leadsInRange(start,end){
  return S.leadsRows.filter(l=>(start===null||l.date>=start)&&(end===null||l.date<=end));
}
// Mesma coisa que leadsInRange, mas sobre a lista SEM dedup — só usado pra
// mostrar "leads totais" (toda submissão, mesmo repetida) ao lado do número
// de leads únicas na aba Principal (ver kpiCard "Leads captados").
function leadsInRangeRaw(start,end){
  return S.leadsRowsRaw.filter(l=>(start===null||l.date>=start)&&(end===null||l.date<=end));
}
// ── Campanhas / Anúncios: agregação com cross-filtering ───────────────────
function getMetaRowsInRange(start,end){
  return S.metaRows.filter(r=>r.date>=start&&r.date<=end);
}
// As tabelas de Campanhas e Anúncios contam SÓ lead de TRÁFEGO. Uma lead
// pode carregar UTM de campanha e mesmo assim não ser tráfego — é o caso de
// quem se cadastra numa página 100% orgânica (LEAD_PATHS_ORGANICOS) com a UTM
// de um anúncio ainda grudada no link, ou de quem vem com utm_source próprio
// (e-mail, WhatsApp). Sem este filtro, essas leads entravam na tabela de
// campanhas mas não no filtro "Tráfego" da Principal, e a aba de campanhas
// terminava com MAIS leads que a Principal — o contrário do esperado, já que
// a Principal é que tem a mais as leads de tráfego SEM UTM.
function ehLeadDeTrafego(l){ return l.channel==="trafego"; }
function getLeadsRowsForCamp(start,end,campName){
  return S.leadsRows.filter(l=>ehLeadDeTrafego(l)&&l.date>=start&&l.date<=end&&l.campName===campName);
}
// Mesma coisa, mas na base SEM dedup — usada só pro GAP: o gerenciador do
// Meta (actionLeads) não deduplica por contato, então comparar contra a
// contagem já deduplicada infla o GAP artificialmente. Mesmo critério do
// GAP diário da aba Principal (ver getDaily).
function getLeadsRawForCamp(start,end,campName){
  return S.leadsRowsRaw.filter(l=>ehLeadDeTrafego(l)&&l.date>=start&&l.date<=end&&l.campName===campName);
}
function getLeadsRowsForAd(start,end,adName,campFilter){
  return S.leadsRows.filter(l=>{
    if(!ehLeadDeTrafego(l))return false;
    if(l.date<start||l.date>end)return false;
    if(l.adName!==adName)return false;
    if(campFilter&&campFilter.size>0&&!campFilter.has(l.campName))return false;
    return true;
  });
}
// % faixa (sobre quem respondeu o quiz) + % resposta da pesquisa (sobre todos
// os leads daquela campanha/anúncio) — mesma convenção usada na aba Principal.
function qualityFromLeadsArray(leadsArr){
  const total=leadsArr.length;
  const quizRows=leadsArr.filter(l=>l.quizOk);
  const quizPct=total>0?(quizRows.length/total)*100:null;
  // null (vira "—" na tela) quando ninguém respondeu OU quando a tabela de
  // pontos ainda não foi preenchida — sem isso a divisão daria 0%, e um zero
  // pintado de vermelho parece resultado ruim em vez de "ainda não calculado".
  const faixaPct=f=>(quizRows.length>0&&SCORE_TABELA_PRONTA)?(quizRows.filter(l=>l.faixa===f).length/quizRows.length)*100:null;
  const faixaPcts=Object.fromEntries(FAIXA_LETTERS.map(l=>[FAIXA_FIELD_KEY[l],faixaPct(l)]));
  return{quizPct,...faixaPcts};
}
// Célula do GAP na tabela de campanhas: verde até 10%, amarelo de 10% a 20%,
// vermelho acima de 20% — quanto MENOR o GAP, melhor (gerenciador e planilha
// batendo). Negativo (planilha com mais leads que o gerenciador) é tratado
// pelo módulo: o que importa é a distância de zero. O title do <td> mostra a
// conta por trás (gerenciador × planilha sem dedup).
function gapTd(gapPct,actionLeads,leadsRaw){
  if(gapPct==null)return `<td class="mono" style="text-align:right;color:var(--hint)">—</td>`;
  const abs=Math.abs(gapPct);
  const cor=abs<=10?"#34d399":abs<=20?"#fbbf24":"#f87171";
  const sinal=gapPct>0?"+":"";
  return `<td class="mono" style="text-align:right;color:${cor}" title="gerenciador: ${actionLeads} · planilha (sem dedup): ${leadsRaw}">${sinal}${fPct(gapPct)}</td>`;
}
// Agregação de um CONJUNTO de linhas das tabelas de Campanhas/Anúncios —
// usada na linha de TOTAL. Soma os absolutos (investimento, cliques,
// impressões, leads do gerenciador) e RECALCULA as taxas a partir dos totais;
// nunca tira média das linhas, que daria o mesmo peso a uma campanha de $5 e
// a uma de $5.000. As % de faixa e de resposta da pesquisa saem da mesma
// função que as linhas usam, aplicada ao conjunto de leads somado.
function somaLinhas(rows){
  const t=rows.reduce((a,r)=>({
    spend:a.spend+r.spend, clicks:a.clicks+r.clicks,
    impressions:a.impressions+r.impressions, actionLeads:a.actionLeads+(r.actionLeads||0),
    leadsRaw:a.leadsRaw+(r.leadsRaw||0),
  }),{spend:0,clicks:0,impressions:0,actionLeads:0,leadsRaw:0});
  const leadsArr=rows.reduce((a,r)=>a.concat(r._leadsArr||[]),[]);
  const leads=leadsArr.length;
  const q=qualityFromLeadsArray(leadsArr);
  const temRaw=rows.some(r=>r.leadsRaw!=null);
  return {...t,leads,...q,
    gapPct:(temRaw&&t.leadsRaw>0)?((t.actionLeads-t.leadsRaw)/t.leadsRaw)*100:null,
    cpc:t.clicks>0?t.spend/t.clicks:0,
    ctr:t.impressions>0?(t.clicks/t.impressions)*100:0,
    cpm:t.impressions>0?(t.spend/t.impressions)*1000:0,
    cpl:leads>0?t.spend/leads:0};
}
function getCampRows(start,end){
  // As linhas vêm da Base Meta, então "Tráfego sem UTM" já não apareceria
  // aqui; o filtro é uma trava explícita, caso um dia a tabela passe a ser
  // montada a partir das leads.
  const rows=getMetaRowsInRange(start,end).filter(r=>r.campName!==SEM_UTM_LABEL);
  const byCamp={};
  for(const r of rows){
    const cn=r.campName||"(sem campanha)";
    if(!byCamp[cn])byCamp[cn]={campName:cn,spend:0,clicks:0,impressions:0,actionLeads:0};
    byCamp[cn].spend+=r.spend;byCamp[cn].clicks+=r.clicks;byCamp[cn].impressions+=r.impressions;byCamp[cn].actionLeads+=r.actionLeads;
  }
  return Object.values(byCamp).map(c=>{
    const leadsArr=getLeadsRowsForCamp(start,end,c.campName);
    const leads=leadsArr.length;
    const q=qualityFromLeadsArray(leadsArr);
    // GAP % = (leads do gerenciador − leads reais sem dedup) ÷ leads reais.
    // Positivo = o Meta reportou mais do que caiu na planilha. null quando
    // não há lead real no período (divisão por zero).
    const leadsRaw=getLeadsRawForCamp(start,end,c.campName).length;
    const gapPct=leadsRaw>0?((c.actionLeads-leadsRaw)/leadsRaw)*100:null;
    // _leadsArr fica na linha só pra linha de TOTAL poder recalcular as % de
    // faixa/pesquisa sobre o conjunto, sem varrer a base de leads de novo.
    return {...c,leads,leadsRaw,gapPct,_leadsArr:leadsArr,...q,
      cpc:c.clicks>0?c.spend/c.clicks:0, ctr:c.impressions>0?(c.clicks/c.impressions)*100:0,
      cpm:c.impressions>0?(c.spend/c.impressions)*1000:0, cpl:leads>0?c.spend/leads:0};
  });
}
function getAdRows(start,end,selectedCamps){
  const hasSel=selectedCamps&&selectedCamps.size>0;
  let rows=getMetaRowsInRange(start,end);
  if(hasSel)rows=rows.filter(r=>selectedCamps.has(r.campName));
  const byAd={};
  for(const r of rows){
    const an=r.adName||"(sem anúncio)";
    if(!byAd[an])byAd[an]={adName:an,spend:0,clicks:0,impressions:0,actionLeads:0,igUrl:"",camps:new Set()};
    byAd[an].spend+=r.spend;byAd[an].clicks+=r.clicks;byAd[an].impressions+=r.impressions;byAd[an].actionLeads+=r.actionLeads;
    if(!byAd[an].igUrl&&r.igUrl)byAd[an].igUrl=r.igUrl;
    if(r.campName)byAd[an].camps.add(r.campName);
  }
  return Object.values(byAd).map(a=>{
    const leadsArr=getLeadsRowsForAd(start,end,a.adName,hasSel?selectedCamps:null);
    const leads=leadsArr.length;
    const q=qualityFromLeadsArray(leadsArr);
    return {...a,leads,_leadsArr:leadsArr,...q,campNames:[...a.camps].join(", "),
      cpc:a.clicks>0?a.spend/a.clicks:0, ctr:a.impressions>0?(a.clicks/a.impressions)*100:0,
      cpm:a.impressions>0?(a.spend/a.impressions)*1000:0, cpl:leads>0?a.spend/leads:0};
  });
}

// ── Navigation ────────────────────────────────────────────────────────────
// "captacao" e "carrinho" são as abas de topo com sub-abas — Captação:
// Principal, Campanhas e anúncios, Métricas do Tráfego, Análise qualificação;
// Carrinho: Principal, Vendas, Campanhas/Anúncios. As demais
// (Aquecimento, Lembrete, Aulas, Planejado/Realizado, Resumo diário) são

function activePageId(){
  if(S.currentPage==="captacao")return "page-"+S.currentSubPage;
  if(S.currentPage==="carrinho")return "page-carrinho-"+S.carrinhoSubPage;
  return "page-"+S.currentPage;
}
function updatePageVisibility(){
  const id=activePageId();
  document.querySelectorAll(".page").forEach(el=>{
    el.classList.toggle("active",el.id===id);
  });
}
function navTo(page){
  S.currentPage=page;
  window.scrollTo(0,0);
  updatePageVisibility();
  render();
}
function navSub(sub){
  S.currentSubPage=sub;
  window.scrollTo(0,0);
  updatePageVisibility();
  render();
}
function navCarrinhoSub(sub){
  S.carrinhoSubPage=sub;
  window.scrollTo(0,0);
  updatePageVisibility();
  render();
}
function applyQuickCurrent(k){
  const t=todayISO();
  const map={hoje:()=>({s:t,e:t}),ontem:()=>{const y=yesterdayISO();return{s:y,e:y}},
    "7d":()=>({s:nDaysAgoISO(6),e:t}),"30d":()=>({s:nDaysAgoISO(29),e:t}),mes:()=>({s:firstOfMonthISO(),e:t})};
  const r=map[k]?.();if(!r)return;
  S.startDate=r.s;S.endDate=r.e;S.activeQuick=k;render();
}
function onDCCurrent(w,v){
  if(w==="s")S.startDate=v;else S.endDate=v;S.activeQuick="";render();
}
function getCurrentPeriod(){return{s:S.startDate,e:S.endDate,q:S.activeQuick};}

// ── Foco nos campos de digitação ──────────────────────────────────────────
// Todo render reescreve o innerHTML da página inteira, e isso DESTRÓI o
// <input> que acabou de disparar o oninput: o nó novo nasce sem foco, então o
// usuário digitava uma letra e tinha que clicar de novo pra digitar a
// próxima. preservaFoco() anota qual input estava focado (pelo id) e onde
// estava o cursor, roda o render e devolve foco + cursor no nó novo.
// ⚠️ Só funciona se o input tiver id — todos os campos de busca e os de
// digitação manual têm.
function preservaFoco(fn){
  const a=document.activeElement;
  let f=null;
  if(a&&a.tagName==="INPUT"&&a.id){
    f={id:a.id,s:null,e:null};
    // selectionStart estoura em input[type=number]/date em alguns browsers —
    // nesse caso só devolvemos o foco, sem reposicionar o cursor.
    try{ f.s=a.selectionStart; f.e=a.selectionEnd; }catch(_){}
  }
  fn();
  if(!f)return;
  const el=document.getElementById(f.id);
  if(!el)return;
  try{ el.focus({preventScroll:true}); }catch(_){ try{ el.focus(); }catch(__){} }
  if(f.s!=null){ try{ el.setSelectionRange(f.s,f.e); }catch(_){} }
}

function toggleCamp(name){
  if(S.selectedCamps.has(name))S.selectedCamps.delete(name);else S.selectedCamps.add(name);
  renderAnuncios();
}
function clearCamps(){S.selectedCamps.clear();renderAnuncios();}
function setCampSearch(v){S.campSearch=v;preservaFoco(()=>renderAnuncios());}
function toggleAd(name){
  if(S.selectedAds.has(name))S.selectedAds.delete(name);else S.selectedAds.add(name);
  renderAnuncios();

// ── Canvas / Chart helpers ────────────────────────────────────────────────
const DPR=window.devicePixelRatio||1;
const GRID_C="rgba(255,255,255,0.06)";
const TICK_C="#6b7689";

function initCanvas(id,cssW,cssH){
  const c=document.getElementById(id);if(!c)return null;
  cssW=Math.max(cssW,50);cssH=Math.max(cssH,50);
  c.width=Math.round(cssW*DPR);c.height=Math.round(cssH*DPR);
  c.style.width=cssW+"px";c.style.height=cssH+"px";
  const ctx=c.getContext("2d");ctx.scale(DPR,DPR);
  return ctx;
}
function drawLineArea(ctx,xP,yP,vals,color,fill=true){
  if(vals.length<2)return;
  if(fill){
    const n=vals.length;
    ctx.beginPath();ctx.moveTo(xP(0),yP(vals[0]));
    for(let i=1;i<n;i++)ctx.lineTo(xP(i),yP(vals[i]));
    ctx.lineTo(xP(n-1),yP(0));ctx.lineTo(xP(0),yP(0));ctx.closePath();
    const g=ctx.createLinearGradient(0,0,0,ctx.canvas.height/DPR);
    g.addColorStop(0,color+"28");g.addColorStop(1,color+"00");
    ctx.fillStyle=g;ctx.fill();
  }
  ctx.beginPath();ctx.strokeStyle=color;ctx.lineWidth=2;ctx.setLineDash([]);
  ctx.moveTo(xP(0),yP(vals[0]));
  for(let i=1;i<vals.length;i++)ctx.lineTo(xP(i),yP(vals[i]));
  ctx.stroke();
}
// Teto do eixo direito à prova de dia fora da curva. Um único dia esquisito
// (29/09/26: CPL de $312 porque a base de leads veio furada) estica a escala
// e espreme todos os outros contra o zero — a linha vira uma reta e não dá
// mais pra ver quem foi bem ou mal. O teto passa a sair de um limite
// ROBUSTO (mediana e p90 dos dias com CPL, nunca menos que 2× a meta) em vez
// do máximo bruto. Quando não há outlier, o resultado é o mesmo de antes.
function tetoRobusto(vals,meta){
  const v=vals.filter(x=>x>0).sort((a,b)=>a-b);
  if(!v.length)return Math.max(meta||0,1)*1.4;
  // Dia fora da curva = acima de 4× a mediana. O teto olha só os demais, e
  // mantém a folga de 40% e o piso da meta — então, sem outlier nenhum, a
  // conta é idêntica à de antes (maior valor × 1,4).
  const mediana=v[Math.floor(v.length/2)];
  const normais=v.filter(x=>x<=mediana*4);
  const base=normais.length?normais[normais.length-1]:v[v.length-1];
  return Math.max(base,meta||0)*1.4;
}
// Linha com corte no teto: o que passa do limite é desenhado GRUDADO no topo
// e ganha um ponto cheio com o valor real escrito ao lado. O pico continua
// visível e legível — só deixa de mandar na escala.
function drawLineAreaCap(ctx,xP,yP,vals,color,fill,cap,fmt){
  const clip=vals.map(v=>Math.min(v,cap));
  drawLineArea(ctx,xP,yP,clip,color,fill);
  ctx.save();
  vals.forEach((v,i)=>{
    if(v<=cap)return;
    const x=xP(i),y=yP(cap);
    ctx.fillStyle=color;
    ctx.beginPath();ctx.arc(x,y,3.5,0,Math.PI*2);ctx.fill();
    ctx.font="9px 'DM Mono',monospace";ctx.textAlign="center";
    ctx.fillText(fmt?fmt(v):String(Math.round(v)),x,y-7);
  });
  ctx.restore();
}
function drawDualInvCpl(id,data,cssW,cssH){
  const ctx=initCanvas(id,cssW,cssH);if(!ctx)return;
  const P={t:14,r:58,b:28,l:64};
  const cW=cssW-P.l-P.r,cH=cssH-P.t-P.b;
  const lVals=data.map(d=>d.spend||0);
  const rVals=data.map(d=>d.cpl||0);
  const lMax=Math.max(...lVals,0.01)*1.15;
  const rMax=tetoRobusto(rVals,META_CPL);
  const xP=i=>P.l+(data.length>1?i/(data.length-1):0.5)*cW;
  const yPL=v=>P.t+cH-((v)/(lMax))*cH;
  const yPR=v=>P.t+cH-((v)/(rMax))*cH;
  ctx.setLineDash([]);
  for(let i=0;i<=4;i++){
    const y=P.t+(i/4)*cH;
    ctx.strokeStyle=GRID_C;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+cW,y);ctx.stroke();
    ctx.fillStyle=TICK_C;ctx.font="10px 'DM Mono',monospace";
    ctx.textAlign="right";ctx.fillText(fUSDShort(lMax-(i/4)*lMax),P.l-5,y+3.5);
    ctx.textAlign="left";ctx.fillText("R$"+(rMax-(i/4)*rMax).toFixed(0),P.l+cW+5,y+3.5);
  }
  const mY=yPR(META_CPL);
  ctx.strokeStyle=CHART_CPL+"55";ctx.lineWidth=1;ctx.setLineDash([4,3]);
  ctx.beginPath();ctx.moveTo(P.l,mY);ctx.lineTo(P.l+cW,mY);ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle=CHART_CPL;ctx.font="9px 'Inter',sans-serif";ctx.textAlign="left";
  ctx.fillText("Meta "+fUSD(META_CPL),P.l+cW+4,mY-3);
  drawLineArea(ctx,xP,yPL,lVals,CHART_INV,true);
  drawLineAreaCap(ctx,xP,yPR,rVals,CHART_CPL,false,rMax,v=>fUSD(v));
  const step=data.length>60?7:data.length>30?3:data.length>14?2:1;
  ctx.fillStyle=TICK_C;ctx.font="10px 'DM Mono',monospace";ctx.textAlign="center";ctx.setLineDash([]);
  data.forEach((d,i)=>{if(i%step===0)ctx.fillText(d.label,xP(i),P.t+cH+18);});
}
// Mesmo gráfico dual do drawDualInvCpl (Investimento × métrica no eixo

    ctx.fillText("Meta "+fUSD(metaVal),P.l+cW+4,mY-3);

  drawLineArea(ctx,xP,yPL,lVals,CHART_INV,true);

  const step=data.length>60?7:data.length>30?3:data.length>14?2:1;

}
function drawBars(ctx,xP,yP,yZero,vals,color,barW){
  vals.forEach((v,i)=>{
    const x=xP(i)-barW/2, y=Math.min(yP(v),yZero), h=Math.abs(yP(v)-yZero);
    ctx.fillStyle=color+"cc";
    ctx.fillRect(x,y,barW,Math.max(h,v>0?1:0));
  });
}
function drawBarSingle(id,data,key,color,cssW,cssH){
  const ctx=initCanvas(id,cssW,cssH);if(!ctx)return;
  const P={t:14,r:12,b:28,l:40};

  const yP=v=>P.t+cH-(v/maxV)*cH;
  ctx.setLineDash([]);
  for(let i=0;i<=4;i++){
    const y=P.t+(i/4)*cH;
    ctx.strokeStyle=GRID_C;ctx.lineWidth=1;

    ctx.fillText(Math.round(maxV-(i/4)*maxV),P.l-4,y+3);
  }
  drawBars(ctx,xP,yP,P.t+cH,vals,color,barW);
  const step=n>60?7:n>30?3:n>14?2:1;
  ctx.textAlign="center";

// Barras de % do investimento por dia (valor de cada dia ÷ total do período) —
// mesmo esqueleto do drawBarSingle, mas rotulando cada barra em % em vez de

function drawBarPercent(id,data,key,totalVal,color,cssW,cssH){

// Barras (leads/dia, eixo esq.) + linha opcional de GAP% (gerenciador × planilha, eixo dir.)
function drawBarWithGap(id,data,barKey,gapKey,barColor,gapColor,cssW,cssH,showGap){
  const ctx=initCanvas(id,cssW,cssH);if(!ctx)return;
  const P={t:14,r:showGap?50:12,b:28,l:40};
  const cW=cssW-P.l-P.r,cH=cssH-P.t-P.b;
  const vals=data.map(d=>d[barKey]||0);
  const maxV=Math.max(...vals,1)*1.15;
  const n=data.length;
  const barW=Math.max(4,Math.min(18,(cW/Math.max(n,1))*0.7));
  const xP=i=>P.l+(n>1?i/(n-1):0.5)*cW;
  const yP=v=>P.t+cH-(v/maxV)*cH;
  ctx.setLineDash([]);
  for(let i=0;i<=4;i++){
    const y=P.t+(i/4)*cH;
    ctx.strokeStyle=GRID_C;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+cW,y);ctx.stroke();
    ctx.fillStyle=TICK_C;ctx.font="9px 'DM Mono',monospace";ctx.textAlign="right";
    ctx.fillText(Math.round(maxV-(i/4)*maxV),P.l-4,y+3);
  }
  drawBars(ctx,xP,yP,P.t+cH,vals,barColor,barW);
  const step=n>60?7:n>30?3:n>14?2:1;
  ctx.textAlign="center";
  vals.forEach((v,i)=>{
    if(v>0&&(n<=30||i%step===0)){
      ctx.fillStyle="#e8edf6";ctx.font=`bold ${Math.min(10,Math.max(7,barW))}px 'DM Mono',monospace`;
      ctx.fillText(v,xP(i),yP(v)-4);
    }
  });
  if(showGap){
    const gapVals=data.map(d=>d[gapKey]==null?0:d[gapKey]);
    const rMin=Math.min(0,...gapVals)*1.15;
    const rMax=Math.max(...gapVals,1)*1.15;
    const span=(rMax-rMin)||1;
    const yPR=v=>P.t+cH-((v-rMin)/span)*cH;
    for(let i=0;i<=4;i++){
      const y=P.t+(i/4)*cH;
      ctx.fillStyle=gapColor;ctx.font="9px 'Inter',sans-serif";ctx.textAlign="left";
      ctx.fillText((rMax-(i/4)*span).toFixed(0)+"%",P.l+cW+4,y+3);
    }
    if(rMin<0){
      const zY=yPR(0);
      ctx.strokeStyle="rgba(255,255,255,.15)";ctx.lineWidth=1;ctx.setLineDash([3,3]);
      ctx.beginPath();ctx.moveTo(P.l,zY);ctx.lineTo(P.l+cW,zY);ctx.stroke();ctx.setLineDash([]);
    }
    drawLineArea(ctx,xP,yPR,gapVals,gapColor,false);
  }
  ctx.fillStyle=TICK_C;ctx.font="9px 'DM Mono',monospace";ctx.textAlign="center";
  data.forEach((d,i)=>{if(i%step===0)ctx.fillText(d.label,xP(i),P.t+cH+18);});
}
// Múltiplas linhas de % (0-100) — usado nas séries diárias de qualidade
// (Faixa A/B/C/D, % resposta da pesquisa). Pontos nulos (sem resposta no dia) quebram
// a linha em vez de cair pra zero.
// showLabels=true escreve o valor (%) de cada ponto em cima da linha — usado
// no gráfico "% Faixa por dia" pra bater o olho sem precisar passar o mouse.
// Cada série pode opcionalmente trazer `meta` (número 0-100), que desenha uma
// linha tracejada horizontal na cor da série (mesmo padrão do drawMetricLine).
function drawMultiLine(id,data,series,cssW,cssH,showLabels=false){
  const ctx=initCanvas(id,cssW,cssH);if(!ctx)return;
  const P={t:14,r:12,b:28,l:36};
  const cW=cssW-P.l-P.r,cH=cssH-P.t-P.b;
  const n=data.length;
  const xP=i=>P.l+(n>1?i/(n-1):0.5)*cW;
  const yP=v=>P.t+cH-(Math.max(0,Math.min(100,v))/100)*cH;
  ctx.setLineDash([]);
  for(let i=0;i<=4;i++){
    const y=P.t+(i/4)*cH;
    ctx.strokeStyle=GRID_C;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+cW,y);ctx.stroke();
    ctx.fillStyle=TICK_C;ctx.font="9px 'DM Mono',monospace";ctx.textAlign="right";
    ctx.fillText((100-(i/4)*100).toFixed(0)+"%",P.l-4,y+3);
  }
  series.forEach(s=>{
    if(s.meta==null)return;
    const mY=yP(s.meta);
    ctx.strokeStyle=s.color+"55";ctx.lineWidth=1;ctx.setLineDash([4,3]);
    ctx.beginPath();ctx.moveTo(P.l,mY);ctx.lineTo(P.l+cW,mY);ctx.stroke();
    ctx.setLineDash([]);
  });
  series.forEach(s=>{
    const vals=data.map(d=>d[s.key]);
    ctx.beginPath();ctx.strokeStyle=s.color;ctx.lineWidth=2;ctx.setLineDash([]);
    let started=false;
    vals.forEach((v,i)=>{
      if(v==null){started=false;return;}
      if(!started){ctx.moveTo(xP(i),yP(v));started=true;}
      else ctx.lineTo(xP(i),yP(v));
    });
    ctx.stroke();
    vals.forEach((v,i)=>{
      if(v==null)return;
      ctx.beginPath();ctx.fillStyle=s.color;ctx.arc(xP(i),yP(v),2.5,0,7);ctx.fill();
    });
    if(showLabels){
      ctx.font="9px 'DM Mono',monospace";ctx.textAlign="center";
      vals.forEach((v,i)=>{
        if(v==null)return;
        const y=yP(v),hasRoom=y-P.t>13;
        ctx.fillStyle=s.color;
        ctx.fillText(v.toFixed(0)+"%",xP(i),y+(hasRoom?-6:13));
      });
    }
  });
  const step=n>60?7:n>30?3:n>14?2:1;
  ctx.fillStyle=TICK_C;ctx.font="9px 'DM Mono',monospace";ctx.textAlign="center";
  data.forEach((d,i)=>{if(i%step===0)ctx.fillText(d.label,xP(i),P.t+cH+18);});
}
function setupTip(cid,tid,data,lines,padL=58,padR=12){
  const c=document.getElementById(cid),t=document.getElementById(tid);
  if(!c||!t)return;
  c.addEventListener("mousemove",e=>{
    const rect=c.getBoundingClientRect();
    const relX=(e.clientX-rect.left)-padL;
    const cW=rect.width-padL-padR;
    if(relX<0||relX>cW||!data.length){t.style.display="none";return;}
    const d=data[Math.max(0,Math.min(Math.round((relX/cW)*(data.length-1)),data.length-1))];
    let h=`<div class="tl">${d.label||d.date}</div>`;
    lines.forEach(l=>{
      const _v=d[l.key];
      h+=`<div class="tr"><span style="color:${l.color}">${l.name}</span><span class="tv">${_v==null?"—":(l.fmt||fUSD)(+_v)}</span></div>`;
    });
    t.innerHTML=h;t.style.display="block";
    const tw=t.offsetWidth,x=e.clientX-rect.left;
    t.style.left=(x+12+tw>rect.width-8?x-tw-12:x+12)+"px";
    t.style.top=(e.clientY-rect.top-20)+"px";
  });
  c.addEventListener("mouseleave",()=>t.style.display="none");
}

// ── Funil de performance (aba Principal) ──────────────────────────────────
// Uma linha só, do investimento ao faturamento, com as taxas de passagem
// penduradas em cada salto. Respeita os MESMOS filtros da aba Principal
// (período, canal e temperatura) — não é um consolidado paralelo.
//
// De onde vem cada número:
//   Investimento, impressões e cliques → Base Meta (campanhas de captação)
//   Page views                         → fonte configurada em FONTE_PAGINA
//                                        ("gerenciador" = Action Landing Page
//                                        View; "GA4" = sessões da Base GA4)
//   Leads                              → Base leads, já deduplicada
//   Vendas e faturamento               → Base Vendas (checkout), no período
// Resposta canônica da pesquisa (aplica os apelidos de SCORE_ALIASES) —
// usada pelos três indicadores de perfil que ficam sob o CPL.
function respCanonica(v){ const n=normResposta(v); return SCORE_ALIASES[n]||n; }
const FUNIL_PERFIL = {
  desempEst:{campo:"situacao",    label:"Desemp.+Est.", respostas:["estoy desempleado","soy un estudiante"]},
  semConhec:{campo:"conhecimento",label:"No sé nada",   respostas:["no se nada, quiero empezar"]},
  ate300:   {campo:"renda",       label:"Hasta 300$",   respostas:["no tengo ingresos","hasta mxn 5600 ($300 usd) por mes"]},
};
function funilMetrics(start,end,channel,temp){
  const m=sumMetaRows(metaRowsFiltered(start,end,temp));
  const rows=leadsForTemp(leadsForChannel(leadsInRange(start,end),channel),temp);
  const leads=rows.length;
  const spend=channel==="organico"?0:m.spend;
  const impressions=m.impressions||0, clicks=m.clicks||0;
  const pageViews=paginaMetrics(start,end,temp).sessions||0;
  const vendasArr=carrinhoVendasInRange(start,end);
  const vendas=vendasArr.length;
  const faturamento=vendasArr.reduce((a,v)=>a+(v.valorUSD||0),0);
  // Perfil: sempre sobre quem RESPONDEU a pesquisa (mesma convenção das faixas).
  const q=rows.filter(l=>l.quizOk);
  const perfil={};
  for(const k in FUNIL_PERFIL){
    const cfg=FUNIL_PERFIL[k];
    const n=q.filter(l=>cfg.respostas.includes(respCanonica(l[cfg.campo]))).length;
    perfil[k]=q.length>0?(n/q.length)*100:null;
  }
  return{spend,impressions,clicks,pageViews,leads,vendas,faturamento,quizN:q.length,perfil,
    ctr:impressions>0?(clicks/impressions)*100:null,
    cpm:impressions>0?(spend/impressions)*1000:null,
    cpc:clicks>0?spend/clicks:null,
    connectRate:clicks>0?(pageViews/clicks)*100:null,
    convPagina:pageViews>0?(leads/pageViews)*100:null,
    cpl:leads>0?spend/leads:null,
    convVenda:leads>0?(vendas/leads)*100:null,
    custoVenda:vendas>0?spend/vendas:null,
    ticket:vendas>0?faturamento/vendas:null,
    roas:spend>0?faturamento/spend:null};
}
