// ── Date helpers (GMT-6 México) ─────────────────────────────────────────────
function nowSP(){ return new Date(Date.now()-3*60*60*1000); }
function toISODate(d){ return d.toISOString().split("T")[0]; }
function todayISO(){ return toISODate(nowSP()); }
function yesterdayISO(){ const d=nowSP();d.setDate(d.getDate()-1);return toISODate(d); }
function nDaysAgoISO(n){ const d=nowSP();d.setDate(d.getDate()-n);return toISODate(d); }
function firstOfMonthISO(){ const d=nowSP();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-01`; }
function addDays(iso,n){ const d=new Date(iso+"T12:00:00Z");d.setDate(d.getDate()+n);return toISODate(d); }
function subDays(iso,n){ return addDays(iso,-n); }

// ── Format helpers ─────────────────────────────────────────────────────────
function parseBRL(s){
  if(!s||s==="-"||s==="0")return 0;
  let str=String(s).replace(/R\$\s*/g,"").trim();
  if(str.includes(",")) str=str.replace(/\./g,"").replace(",",".");
  return parseFloat(str)||0;
}
function parseBRLAbs(s){ return Math.abs(parseBRL(s)); }
function parseUSD(s){ if(!s||s==="-"||s==="0")return 0;return parseFloat(String(s).replace(/[$\s,]/g,"").trim())||0; }
// Converte gasto de anúncio (campo "Spend") para USD a partir do nome da conta.
// Prioridade: novo formato "(MXN)"/"(USD)" no nome → legado por nome exato → default MXN
function metaSpendToUSD(rawSpend, accountName){
  const acc=(accountName||"").toUpperCase();
  // Contas explicitamente USD: CA03/CA04/Conta G têm prioridade sobre qualquer sufixo
  if(/^CA0[34]\b/.test(acc)||acc.startsWith("CONTA G")) return rawSpend;
  if(acc==="CONTA 2 CARTÃO"||acc==="CONTA 2") return rawSpend/18;  // MXN legado
  if(acc.includes("(USD)")) return rawSpend;
  if(acc.includes("(MXN)")) return rawSpend/18;
  return rawSpend/18; // default: MXN
}

// Normaliza status numérico da Eduzz para texto
function normalizeStatus(s){
  if(!s && s!==0) return "";
  const m={
    "1":"Aberta",
    "3":"Paga",
    "6":"Aguardando Reembolso",
    "7":"Reembolsado",
    "10":"Expirado",
    "11":"Em Recuperacao",
    "15":""
  };
  const str=String(s).trim();
  return m[str]||str;
}

// Extrai só a data de strings com ou sem horário: "dd/mm/yyyy HH:MM:SS" → "dd/mm/yyyy"
function stripTime(s){
  if(!s) return s;
  return String(s).trim().split(" ")[0];
}
function toISO(s){ if(!s||s==="Date"||s==="")return null;s=String(s).trim().split(" ")[0]; if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;const p=s.split("/");if(p.length===3){const y=p[2].length===4?p[2]:"20"+p[2];return `${y}-${p[1].padStart(2,"0")}-${p[0].padStart(2,"0")}`;}return null; }
function fBRL(n){ n=n||0; const neg=n<0; const s=Math.abs(n).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}); return (neg?"-":"")+"R$ "+s; }
function fBRLShort(n){ const a=Math.abs(n||0),sg=n<0?"-":"";if(a>=1000)return sg+"R$"+(a/1000).toFixed(1).replace(".",",")+"k";return sg+"R$"+Math.round(a); }
function fPct(n){ return (n||0).toFixed(1).replace(".",",")+"%"; }
function fDate(iso){ if(!iso)return"";const[,m,d]=iso.split("-");return `${d}/${m}`; }
function fDateBR(iso){ if(!iso)return"";const[y,m,d]=iso.split("-");return `${d}/${m}/${y}`; }
function parseSheet(json){ const rows=json.values||[];if(rows.length<2)return[];const h=rows[0];return rows.slice(1).map(r=>Object.fromEntries(h.map((k,i)=>[k,(r[i]||"").trim()]))); }
// Igual a parseSheet mas em colunas duplicadas usa o PRIMEIRO valor não-vazio (necessário p/ Hotmart que repete data.buyer.email)
function parseSheetFirstWins(json){ const rows=json.values||[];if(rows.length<2)return[];const h=rows[0];return rows.slice(1).map(r=>{const obj={};h.forEach((k,i)=>{const v=(r[i]||"").trim();if(!(k in obj)||(!obj[k]&&v))obj[k]=v;});return obj;}); }
// parseInt seguro: remove separadores de milhar (. ou ,) antes de parsear
function piS(v){ return parseInt(String(v||"0").replace(/[.,]/g,""))||0; }

// Status color — dark mode semantics
function statusColor(val,meta,higherIsBetter){
  if(meta===null||meta===undefined||!meta) return "var(--text-strong)";   // sem meta definida
  if(!val||val===0)return "#8a96ab";
  const ratio=val/meta;
  if(higherIsBetter){ if(ratio>=1)return "#34d399";if(ratio>=0.9)return "#fbbf24";return "#f87171"; }
  else { if(ratio<=1)return "#34d399";if(ratio<=1.1)return "#fbbf24";return "#f87171"; }
}
// Card border color from status color
function statusBorder(val,meta,higherIsBetter){
  const c=statusColor(val,meta,higherIsBetter);
  if(c==="#34d399") return "rgba(52,211,153,.22)";
  if(c==="#fbbf24") return "rgba(251,191,36,.22)";
  if(c==="#f87171") return "rgba(248,113,113,.22)";
  return "var(--border)";
}

// ── Ad ID / advCode helpers ───────────────────────────────────────────────
// Extrai código adv/adi/adc + dígitos + sufixo de versão opcional (-v1-vnd-2309)
// Ignora prefixo "teste-"
function extractAdvCode(name){
  if(!name) return null;
  // remove prefixo teste- case-insensitive
  const clean=name.replace(/^teste-/i,"");
  const m=clean.match(/ad[vic]\d+(?:-v\d+(?:-vnd-\d+)?)?/i);
  return m ? m[0].toLowerCase() : null;
}

// Extrai país do Adset Name.
// Convenção: "ca01-aberto-{pais}" → país; caso contrário → "México"
function extractTempFromCamp(name){
  if(!name) return null;
  const n=name.toLowerCase();
  if(n.includes("frio")||n.includes("cold")) return "frio";
  if(n.includes("morno"))  return "morno";
  if(n.includes("quente")) return "quente";
  return null;
}
function extractPriceFromCamp(name){
  if(!name) return null;
  const n=name.toLowerCase().replace(/[-_\s]+/g,""); // normalize spaces/dashes/underscores
  if(n.includes("220peso")) return "220pesos";
  if(n.includes("170peso")) return "170pesos";
  if(n.includes("85peso"))  return "85pesos";
  return null;
}
// Fallback por código de oferta (quando não há UTM com nome de campanha)
function extractPriceFromOffer(offerCode){
  const FEO_OFFER_TIER={"7qcbwd5x":"170pesos","mwwdt723":"85pesos","cjinn4wy":"220pesos"};
  return FEO_OFFER_TIER[(offerCode||"").toLowerCase().trim()]||null;
}
// Fallback: infere price tier pelo valor da compra quando não há UTM
// Recebe valor já convertido para USD (hotmartPriceUSD):
//   ~4.7 USD =  85 MXN → 85pesos
//   ~8.8 USD = 158 MXN → 170pesos
//   ~12.2 USD = 220 MXN → 220pesos
//   <1 USD              → teste, ignorar
// Pontos de corte: midpoint entre os preços reais em USD
//   85↔158 MXN = 121.5 MXN ≈ 6.75 USD → corte em 7
//   158↔220 MXN = 189 MXN ≈ 10.5 USD → corte em 10.5
function inferPriceTierFromValue(valUSD){
  const v=parseFloat(String(valUSD||"0").replace(",","."))||0;
  if(v<1)    return null;       // transação de teste
  if(v<7)    return "85pesos";  //  85 MXN ≈ 4.7 USD
  if(v<10.5) return "170pesos"; // 158 MXN ≈ 8.8 USD
  return "220pesos";            // 220 MXN ≈ 12.2 USD
}
function extractCountryFromAdset(adsetName){
  if(!adsetName) return "México";
  // Padrão ca{N}-{word}-{country}, captura o último segmento após o segundo "-"
  const m=adsetName.match(/^ca\d+-.+-([a-z_]+)$/i);
  if(m){
    const slug=m[1].replace(/_/g," ");
    if(slug.toUpperCase()==="EUA") return "EUA";
    // Title-case cada palavra
    return slug.replace(/\b\w/g,c=>c.toUpperCase());
  }
  return "México";
}

// Extrai Ad ID numérico de 15-20 dígitos de uma string que pode ser:
// "120247448870650228" ou "manual_defin-venda-adv289|120247448870650228::..."
function extractAdId(raw){
  if(!raw) return null;
  // já é um número puro
  if(/^\d{15,20}$/.test(raw.trim())) return raw.trim();
  // busca sequência de 15-20 dígitos
  const m=raw.match(/\d{15,20}/);
  return m ? m[0] : null;
}


// ── Hotmart helpers ─────────────────────────────────────────────────────────
// Converte timestamp (ms) ou "dd/mm/yyyy HH:MM:SS" para YYYY-MM-DD (GMT-6 México)
function tsToISO(ts){
  if(!ts||ts==="0") return null;
  // Formato textual: dd/mm/yyyy HH:MM:SS ou dd/mm/yyyy
  const txtMatch=String(ts).match(/^(\d{2})\/(\d{2})\/(\d{4})(?:\s+\d{2}:\d{2}:\d{2})?$/);
  if(txtMatch){
    const [,dd,mm,yyyy]=txtMatch;
    return `${yyyy}-${mm}-${dd}`;
  }
  // Timestamp em milissegundos
  const n=parseInt(ts);
  if(!n||isNaN(n)) return null;
  const d=new Date(n-6*60*60*1000);
  return d.toISOString().split("T")[0];
}

// Extrai Ad ID de 15-20 dígitos do xcod da Hotmart
// Formato: [prefix]hQwK21wXxR[campaign|id]hQwK21wXxR[adset|id]hQwK21wXxR[adName|adId]hQwK21wXxR[placement]
function extractXcodMeta(xcod){
  const SEP="hQwK21wXxR";
  if(!xcod||!xcod.startsWith("FB")) return {platform:"",placement:""};
  const parts=xcod.slice(2).split(SEP);
  if(parts.length<2) return {platform:"",placement:""};
  const placement=parts[parts.length-1]||"";
  const p=placement.toLowerCase();
  let platform="";
  if(p.includes("instagram")) platform="instagram";
  else if(p.includes("facebook")) platform="facebook";
  else if(p.includes("messenger")) platform="messenger";
  else if(p.includes("audience")) platform="audience_network";
  else if(p.includes("thread")) platform="threads";
  else if(placement&&!placement.includes("{{")) platform=placement;
  return {platform,placement};
}
function extractAdIdFromXcod(xcod){
  if(!xcod) return null;
  const SEP="hQwK21wXxR";
  const parts=xcod.split(SEP);
  if(parts.length>=4){
    const adPart=parts[3];
    const pipe=adPart.lastIndexOf("|");
    if(pipe>=0){
      const candidate=adPart.slice(pipe+1).trim();
      if(/^\d{15,20}$/.test(candidate)) return candidate;
    }
  }
  return extractAdId(xcod);
}

// Normaliza status Hotmart → texto interno
function normalizeHotmartStatus(s){
  if(!s) return "";
  const m={
    "APPROVED":"Paga","COMPLETE":"Paga","COMPLETED":"Paga",
    "REFUNDED":"Reembolsado","CANCELLED":"Reembolsado","CANCELED":"Reembolsado","CHARGEBACK":"Reembolsado",
    "BILLET_PRINTED":"Aberta","WAITING_PAYMENT":"Aberta","PRINTED":"Aberta",
    "OVERDUE":"Expirado","DELAYED":"Expirado","EXPIRED":"Expirado",
  };
  return m[String(s).toUpperCase().trim()]||String(s).trim();
}

// Conversão para USD — rates = quanto da moeda vale 1 USD
const FX_RATES={
  USD:1, MXN:18, BRL:5.50, EUR:0.92, GBP:0.79, CAD:1.37,
  ARS:1000, COP:4100, CLP:960, PEN:3.75, CRC:530, GTQ:7.8,
  HNL:25, NIO:36.5, DOP:60, BOB:6.9, PYG:7700, UYU:41,
};
function toUSD(valor, currency){
  const c=(currency||"USD").toUpperCase().trim();
  const rate=FX_RATES[c]||1;
  return valor/rate;
}

// Conversão de preço Hotmart → USD com regra por produto
// Reto: MXN÷18, USD÷1, outros→$38 fixo
// Cero/outros: usa FX_RATES padrão
function hotmartPriceUSD(priceRaw, currency, productName){
  const price=parseFloat(String(priceRaw).replace(",","."))||0;
  const curr=(currency||"USD").toUpperCase().trim();
  if(/reto/i.test(productName)){
    if(curr==="MXN") return price/18;
    if(curr==="USD") return price;
    return 38; // outras moedas: preço padrão Reto = $38
  }
  if(/mapa/i.test(productName)){
    if(curr==="MXN") return price/18;
    if(curr==="USD") return price;
    return 297; // outras moedas: preço padrão Mapa = $297
  }
  return toUSD(price, curr);
}

// Parseia aba Hotmart para linhas normalizadas (valores convertidos para USD)
function parseHotmartRows(sheetJ){
  return parseSheetFirstWins(sheetJ).map(r=>{
    const ts=r["data.purchase.order_date"]||r["data.purchase.approved_date"]||"0";
    const d=tsToISO(ts);
    const st=normalizeHotmartStatus(r["data.purchase.status"]||"");
    const xcod=r["data.purchase.origin.xcod"]||"";
    const sck=r["data.purchase.origin.sck"]||"";
    let adId=extractAdIdFromXcod(xcod)||"";
    // Fallback: sck pode carregar as UTMs quando xcod está vazio (ex: order bump)
    // Formato sck: funnel|platform|adsetName|adsetId|adName|adId|campName|campId|placement
    if(!adId&&sck){const sp=sck.split("|");if(sp.length>=6)adId=sp[5]||"";}
    const {platform:_plat,placement:_plac}=extractXcodMeta(xcod);
    const priceRaw=String(r["data.purchase.price.value"]||"0").replace(",",".");
    const currency=r["data.purchase.price.currency_value"]||"USD";
    const productName=r["data.product.name"]||"";
    const valor=hotmartPriceUSD(priceRaw, currency, productName);
    // Hotmart às vezes descoloca campos: email vai parar em last_name quando não há sobrenome.
    // Detecta: se email não tem "@" mas last_name tem, usa last_name como email.
    const rawEmail=(r["data.buyer.email"]||"").trim();
    const rawLastName=(r["data.buyer.last_name"]||"").trim();
    const resolvedEmail=(rawEmail.includes("@")?rawEmail:(rawLastName.includes("@")?rawLastName:"")).toLowerCase();
    // Telefone: checkout_phone ou, se email era na verdade um número, usa rawEmail como tel
    const rawPhone=(r["data.buyer.checkout_phone"]||"").replace(/\D/g,"");
    const resolvedPhone=rawPhone||((!rawEmail.includes("@")&&/^\d{7,}$/.test(rawEmail))?rawEmail.replace(/\D/g,""):"");
    return {
      "Email":resolvedEmail,
      "CPF Comprador":"",
      "Telefone":resolvedPhone,
      "Nome":r["data.buyer.name"]||"",
      "Status da compra":st,
      "Data da compra":d||"",
      "Nome do produto":r["data.product.name"]||"",
      "Valor do produto":valor.toFixed(2),
      "Taxa da plataforma":"0",
      "Ad Id":adId,
      _src:"hotmart",
      platform:_plat,
      placement:_plac,
      _orderDate:r["data.purchase.order_date"]||"",
      offerCode:(r["data.purchase.offer.code"]||"").trim(),
    };
  }).filter(r=>r["Data da compra"])
    // Dedup por order_date: mesma compra pode gerar 2 webhooks; prefere o que tem email real
    // Fallback: se não há order_date (timestamp ms), usa email+data para não deduplicar
    // compradores diferentes que compraram no mesmo dia
    .reduce((acc,r)=>{
      const em=r["Email"]&&r["Email"].includes("@")?r["Email"]:"";
      const key=r._orderDate||(em?em+"|"+r["Data da compra"]:r["Data da compra"]);
      const i=acc.findIndex(x=>{
        const xe=x["Email"]&&x["Email"].includes("@")?x["Email"]:"";
        const xk=x._orderDate||(xe?xe+"|"+x["Data da compra"]:x["Data da compra"]);
        return xk===key;
      });
      if(i<0){ acc.push(r); }
      else{
        const hasEmail=!!em;
        const existingEmail=acc[i]["Email"]&&acc[i]["Email"].includes("@");
        if(!existingEmail&&hasEmail) acc[i]=r; // substitui pela linha com email real
      }
      return acc;
    },[]);
}

// ── Load data ──────────────────────────────────────────────────────────────
// Busca uma aba em blocos de 5000 linhas para evitar timeout em abas grandes
// ── CSV parser → mesmo formato que a Sheets API {values:[rows]} ───────────
function parseCSVText(text){
  const lines=text.split(/\r?\n/);
  const result=[];
  for(const line of lines){
    if(!line.trim()) continue;
    const row=[];let cur="";let inQ=false;
    for(let i=0;i<line.length;i++){
      const c=line[i];
      if(c==='"'){
        if(inQ&&line[i+1]==='"'){cur+='"';i++;}
        else inQ=!inQ;
      } else if(c===','&&!inQ){row.push(cur);cur="";}
      else cur+=c;
    }
    row.push(cur);
    result.push(row);
  }
  return {values:result};
}

async function fetchCSV(filename){
  console.log(`[csv] carregando "${filename}"...`);
  const res=await fetch("./"+encodeURIComponent(filename));
  if(!res.ok) throw new Error(`HTTP ${res.status} ao carregar "${filename}"`);
  const text=await res.text();
  const j=parseCSVText(text);
  console.log(`[csv] "${filename}": ${j.values.length-1} linhas de dados`);
  return j;
}

// ── Sheets API helpers ──────────────────────────────────────────────────────
// Acha o nome real da aba na planilha sem depender de espaços extras ou
// maiúsculas (ex.: " Base Meta DDS" com espaço no início). Aceita uma lista
// de nomes possíveis — o primeiro que existir na planilha é usado.
const __tabTitles={};
async function resolveTab(tab, sheetId){
  const cands=Array.isArray(tab)?tab:[tab];
  const norm=s=>String(s||"").replace(/\s+/g," ").trim().toLowerCase();
  try{
    if(!__tabTitles[sheetId]){
      const r=await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${sheetId}?fields=sheets.properties.title&key=${GAPI_KEY}`);
      const j=r.ok?await r.json():{};
      __tabTitles[sheetId]=(j.sheets||[]).map(s=>s.properties.title);
    }
    for(const c of cands){
      const hit=__tabTitles[sheetId].find(t=>norm(t)===norm(c));
      if(hit!==undefined) return hit;
    }
  }catch(e){ console.warn("[sheets] não consegui listar as abas:",e.message); }
  return cands[0];
}
async function fetchSheetPaged(tabName, lastCol="L", pageSize=5000, sheetId=SHEET_ID){
  const tab=await resolveTab(tabName, sheetId);
  const allValues=[];
  let startRow=1;
  while(true){
    const endRow=startRow+pageSize-1;
    const range=`${encodeURIComponent("'"+tab.replace(/'/g,"''")+"'")}!A${startRow}:${lastCol}${endRow}`;
    const url=`https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values/${range}?key=${GAPI_KEY}`;
    const res=await fetch(url);
    if(!res.ok) throw new Error(`Sheets API: HTTP ${res.status} ao buscar aba "${tab}"`);
    const data=await res.json();
    const rows=data.values||[];
    allValues.push(...rows);
    if(rows.length<pageSize) break;
    startRow+=pageSize;
  }
  return {values:allValues};
}

// ── Parser do SCK da "Base Compradores DDS" ──────────────────────────────
// A aba tem 3 formatos de SCK (do mais novo ao mais antigo):
//  1) "FB|{conjunto}|{conjuntoId}|{campanha}|{campanhaId}|{anúncio}|{AD ID}|{posicionamento}"
//  2) "FBAds_{posicionamento}|{campanha}_id_{campId}|..|{anúncio}_id_{AD ID}|{conjunto}_id_{id}"
//  3) "FBAds_{posicionamento}_{campanha}_id_{campId}_..._{anúncio}_id_{AD ID}_..."
// Qualquer SCK que comece com "FB" é tráfego pago; o resto (HOTMART_SITE,
// HOTMART_PRODUCT_PAGE, vazio…) é orgânico. Ambos entram nos totais.
function normPlacement(raw){
  const s=String(raw||"").toLowerCase();
  const plat=s.includes("instagram")?"Instagram":s.includes("facebook")?"Facebook":s.includes("messenger")?"Messenger":s.includes("audience")?"Audience_Network":s.includes("thread")?"Threads":"";
  if(!plat) return "";
  const fmt=s.includes("reel")?"Reels":s.includes("stor")?"Stories":s.includes("explore")?"Explore":s.includes("instream")?"Instream":s.includes("feed")?"Feed":"";
  return fmt?plat+"_"+fmt:plat;
}
function parseSCK(sck){
  sck=String(sck||"").trim();
  if(!/^FB/i.test(sck)) return {paid:false,adId:"",placement:""};
  const parts=sck.split("|");
  // Formato 1
  if(/^FB$/i.test(parts[0])&&parts.length>=7){
    const adId=/^\d{10,}$/.test((parts[6]||"").trim())?parts[6].trim():"";
    return {paid:true, adId, placement:normPlacement(parts[7]||"")};
  }
  // Formato 2
  if(/^FBAds/i.test(parts[0])&&parts.length>=4){
    const m=String(parts[3]).match(/_id_(\d{10,})/);
    return {paid:true, adId:m?m[1]:"", placement:normPlacement(parts[0])};
  }
  // Formato 3 (e legados): o Ad ID é o 2º número depois de "_id_"
  const ids=[...sck.matchAll(/_id_(\d{10,})/g)].map(m=>m[1]);
  return {paid:true, adId:ids[1]||"", placement:normPlacement(sck.slice(0,40))};
}
function platformFromPlacement(pl){
  const p=(pl||"").toLowerCase();
  if(p.includes("instagram")) return "instagram";
  if(p.includes("facebook"))  return "facebook";
  if(p.includes("messenger")) return "messenger";
  if(p.includes("audience"))  return "audience_network";
  if(p.includes("thread"))    return "threads";
  return "";
}

// Converte uma linha da "Base Compradores DDS" no formato de linha usado
// pelo resto do painel (o mesmo que o Reto/Cero usa a partir da Hotmart).
// Essa base não tem coluna de status: toda linha é tratada como venda paga.
function parseVendasDDS(sheetJ){
  const out=[];
  for(const r of parseSheet(sheetJ)){
    const d=toISO(r["Data da compra"]||r["Data"]); if(!d) continue;
    const valor=parseBRL(r["Valor"]);
    const info=parseSCK(r["SCK"]||r["sck"]||"");
    out.push({
      "Email":(r["Email"]||r["E-mail"]||"").toLowerCase().trim(),
      "CPF Comprador":"",
      "Telefone":String(r["Telefone"]||"").replace(/\D/g,""),
      "Status da compra":"Paga",
      "Data da compra":d,
      "Nome do produto":FUNIL_PRODUTOS[0].label,
      "Produto original":r["Produto"]||"",

      "Ad Id":info.adId||"",
      platform:platformFromPlacement(info.placement),
      placement:info.placement||"",
      _orderDate:"",
      offerCode:"",
    });
  }
  return out;
}

      const d=r["Data da compra"];
      const valor=parseFloat(r["Valor do produto"])||0;
      if(!vD[d])vD[d]={qtd:0,valor:0,taxa:0};
      vD[d].qtd+=1; vD[d].valor+=valor;
      const adId=r["Ad Id"];
      if(adId){
        if(!vByAd[adId])vByAd[adId]={qtd:0,valor:0,taxa:0};
        vByAd[adId].qtd+=1; vByAd[adId].valor+=valor;
        if(!vByAdDate[adId])vByAdDate[adId]={};
        if(!vByAdDate[adId][d])vByAdDate[adId][d]={qtd:0,valor:0,taxa:0};
        vByAdDate[adId][d].qtd+=1; vByAdDate[adId][d].valor+=valor;
      }
      if(r.platform){
        if(!vByPlatform[r.platform])vByPlatform[r.platform]={};
        if(!vByPlatform[r.platform][d])vByPlatform[r.platform][d]={qtd:0,valor:0};
        vByPlatform[r.platform][d].qtd+=1; vByPlatform[r.platform][d].valor+=valor;
      }
      const plac=r.placement;
      if(plac&&!plac.includes("{{")&&plac!=="Others"&&plac!=="unknown"){
        if(!vByPlacement[plac])vByPlacement[plac]={};
        if(!vByPlacement[plac][d])vByPlacement[plac][d]={qtd:0,valor:0};
        vByPlacement[plac][d].qtd+=1; vByPlacement[plac][d].valor+=valor;
      }
    }
    S.vendas=vD; S.vendasByAd=vByAd; S.vendasByAdDate=vByAdDate;
    S.vendasByPlatformDate=vByPlatform; S.vendasByPlacementDate=vByPlacement;

    // Vendas por temperatura: anúncio da venda → campanha → frio/morno/quente
    const vByTemp={frio:{},morno:{},quente:{}};
    for(const [adId,byDate] of Object.entries(vByAdDate)){
      const adData=mByAdId[adId]; if(!adData) continue;
      const temp=extractTempFromCamp(adData.campName); if(!temp) continue;
      for(const [d,vv] of Object.entries(byDate)){
        if(!vByTemp[temp][d]) vByTemp[temp][d]={qtd:0,valor:0,taxa:0};
        vByTemp[temp][d].qtd+=vv.qtd; vByTemp[temp][d].valor+=vv.valor;
      }
    }
    S.vendasByTemp=vByTemp;

    // ── Funil (por enquanto só o produto de entrada recebe vendas) ────────
    S.funilRows=vendasRows;
    {
      const fbt={frio:[],morno:[],quente:[]};
      for(const r of vendasRows){
        const adData=r["Ad Id"]?mByAdId[r["Ad Id"]]:null; if(!adData) continue;
        const temp=extractTempFromCamp(adData.campName); if(temp) fbt[temp].push(r);
      }
      S.funilRowsByTemp=fbt;
    }
    try{ S.funil=buildFunilData(S.funilRows,S.startDate||"",S.endDate||""); }
    catch(fe){ console.error("buildFunilData error:",fe); S.funil={}; }

    let lastISO="";
    for(const r of vendasRows){ if(r["Data da compra"]>lastISO) lastISO=r["Data da compra"]; }
    S.updated=lastISO?fDateBR(lastISO):"—";
    S.firstLoad=false;
  }catch(e){
    S.error="Erro ao processar dados: "+e.message;
    S.firstLoad=false;
    console.error("[DDS] processing error:",e);
  }
  render();
}

// Tabelas "Por Plataforma" / "Por Formato" da aba Tráfego: soma só os dias
// do período selecionado (os mapas acima guardam plataforma → dia → valores).
function refreshPlatformAgg(start,end){
  const sum=(byKey,init)=>{
    const out={};
    for(const [k,byDate] of Object.entries(byKey||{})){
      const acc={...init};
      let any=false;
      for(const [d,v] of Object.entries(byDate)){
        if(d<start||d>end) continue;
        any=true;
        for(const f of Object.keys(init)) acc[f]+=(v[f]||0);
      }
      if(any) out[k]=acc;
    }
    return out;
  };
  S.metaByPlatform  =sum(S.metaByPlatformDate,{spend:0,clicks:0,impressions:0});
  S.vendasByPlatform=sum(S.vendasByPlatformDate,{qtd:0,valor:0});
  S.vendasByPlacement=sum(S.vendasByPlacementDate,{qtd:0,valor:0});
}

// ── Derived — Principal ────────────────────────────────────────────────────
function getDaily(start,end){
  const d=D();
  const metaA=getMetaActive();
  const vA=getVendasActive();
  const all=new Set([...Object.keys(metaA),...Object.keys(vA)]);
  return Array.from(all).sort().filter(dt=>dt>=start&&dt<=end).map(date=>{
    const m=metaA[date]||{spend:0,clicks:0,impressions:0,landingViews:0,checkouts:0,purchases:0};
    const v=vA[date]||{qtd:0,valor:0,taxa:0};
    const lucro=v.valor-v.taxa-(m.spend*TAXA_IMPOSTO);
    return{date,label:fDate(date),spend:m.spend,faturamento:v.valor,vendas:v.qtd,
      gerenciador:m.purchases||0,
      roas:m.spend>0?v.valor/m.spend:0,cpv:v.qtd>0?m.spend/v.qtd:0,
      ticket:v.qtd>0?v.valor/v.qtd:0,lucro};
  });
}
function getTotals(daily){
  const d=D();
  const vA=getVendasActive();
  const t=daily.reduce((a,dt)=>({spend:a.spend+dt.spend,fat:a.fat+dt.faturamento,vendas:a.vendas+dt.vendas,
    taxa:a.taxa+(vA[dt.date]?.taxa||0)}),{spend:0,fat:0,vendas:0,taxa:0});

    ticket:t.vendas>0?t.fat/t.vendas:0,lucro:t.fat-t.taxa-(t.spend*TAXA_IMPOSTO)};
}


// ── Derived — Tráfego ──────────────────────────────────────────────────────
function getDailyT(start,end){

// ── Canvas drawing ─────────────────────────────────────────────────────────
const DPR=window.devicePixelRatio||1;
const GRID_C="rgba(255,255,255,0.06)";
const TICK_C="#6b7689";

function initCanvas(id,cssW,cssH){
  const c=document.getElementById(id);if(!c)return null;
  c.width=Math.round(cssW*DPR);c.height=Math.round(cssH*DPR);
  c.style.width=cssW+"px";c.style.height=cssH+"px";
  const ctx=c.getContext("2d");ctx.scale(DPR,DPR);
  return ctx;
}

function drawLineArea(ctx,xP,yP,vals,color,fill=true){
  if(vals.length<2)return;
  if(fill){
    const n=vals.length;
    ctx.beginPath();ctx.moveTo(xP(0),yP(vals[0]));
    for(let i=1;i<n;i++)ctx.lineTo(xP(i),yP(vals[i]));
    // find zero Y
    const yZero=yP(0);
    ctx.lineTo(xP(n-1),yZero);ctx.lineTo(xP(0),yZero);ctx.closePath();
    const cH=ctx.canvas.height/DPR;
    const g=ctx.createLinearGradient(0,0,0,cH);
    g.addColorStop(0,color+"28");g.addColorStop(1,color+"00");
    ctx.fillStyle=g;ctx.fill();
  }
  ctx.beginPath();ctx.strokeStyle=color;ctx.lineWidth=2;ctx.setLineDash([]);
  ctx.moveTo(xP(0),yP(vals[0]));
  for(let i=1;i<vals.length;i++)ctx.lineTo(xP(i),yP(vals[i]));
  ctx.stroke();
}

// Gráfico simples (1 eixo, 1 linha) + overlay opcional nos 2 eixos Y
function drawChartWithOverlay(id, data, key, fmtY, refVal, refLabel, overlayInv, overlayCpv, cssW, cssH, lineColor){
  const mainC=lineColor||CHART_COLOR;
  const ctx=initCanvas(id,cssW,cssH);if(!ctx)return;
  const P={t:12,r:overlayInv||overlayCpv?52:12,b:26,l:52};
  const cW=cssW-P.l-P.r, cH=cssH-P.t-P.b;

  const vals=data.map(d=>+(d[key])||0);
  const invVals=data.map(d=>d.spend||0);
  const cpvVals=data.map(d=>d.cpv||0);

  // Domínio eixo Y esquerda (métrica principal)
  let allL=[...vals];if(refVal!=null)allL.push(refVal);
  const lMax=Math.max(...allL,0.01)*1.2, lMin=0;
  // Domínio eixo Y direita (overlay)
  const rVals=overlayCpv?cpvVals:invVals;
  const rMax=overlayInv||overlayCpv?Math.max(...rVals,0.01)*1.2:1;

  const xP=i=>P.l+(data.length>1?i/(data.length-1):0.5)*cW;
  const yPL=v=>P.t+cH-((v-lMin)/(lMax-lMin))*cH;
  const yPR=v=>P.t+cH-((v-0)/(rMax-0))*cH;

  // Grid + eixo Y esquerda
  ctx.setLineDash([]);
  for(let i=0;i<=4;i++){
    const y=P.t+(i/4)*cH;
    ctx.strokeStyle=GRID_C;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+cW,y);ctx.stroke();
    const lv=lMax-(i/4)*(lMax-lMin);
    ctx.fillStyle=TICK_C;ctx.font="9px 'DM Mono',monospace";ctx.textAlign="right";
    ctx.fillText(fmtY(lv),P.l-4,y+3);
  }

  // Eixo Y direita se overlay ativo
  if(overlayInv||overlayCpv){
    const ovColor=overlayInv?CHART_INV:CHART_CPV;
    const ovFmt=overlayInv?fBRLShort:v=>fBRL(v);
    for(let i=0;i<=4;i++){
      const rv=rMax-(i/4)*(rMax-0);
      const y=P.t+(i/4)*cH;
      ctx.fillStyle=ovColor;ctx.font="9px 'DM Mono',monospace";ctx.textAlign="left";
      ctx.fillText(ovFmt(rv),P.l+cW+4,y+3);
    }
  }

  // Linha de referência
  if(refVal!=null){
    const ry=yPL(refVal);
    ctx.strokeStyle=mainC+"55";ctx.lineWidth=1;ctx.setLineDash([4,3]);
    ctx.beginPath();ctx.moveTo(P.l,ry);ctx.lineTo(P.l+cW,ry);ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle=mainC;ctx.font="8px 'Inter',sans-serif";ctx.textAlign="right";
    ctx.fillText(refLabel||"Meta",P.l+cW,ry-3);
  }

  // Linha principal
  drawLineArea(ctx,xP,yPL,vals,mainC,true);

  // Overlay
  if(overlayInv) drawLineArea(ctx,xP,yPR,invVals,CHART_INV,false);
  if(overlayCpv) drawLineArea(ctx,xP,yPR,cpvVals,CHART_CPV,false);

  // X labels
  const step=data.length>60?7:data.length>30?3:data.length>14?2:1;
  ctx.fillStyle=TICK_C;ctx.font="9px 'DM Mono',monospace";ctx.textAlign="center";ctx.setLineDash([]);
  data.forEach((d,i)=>{if(i%step===0)ctx.fillText(d.label,xP(i),P.t+cH+18);});
}

// Linha simples com cor customizável — mesma estrutura do drawChartWithOverlay
function drawLineChart(id,data,key,fmtY,color,refVal,refLabel,cssW,cssH,showInvest){
  const hasInv=showInvest&&data.some(function(d){return (d.invest||0)>0;});
  const ctx=initCanvas(id,cssW,cssH);if(!ctx)return;
  const P={t:12,r:hasInv?52:12,b:26,l:52};
  const cW=cssW-P.l-P.r,cH=cssH-P.t-P.b;
  const vals=data.map(function(d){return +(d[key])||0;});
  const allV=vals.slice();if(refVal!=null)allV.push(refVal);
  const vMax=Math.max.apply(null,allV.concat([0.01]))*1.2;
  const xP=function(i){return P.l+(data.length>1?i/(data.length-1):0.5)*cW;};
  const yP=function(v){return P.t+cH-((v)/(vMax))*cH;};
  ctx.setLineDash([]);
  for(let i=0;i<=4;i++){
    const y=P.t+(i/4)*cH;
    ctx.strokeStyle=GRID_C;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+cW,y);ctx.stroke();
    const lv=vMax-(i/4)*vMax;
    ctx.fillStyle=TICK_C;ctx.font="9px 'DM Mono',monospace";ctx.textAlign="right";
    ctx.fillText(fmtY(lv),P.l-4,y+3);
  }
  if(refVal!=null){
    const ry=yP(refVal);
    ctx.strokeStyle=color+"55";ctx.lineWidth=1;ctx.setLineDash([4,3]);
    ctx.beginPath();ctx.moveTo(P.l,ry);ctx.lineTo(P.l+cW,ry);ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle=color;ctx.font="8px 'Inter',sans-serif";ctx.textAlign="right";
    ctx.fillText(refLabel||"Meta",P.l+cW,ry-3);
  }
  drawLineArea(ctx,xP,yP,vals,color,true);
  // Overlay: investimento (eixo direito)
  if(hasInv){
    const INVEST_C=CHART_INV; // #3b82f6 — mesmo azul da aba principal
    const invVals=data.map(function(d){return d.invest||0;});
    const invMax=Math.max.apply(null,invVals.concat([0.01]))*1.3;
    const yPI=function(v){return P.t+cH-((v)/(invMax))*cH;};
    drawLineArea(ctx,xP,yPI,invVals,INVEST_C,false);
    // Eixo direito labels
    ctx.fillStyle=INVEST_C;ctx.font="9px 'DM Mono',monospace";ctx.textAlign="left";
    for(let i=0;i<=4;i++){
      const lv=invMax-(i/4)*invMax;
      const y=P.t+(i/4)*cH;
      ctx.fillText(fBRLShort(lv),P.l+cW+4,y+3);
    }
  }
  const step=data.length>60?7:data.length>30?3:data.length>14?2:1;
  ctx.fillStyle=TICK_C;ctx.font="9px 'DM Mono',monospace";ctx.textAlign="center";ctx.setLineDash([]);
  data.forEach(function(d,i){if(i%step===0)ctx.fillText(d.label,xP(i),P.t+cH+18);});
}
// Gráfico dual-axis (investimento x CPV)
function drawDual(id,data,cssW,cssH,metaCpv){
  const ctx=initCanvas(id,cssW,cssH);if(!ctx)return;
  const P={t:14,r:52,b:28,l:58};
  const cW=cssW-P.l-P.r,cH=cssH-P.t-P.b;
  const lVals=data.map(d=>d.spend||0);
  const rVals=data.map(d=>d.cpv||0);
  const lMax=Math.max(...lVals,0.01)*1.15;
  const rMax=Math.max(...rVals,metaCpv||0,0.01)*1.4;
  const xP=i=>P.l+(data.length>1?i/(data.length-1):0.5)*cW;
  const yPL=v=>P.t+cH-((v-0)/(lMax-0))*cH;
  const yPR=v=>P.t+cH-((v-0)/(rMax-0))*cH;
  ctx.setLineDash([]);
  for(let i=0;i<=4;i++){
    const y=P.t+(i/4)*cH;
    ctx.strokeStyle=GRID_C;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+cW,y);ctx.stroke();
    ctx.fillStyle=TICK_C;ctx.font="10px 'DM Mono',monospace";
    ctx.textAlign="right";ctx.fillText(fBRLShort(lMax-(i/4)*lMax),P.l-5,y+3.5);
    ctx.textAlign="left";ctx.fillText("R$"+(rMax-(i/4)*rMax).toFixed(0),P.l+cW+5,y+3.5);
  }
  if(metaCpv){
    const mY=yPR(metaCpv);
    ctx.strokeStyle=CHART_CPV+"55";ctx.lineWidth=1;ctx.setLineDash([4,3]);
    ctx.beginPath();ctx.moveTo(P.l,mY);ctx.lineTo(P.l+cW,mY);ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle=CHART_CPV;ctx.font="9px 'Inter',sans-serif";ctx.textAlign="left";
    ctx.fillText("Meta "+fBRL(metaCpv),P.l+cW+4,mY-3);
  }
  drawLineArea(ctx,xP,yPL,lVals,CHART_INV,true);
  drawLineArea(ctx,xP,yPR,rVals,CHART_CPV,false);
  const step=data.length>60?7:data.length>30?3:data.length>14?2:1;
  ctx.fillStyle=TICK_C;ctx.font="10px 'DM Mono',monospace";ctx.textAlign="center";ctx.setLineDash([]);
  data.forEach((d,i)=>{if(i%step===0)ctx.fillText(d.label,xP(i),P.t+cH+18);});
}

// Tooltip genérico
function setupTip(cid,tid,data,lines,padL=58,padR=12){
  const c=document.getElementById(cid),t=document.getElementById(tid);
  if(!c||!t)return;
  c.addEventListener("mousemove",e=>{
    const rect=c.getBoundingClientRect();
    const relX=(e.clientX-rect.left)-padL;
    const cW=rect.width-padL-padR;
    if(relX<0||relX>cW||!data.length){t.style.display="none";return;}
    const d=data[Math.max(0,Math.min(Math.round((relX/cW)*(data.length-1)),data.length-1))];
    let h=`<div class="tl">${d.label||d.date}</div>`;
    lines.forEach(l=>{
      h+=`<div class="tr"><span style="color:${l.color}">${l.name}</span><span class="tv">${(l.fmt||fBRL)(+(d[l.key])||0)}</span></div>`;
    });
    t.innerHTML=h;t.style.display="block";
    const tw=t.offsetWidth,x=e.clientX-rect.left;
    t.style.left=(x+12+tw>rect.width-8?x-tw-12:x+12)+"px";
    t.style.top=(e.clientY-rect.top-20)+"px";
  });
  c.addEventListener("mouseleave",()=>t.style.display="none");
}

// Gráfico de barras — vendas por dia
function drawBarVendas(id, data, cssW, cssH, showGap){
  const ctx=initCanvas(id,cssW,cssH);if(!ctx)return;
  const P={t:24,r:showGap?50:16,b:26,l:36};
  const cW=cssW-P.l-P.r, cH=cssH-P.t-P.b;
  const n=data.length; if(n===0)return;
  const vals=data.map(d=>d.vendas||0);
  const maxV=Math.max(...vals,1);

  // Compute GAP% per day
  const gapPcts=showGap?data.map(d=>{
    const h=d.vendas||0,g=d.gerenciador||0;
    return h>0?((g-h)/h)*100:0;
  }):[];

  // Horizontal grid (left scale = vendas count)
  const ticks=4;
  for(let i=0;i<=ticks;i++){
    const y=P.t+(i/ticks)*cH;
    ctx.strokeStyle=GRID_C;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+cW,y);ctx.stroke();
    if(i<ticks){
      ctx.fillStyle=TICK_C;ctx.font="9px 'JetBrains Mono',monospace";ctx.textAlign="right";
      ctx.fillText(Math.round(maxV*(1-i/ticks)),P.l-4,y+3);
    }
  }

  // Green bars (Hotmart vendas)
  const slot=cW/n;
  const barW=Math.max(3,Math.min(28,slot*0.6));
  const GREEN="#34d399";
  for(let i=0;i<n;i++){
    const v=vals[i];
    const bh=Math.max(v>0?2:0,(v/maxV)*cH);
    const cx=P.l+slot*i+slot/2;
    const x=cx-barW/2;
    const yb=P.t+cH-bh;
    const g=ctx.createLinearGradient(0,yb,0,P.t+cH);
    g.addColorStop(0,GREEN+"dd");g.addColorStop(1,GREEN+"55");
    ctx.fillStyle=g;
    const r=Math.min(3,barW/2,bh/2);
    ctx.beginPath();
    ctx.moveTo(x+r,yb);ctx.lineTo(x+barW-r,yb);
    ctx.quadraticCurveTo(x+barW,yb,x+barW,yb+r);
    ctx.lineTo(x+barW,yb+bh);ctx.lineTo(x,yb+bh);ctx.lineTo(x,yb+r);
    ctx.quadraticCurveTo(x,yb,x+r,yb);ctx.closePath();
    ctx.fill();
    if(v>0){
      ctx.fillStyle="#e8edf6";
      ctx.font=`bold ${Math.max(8,Math.min(11,barW-1))}px 'DM Sans',sans-serif`;
      ctx.textAlign="center";
      ctx.fillText(v,cx,yb-4);
    }
  }

  // GAP% overlay — separate y-scale, no numbers on bars
  if(showGap&&gapPcts.length>0){
    const RED="#f87171";
    const maxGap=Math.max(Math.max(...gapPcts.map(Math.abs)),5);
    // Y mapping: 0% → mid chart; ±maxGap → top/bottom within 80% of chart height
    const gapY=pct=>P.t+cH*0.1+(1-((pct/maxGap)*0.8+1)/2)*cH*0.8;

    // Faint 0% reference line
    const y0=gapY(0);
    ctx.strokeStyle="rgba(248,113,113,0.25)";ctx.lineWidth=1;ctx.setLineDash([3,4]);
    ctx.beginPath();ctx.moveTo(P.l,y0);ctx.lineTo(P.l+cW,y0);ctx.stroke();
    ctx.setLineDash([]);

    // GAP% line
    ctx.strokeStyle=RED;ctx.lineWidth=1.5;ctx.setLineDash([4,3]);
    ctx.beginPath();
    for(let i=0;i<n;i++){
      const cx=P.l+slot*i+slot/2;
      const gy=gapY(gapPcts[i]);
      if(i===0) ctx.moveTo(cx,gy); else ctx.lineTo(cx,gy);
    }
    ctx.stroke();ctx.setLineDash([]);

    // Dots (no per-point labels)
    for(let i=0;i<n;i++){
      const cx=P.l+slot*i+slot/2;
      const gy=gapY(gapPcts[i]);
      ctx.fillStyle=RED;
      ctx.beginPath();ctx.arc(cx,gy,2.5,0,Math.PI*2);ctx.fill();
    }
    // Fixed Y-scale on right margin: +max%, 0%, -max%
    const scaleTicks=[maxGap,0,-maxGap];
    ctx.font="bold 8px 'DM Sans',sans-serif";ctx.textAlign="left";
    for(const pct of scaleTicks){
      const gy=gapY(pct);
      ctx.fillStyle=pct===0?"rgba(248,113,113,0.5)":RED;
      const lbl=(pct>0?"+":"")+Math.round(pct)+"%";
      ctx.fillText(lbl,P.l+cW+4,gy+3);
    }
  }

  // X labels
  const step=n>60?7:n>30?3:n>14?2:1;
  ctx.fillStyle=TICK_C;ctx.font="9px 'JetBrains Mono',monospace";ctx.textAlign="center";
  data.forEach((d,i)=>{if(i%step===0)ctx.fillText(d.label,P.l+slot*i+slot/2,P.t+cH+18);});
}

// ── Dist chart helpers ────────────────────────────────────────────────────
// Generic dual-axis (spend left, any metric right) for dist funil
function drawDistDual(id, data, rKey, rRef, rRefLabel, cssW, cssH){
  const ctx=initCanvas(id,cssW,cssH); if(!ctx)return;
  const P={t:14,r:58,b:28,l:58};
  const cW=cssW-P.l-P.r, cH=cssH-P.t-P.b;
  const lVals=data.map(d=>d.spend||0);
  const rVals=data.map(d=>d[rKey]||0);
  const lMax=Math.max(...lVals,0.01)*1.15;
  const rMax=Math.max(...rVals,rRef||0.01,0.01)*1.4;
  const xP=i=>P.l+(data.length>1?i/(data.length-1):0.5)*cW;
  const yPL=v=>P.t+cH-(v/lMax)*cH;
  const yPR=v=>P.t+cH-(v/rMax)*cH;
  ctx.setLineDash([]);
  for(let i=0;i<=4;i++){
    const y=P.t+(i/4)*cH;
    ctx.strokeStyle=GRID_C;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+cW,y);ctx.stroke();
    ctx.fillStyle=TICK_C;ctx.font="10px 'DM Mono',monospace";
    ctx.textAlign="right";ctx.fillText(fBRLShort(lMax-(i/4)*lMax),P.l-5,y+3.5);
    ctx.textAlign="left";ctx.fillText(fBRLShort(rMax-(i/4)*rMax),P.l+cW+5,y+3.5);
  }
  if(rRef){
    const mY=yPR(rRef);
    ctx.strokeStyle="#f59e0b55";ctx.lineWidth=1;ctx.setLineDash([4,3]);
    ctx.beginPath();ctx.moveTo(P.l,mY);ctx.lineTo(P.l+cW,mY);ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle="#f59e0b";ctx.font="9px 'Inter',sans-serif";ctx.textAlign="left";
    ctx.fillText(rRefLabel,P.l+cW+4,mY-3);
  }
  drawLineArea(ctx,xP,yPL,lVals,CHART_INV,true);
  drawLineArea(ctx,xP,yPR,rVals,"#f59e0b",false);
  const step=data.length>60?7:data.length>30?3:data.length>14?2:1;
  ctx.fillStyle=TICK_C;ctx.font="10px 'DM Mono',monospace";ctx.textAlign="center";ctx.setLineDash([]);
  data.forEach((d,i)=>{if(i%step===0)ctx.fillText(d.label,xP(i),P.t+cH+18);});
}

// Bar chart for dist data (seguidores or profile visits)
function drawDistBar(id, data, key, color, fmtFn, cssW, cssH){
  const ctx=initCanvas(id,cssW,cssH); if(!ctx)return;
  const P={t:22,r:16,b:26,l:32};
  const cW=cssW-P.l-P.r, cH=cssH-P.t-P.b;
  const n=data.length; if(n===0)return;
  const vals=data.map(d=>d[key]||0);
  const maxV=Math.max(...vals,1);
  for(let i=0;i<=4;i++){
    const y=P.t+(i/4)*cH;
    ctx.strokeStyle=GRID_C;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+cW,y);ctx.stroke();
  }
  const slot=cW/n;
  const barW=Math.max(3,Math.min(28,slot*0.6));
  for(let i=0;i<n;i++){
    const v=vals[i];
    const cx=P.l+slot*i+slot/2;
    const bh=Math.max(v>0?2:0,(v/maxV)*cH);
    const x=cx-barW/2;
    const y=P.t+cH-bh;
    const g=ctx.createLinearGradient(0,y,0,P.t+cH);
    g.addColorStop(0,color+"dd");g.addColorStop(1,color+"44");
    ctx.fillStyle=g;
    const r=Math.min(3,barW/2,bh/2);
    ctx.beginPath();
    ctx.moveTo(x+r,y);ctx.lineTo(x+barW-r,y);
    ctx.quadraticCurveTo(x+barW,y,x+barW,y+r);
    ctx.lineTo(x+barW,y+bh);ctx.lineTo(x,y+bh);ctx.lineTo(x,y+r);
    ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
    ctx.fill();
    if(v>0){
      ctx.fillStyle="#e8edf6";
      ctx.font=`bold ${Math.max(8,Math.min(11,barW-1))}px 'DM Sans',sans-serif`;
      ctx.textAlign="center";ctx.fillText(fmtFn(v),cx,y-4);
    }
  }
  const step=n>60?7:n>30?3:n>14?2:1;
  ctx.fillStyle=TICK_C;ctx.font="9px 'JetBrains Mono',monospace";ctx.textAlign="center";ctx.setLineDash([]);
  data.forEach((d,i)=>{if(i%step===0)ctx.fillText(d.label,P.l+slot*i+slot/2,P.t+cH+18);});
}

}
