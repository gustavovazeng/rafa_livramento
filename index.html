// ── Render: Campanhas / Anúncios ──────────────────────────────────────────
function chkBox(checked){
  return `<div style="width:16px;height:16px;border-radius:4px;border:2px solid ${checked?"#10b981":"rgba(255,255,255,.2)"};background:${checked?"#10b981":"transparent"};display:flex;align-items:center;justify-content:center;margin:auto">
    ${checked?`<svg width="10" height="8" viewBox="0 0 10 8" fill="none"><path d="M1 4L4 7L9 1" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`:""}
  </div>`;
}
function adResumoBlock(a){
  const lines=[];
  lines.push(`Nome do ad ⤵️`);
  lines.push(a.adName);
  lines.push(``);
  if(a.igUrl)lines.push(a.igUrl);
  lines.push(`Investimento:\t${fUSD(a.spend)}`);
  lines.push(`Leads:\t${a.leads}`);
  lines.push(`Custo/lead:\t${a.leads>0?fUSD(a.cpl):"—"}`);
  lines.push(``);
  if(PESQUISA_ATIVA){lines.push(`Tx Faixa A:\t${fPctOrDash(a.faixaA)}`);
  lines.push(`Tx Faixa B:\t${fPctOrDash(a.faixaB)}`);
  lines.push(`Tx Faixa C:\t${fPctOrDash(a.faixaC)}`);
  lines.push(`Tx Faixa D:\t${fPctOrDash(a.faixaD)}`);
  lines.push(`% resposta da pesquisa:\t${fPctOrDash(a.quizPct)}`);}
  lines.push(``);
  lines.push(`CPM:\t${fUSD(a.cpm)}`);
  lines.push(`CPC:\t${fUSD(a.cpc)}`);
  lines.push(`CTR:\t${fPct(a.ctr)}`);
  lines.push(`__________________________`);
  return lines.join("\n");
}
function renderAnuncios(){
  const el=document.getElementById("page-anuncios");if(!el)return;
  const start=S.startDate,end=S.endDate;
  const per=getCurrentPeriod();
  const escName=s=>String(s).replace(/\\/g,"\\\\").replace(/'/g,"\\'");
  // Célula de % Faixa colorida conforme a meta (mesmo padrão da coluna de
  // Custo/lead) — metaKey é a chave em METAS_RESUMO (faixaA/faixaB/...).
  function faixaTd(val,metaKey){
    const meta=METAS_RESUMO[metaKey];
    const color=(val!=null&&meta)?statusColor(val,meta.val,meta.higher):"var(--muted)";
    return `<td class="mono" style="text-align:right;color:${color}">${fPctOrDash(val)}</td>`;
  }

  const campRowsAll=getCampRows(start,end);
  const _cq=S.campSearch.trim().toLowerCase();
  const campRows=_cq?campRowsAll.filter(c=>c.campName.toLowerCase().includes(_cq)):campRowsAll;
  const {col:cCol,dir:cDir}=S.cSort;
  // Ordenação: null vai SEMPRE pro fim, independente da direção. Sem isso o
  // "??0" antigo fazia campanha sem dado (GAP/faixa nulos) aparecer como se
  // fosse zero — ou seja, uma campanha sem nenhuma lead subia pro topo do
  // GAP como se estivesse perfeitamente casada com o gerenciador.
  const sortedCamps=[...campRows].sort((a,b)=>{
    const av=a[cCol],bv=b[cCol];
    if(av==null&&bv==null)return 0;
    if(av==null)return 1;
    if(bv==null)return -1;
    if(typeof av==="string")return cDir==="asc"?av.localeCompare(bv):bv.localeCompare(av);
    return cDir==="asc"?av-bv:bv-av;
  });

  const adRowsAll=getAdRows(start,end,S.selectedCamps);
  const _aq=S.adSearch.trim().toLowerCase();
  const adRowsF=_aq?adRowsAll.filter(a=>a.adName.toLowerCase().includes(_aq)):adRowsAll;
  const {col,dir}=S.aSort;
  const sortedAds=[...adRowsF].sort((a,b)=>{
    const av=a[col]??0,bv=b[col]??0;
    if(typeof av==="string")return dir==="asc"?av.localeCompare(bv):bv.localeCompare(av);
    return dir==="asc"?av-bv:bv-av;
  });

  // ── Linha de TOTAL das duas tabelas ────────────────────────────────────
  // Sem seleção: soma todas as linhas visíveis (ou seja, respeita a busca).
  // Com seleção: soma SÓ o que está marcado — e aí a busca é ignorada, pra
  // uma campanha marcada e depois escondida pelo filtro não sair da conta.
  const campSelMode=S.selectedCamps.size>0;
  const campTotRows=campSelMode?campRowsAll.filter(c=>S.selectedCamps.has(c.campName)):sortedCamps;
  const campTot=somaLinhas(campTotRows);
  const adSelMode=S.selectedAds.size>0;
  const adTotRows=adSelMode?adRowsAll.filter(a=>S.selectedAds.has(a.adName)):sortedAds;
  const adTot=somaLinhas(adTotRows);
  const rotuloTotal=(selMode,n,sing,plur)=>`${selMode?"TOTAL da seleção":"TOTAL"} · ${n} ${n===1?sing:plur}`;
  // Célula da linha de total — mesma formatação das linhas, só mais forte.
  const tdT=(html,extra="")=>`<td class="mono" style="text-align:right;font-weight:700;color:var(--text-strong);${extra}">${html}</td>`;

  const tot=campRowsAll.reduce((a,c)=>({spend:a.spend+c.spend,clicks:a.clicks+c.clicks,impressions:a.impressions+c.impressions,leads:a.leads+c.leads}),{spend:0,clicks:0,impressions:0,leads:0});
  const totCpl=tot.leads>0?tot.spend/tot.leads:0;
  const totCtr=tot.impressions>0?(tot.clicks/tot.impressions)*100:0;

  const selAds=sortedAds.filter(a=>S.selectedAds.has(a.adName));
  const adResumoText=selAds.length>0?selAds.map(a=>adResumoBlock(a)).join("\n"):"";
  el._adResumoText=adResumoText;

  function thC(colKey,lbl,isCamp){
    const aC=isCamp?cCol:col, aD=isCamp?cDir:dir, active=aC===colKey;
    const arrow=active?(aD==="asc"?" ↑":" ↓"):" ↕";
    const fn=isCamp?`sortCampanhas('${colKey}')`:`sortAnuncios('${colKey}')`;
    return `<th onclick="${fn}" style="text-align:right;cursor:pointer">${lbl}<span style="color:${active?"#60a5fa":"var(--hint)"};margin-left:3px">${arrow}</span></th>`;
  }

  el.innerHTML=`
    <div class="hdr" style="margin-bottom:6px">
      <div>
        <div class="hdr-title">Campanhas e anúncios</div>
        <div class="hdr-sub">${per.s&&per.e?`${fDateBR(per.s)} → ${fDateBR(per.e)}`:""} · ${sortedCamps.length} campanhas · ${sortedAds.length} anúncios${S.selectedCamps.size>0?` · filtrado por ${S.selectedCamps.size} campanha(s)`:""}</div>
      </div>
    </div>
    ${S.error?`<div class="err">⚠️ ${S.error}</div>`:""}
    <div class="g4" style="margin-bottom:20px">
      ${kpiCard("Investimento",fUSD(tot.spend),"Base Meta","var(--text-strong)")}
      ${kpiCard("Leads",tot.leads.toLocaleString("pt-BR"),"atribuídos por UTM","var(--text-strong)")}
      ${kpiCard("Custo/lead",totCpl>0?fUSD(totCpl):"—",`meta ${fUSD(META_CPL)}`,totCpl>0?statusColor(totCpl,META_CPL,false):"var(--text-strong)",false,totCpl,META_CPL,false)}
      ${kpiCard("CTR",fPct(totCtr),"","var(--text-strong)")}
    </div>

    <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
      <div class="section-lbl" style="margin-bottom:0">Campanhas</div>
      ${S.selectedCamps.size>0?`<button onclick="clearCamps()" style="font-size:10px;padding:3px 9px;border:1px solid rgba(239,68,68,.4);background:rgba(239,68,68,.08);color:#f87171;border-radius:5px;cursor:pointer;font-family:'DM Sans',sans-serif">✕ Limpar seleção (${S.selectedCamps.size})</button>`:""}
      <span style="font-size:10px;color:var(--hint)">Clique para filtrar os anúncios por campanha</span>
    </div>
    <div style="position:relative;margin-bottom:10px">
      <input id="busca-campanha" oninput="setCampSearch(this.value)" value="${S.campSearch}" placeholder="Buscar campanha…" style="width:100%;padding:8px 12px;background:var(--card);border:1px solid var(--border);border-radius:9px;color:var(--text);font-size:12px;font-family:'DM Sans',sans-serif;outline:none;box-sizing:border-box"/>
    </div>
    <div class="cc" style="padding:0;overflow:hidden;margin-bottom:22px">
      <div style="overflow-x:auto">
      <table>
        <thead><tr>
          <th style="width:36px"></th>
          <th onclick="sortCampanhas('campName')" style="cursor:pointer">Campanha</th>
          ${thC("spend","Investimento",true)}
          ${thC("leads","Leads",true)}
          ${thC("cpl","Custo/lead",true)}
          ${PESQUISA_ATIVA?`${thC("faixaA","Tx Faixa A",true)}
          ${thC("faixaB","Tx Faixa B",true)}
          ${thC("faixaC","Tx Faixa C",true)}
          ${thC("faixaD","Tx Faixa D",true)}
          ${thC("quizPct","% resp. pesquisa",true)}`:""}
          ${thC("cpm","CPM",true)}
          ${thC("cpc","CPC",true)}
          ${thC("ctr","CTR",true)}
          ${thC("gapPct","GAP",true)}
        </tr></thead>
        <tbody>
          ${sortedCamps.length===0?`<tr><td colspan="14" style="text-align:center;color:var(--hint);padding:20px">Sem dados de campanhas no período</td></tr>`:
          sortedCamps.map(c=>{
            const sel=S.selectedCamps.has(c.campName);
            return `<tr onclick="toggleCamp('${escName(c.campName)}')" style="cursor:pointer;background:${sel?"rgba(16,185,129,.1)":"transparent"}">
              <td style="text-align:center">${chkBox(sel)}</td>
              <td style="color:${sel?"#10b981":"var(--text)"};font-weight:${sel?600:400}">${c.campName}</td>
              <td class="mono" style="text-align:right">${fUSD(c.spend)}</td>
              <td class="mono" style="text-align:right">${c.leads}</td>
              <td style="text-align:right;color:${c.cpl>0?statusColor(c.cpl,META_CPL,false):"var(--muted)"}">${c.cpl>0?fUSD(c.cpl):"—"}</td>
              ${PESQUISA_ATIVA?`${faixaTd(c.faixaA,"faixaA")}
              ${faixaTd(c.faixaB,"faixaB")}
              ${faixaTd(c.faixaC,"faixaC")}
              ${faixaTd(c.faixaD,"faixaD")}
              <td class="mono" style="text-align:right">${fPctOrDash(c.quizPct)}</td>`:""}
              <td class="mono" style="text-align:right">${fUSD(c.cpm)}</td>
              <td class="mono" style="text-align:right">${fUSD(c.cpc)}</td>
              <td class="mono" style="text-align:right">${fPct(c.ctr)}</td>
              ${gapTd(c.gapPct,c.actionLeads,c.leadsRaw)}
            </tr>`;
          }).join("")}
        </tbody>
        ${campTotRows.length===0?"":`<tfoot><tr style="background:rgba(148,163,184,.10);border-top:2px solid var(--border)">
          <td></td>
          <td style="font-weight:700;color:var(--text-strong)">${rotuloTotal(campSelMode,campTotRows.length,"campanha","campanhas")}</td>
          ${tdT(fUSD(campTot.spend))}
          ${tdT(campTot.leads.toLocaleString("pt-BR"))}
          ${tdT(campTot.cpl>0?fUSD(campTot.cpl):"—",`color:${campTot.cpl>0?statusColor(campTot.cpl,META_CPL,false):"var(--muted)"}`)}
          ${PESQUISA_ATIVA?`${tdT(fPctOrDash(campTot.faixaA))}
          ${tdT(fPctOrDash(campTot.faixaB))}
          ${tdT(fPctOrDash(campTot.faixaC))}
          ${tdT(fPctOrDash(campTot.faixaD))}
          ${tdT(fPctOrDash(campTot.quizPct))}`:""}
          ${tdT(fUSD(campTot.cpm))}
          ${tdT(fUSD(campTot.cpc))}
          ${tdT(fPct(campTot.ctr))}
          ${tdT(campTot.gapPct==null?"—":`${campTot.gapPct>0?"+":""}${fPct(campTot.gapPct)}`,`color:${campTot.gapPct==null?"var(--hint)":(Math.abs(campTot.gapPct)<=10?"#34d399":Math.abs(campTot.gapPct)<=20?"#fbbf24":"#f87171")}`)}
        </tr></tfoot>`}
      </table>
      </div>
    </div>

    <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
      <div class="section-lbl" style="margin-bottom:0">Anúncios${S.selectedCamps.size>0?` — dentro de: ${[...S.selectedCamps].map(c=>c).join(", ")}`:" — consolidado (todas as campanhas)"}</div>

      <span style="font-size:10px;color:var(--hint)">Clique para selecionar e gerar o resumo</span>

          ${PESQUISA_ATIVA?`${thC("faixaA","Tx Faixa A",false)}
          ${thC("faixaB","Tx Faixa B",false)}
          ${thC("faixaC","Tx Faixa C",false)}
          ${thC("faixaD","Tx Faixa D",false)}
          ${thC("quizPct","% resp. pesquisa",false)}`:""}

          ${sortedAds.length===0?`<tr><td colspan="14" style="text-align:center;color:var(--hint);padding:20px">Sem dados de anúncios no período</td></tr>`:
          sortedAds.map(a=>{
            const sel=S.selectedAds.has(a.adName);
            return `<tr onclick="toggleAd('${escName(a.adName)}')" style="cursor:pointer;background:${sel?"rgba(16,185,129,.1)":"transparent"}">
              <td style="text-align:center">${chkBox(sel)}</td>
              <td style="color:${sel?"#10b981":"var(--text)"};font-weight:${sel?600:400};max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${a.adName}">${a.adName}</td>
              <td class="mono" style="text-align:right">${fUSD(a.spend)}</td>
              <td class="mono" style="text-align:right">${a.leads}</td>
              <td style="text-align:right;color:${a.cpl>0?statusColor(a.cpl,META_CPL,false):"var(--muted)"}">${a.cpl>0?fUSD(a.cpl):"—"}</td>
              ${PESQUISA_ATIVA?`${faixaTd(a.faixaA,"faixaA")}
              ${faixaTd(a.faixaB,"faixaB")}
              ${faixaTd(a.faixaC,"faixaC")}
              ${faixaTd(a.faixaD,"faixaD")}
              <td class="mono" style="text-align:right">${fPctOrDash(a.quizPct)}</td>`:""}
              <td class="mono" style="text-align:right">${fUSD(a.cpm)}</td>

function distinctCount(rows,key){
  const c={};
  for(const r of rows){ const v=r[key]||"(não informado)"; c[v]=(c[v]||0)+1; }
  return Object.entries(c).sort((a,b)=>b[1]-a[1]);
}
function setLeadsChannel(c){ S.leadsChannel=c; renderLeads(); }
function setLeadsTemp(t){ S.leadsTemp=t; renderLeads(); }
function leadsChannelToggle(){
  const CH=[["total","Total"],["trafego","Tráfego"],["organico","Orgânico"]];
  return `<div class="presets">${CH.map(([k,lbl])=>
    `<button class="btn-pre${S.leadsChannel===k?" on":""}" onclick="setLeadsChannel('${k}')">${lbl}</button>`).join("")}</div>`;
}
function leadsTempToggle(){
  const TP=[["todos","Todos"],["quente","Quente"],["morno","Morno"],["frio","Frio"]];
  return `<div class="presets">${TP.map(([k,lbl])=>
    `<button class="btn-pre${S.leadsTemp===k?" on":""}" onclick="setLeadsTemp('${k}')">${lbl}</button>`).join("")}</div>`;
}
function renderLeads(){
  const el=document.getElementById("page-leads");if(!el)return;
  const start=S.startDate,end=S.endDate;
  const per=getCurrentPeriod();
  const ch=S.leadsChannel, temp=S.leadsTemp;
  const chLabel={total:"Total",trafego:"Tráfego",organico:"Orgânico"}[ch];
  const tempLabel={todos:"Todos",quente:"Quente",morno:"Morno",frio:"Frio"}[temp];
  const rows=leadsForTemp(leadsForChannel(leadsInRange(start,end),ch),temp);
  const quizRows=rows.filter(l=>l.quizOk);
  const total=rows.length;
  const quizPct=total>0?(quizRows.length/total)*100:0;

  const faixaOrder=FAIXA_LETTERS;
  const faixaColors=CHART_FAIXA;
  const faixaCounts=faixaOrder.map(f=>({f,n:quizRows.filter(l=>l.faixa===f).length}));

  const origemCounts=distinctCount(rows,"utmSource").slice(0,10);
  const maxOrigem=origemCounts.length?origemCounts[0][1]:1;

  // tip = enunciado completo da pergunta, mostrado no hover — os títulos das
  // 3 tabelas da pesquisa são encurtados pra caber no cabeçalho do bloco.
  function demoBlock(title,key,tip){
    const counts=distinctCount(quizRows,key).slice(0,10);
    const maxV=counts.length?counts[0][1]:1;
    return `<div class="cc">
      <div class="ch"><span class="ct"${tip?` title="${tip.replace(/"/g,"&quot;")}" style="cursor:help;border-bottom:1px dotted var(--hint)"`:""}>${title}</span></div>
      ${counts.map(([k,n])=>barRow(k,n,quizRows.length,"#60a5fa")).join("")}
    </div>`;
  }

  el.innerHTML=`
    <div class="hdr" style="margin-bottom:6px">
      <div>
        <div class="hdr-title">Análise qualificação</div>
        <div class="hdr-sub">${per.s&&per.e?`${fDateBR(per.s)} → ${fDateBR(per.e)}`:""} · ${total} leads no período · canal: ${chLabel} · temperatura: ${tempLabel}</div>
      </div>
    </div>
    <div style="margin-bottom:14px;display:flex;flex-direction:column;gap:8px">
      <div style="display:flex;align-items:center;gap:8px"><span style="font-size:10px;color:var(--hint);min-width:76px">Canal:</span>${leadsChannelToggle()}</div>
      <div style="display:flex;align-items:center;gap:8px"><span style="font-size:10px;color:var(--hint);min-width:76px">Temperatura:</span>${leadsTempToggle()}</div>
    </div>
    ${S.error?`<div class="err">⚠️ ${S.error}</div>`:""}
    <div class="g4" style="margin-bottom:20px">
      ${kpiCard("Leads no período",total.toLocaleString("pt-BR"),"","var(--text-strong)")}
      ${kpiCard("Quiz respondido",fPct(quizPct),`${quizRows.length} de ${total}`,"var(--text-strong)")}
      ${kpiCard(`Faixa ${faixaCounts[0].f} (melhor score)`,faixaCounts[0].n.toLocaleString("pt-BR"),quizRows.length>0?fPct((faixaCounts[0].n/quizRows.length)*100):"—",CHART_FAIXA[faixaCounts[0].f])}
      ${kpiCard(`Faixa ${faixaCounts[faixaCounts.length-1].f} (pior score)`,faixaCounts[faixaCounts.length-1].n.toLocaleString("pt-BR"),quizRows.length>0?fPct((faixaCounts[faixaCounts.length-1].n/quizRows.length)*100):"—",CHART_FAIXA[faixaCounts[faixaCounts.length-1].f])}

      <div class="cc">
        <div class="ch"><span class="ct">Distribuição por faixa (score do quiz)</span></div>
        ${faixaCounts.map(({f,n})=>barRow("Faixa "+f,n,quizRows.length,faixaColors[f])).join("")}
      </div>
      <div class="cc">
        <div class="ch"><span class="ct">Origem (utm_source)</span></div>
        ${origemCounts.map(([k,n])=>barRow(k,n,maxOrigem>0?rows.length:0,"#a78bfa")).join("")}
      </div>

    <div class="section-lbl">Respostas da pesquisa (entre quem respondeu o quiz) — passe o mouse no título pra ver o enunciado completo</div>

    </div>
    <div class="foot">och_nov26 · Captação · Google Sheets</div>`;
}

// Plano (Captação) de um dia específico — usado no Resumo diário pra
// comparar Ontem/Hoje contra a linha daquele dia na planilha de planejamento.
// Retorna null se a data estiver fora do período planejado (ex.: antes do
// lançamento começar ou depois do fim da Captação).
function planForDate(dateISO){
  return PLANO_DIARIO.find(p=>p.date===dateISO)||null;
}
// Meta total do lançamento (soma do plano inteiro, não só até hoje) — usada
// só pro "% de atingimento" do bloco Total-Consolidado do Resumo diário.
function planoTotalLancamento(){
  return{
    investimento:PLANO_DIARIO.reduce((a,p)=>a+p.investimento,0),
    leads:PLANO_DIARIO.reduce((a,p)=>a+p.leads,0),
  };
}

// ── Render: Métricas do Tráfego (placeholder — conteúdo a definir) ─────────
// Métricas de tráfego (CPC/CTR/CPM/Tx Pág→Cadastro/Connect Rate), filtráveis
// só por temperatura (extraída do nome da campanha) — não tem filtro de canal
// porque é tudo tráfego pago (a única fonte de investimento na Base Meta).
function trafficMetrics(start,end,temp){
  const m=sumMetaRows(metaRowsFiltered(start,end,temp));
  const leadsRowsT=leadsForTemp(leadsInRange(start,end),temp);
  const leads=leadsRowsT.length;
  const leadsTrafego=leadsForChannel(leadsRowsT,"trafego").length;
  const cpl=leads>0?m.spend/leads:null;
  const cpc=m.clicks>0?m.spend/m.clicks:null;
  const ctr=m.impressions>0?(m.clicks/m.impressions)*100:null;
  const cpm=m.impressions>0?(m.spend/m.impressions)*1000:null;
  const pag=paginaMetrics(start,end,temp);
  // Tx Pág → Cadastro: leads de tráfego ÷ sessões da página de captura (Base
  // GA4, já sem a página de obrigado e sem as origens internas). Cai de volta pra aproximação
  // leads/cliques quando não há dado de GA4 no período (ex.: antes da Base
  // GA4 existir) — txConvPgAprox sinaliza quando é essa aproximação, pra UI
  // avisar que não é o dado real do GA4 (diferente do Resumo diário, que não
  // tem esse fallback).
  const txConvPgAprox=pag.sessions===0&&m.clicks>0;
  const txConvPg=pag.sessions>0?(leadsTrafego/pag.sessions)*100:(m.clicks>0?(leads/m.clicks)*100:null);
  // Connect Rate: sessões da página de captura (GA4) ÷ cliques no link (Meta
  // Ads) — mede quantos de quem clicou no anúncio realmente carregou a
  // página. Só existe quando há dado de GA4 no período.
  const connectRate=(m.clicks>0&&pag.sessions>0)?(pag.sessions/m.clicks)*100:null;
  return{spend:m.spend,leads,cpl,cpc,ctr,cpm,txConvPg,txConvPgAprox,connectRate,paginaFonte:pag.fonte};
}

// Linha única de uma métrica ao longo do tempo, com escala dinâmica (baseada
// no próprio dado + na meta) e linha tracejada de meta — mesmo padrão visual
// do gráfico dual de Investimento×Custo/lead da aba Principal.
function drawMetricLine(id,data,key,color,metaVal,cssW,cssH,fmt){
  const ctx=initCanvas(id,cssW,cssH);if(!ctx)return;
  const P={t:14,r:56,b:28,l:52};
  const cW=cssW-P.l-P.r,cH=cssH-P.t-P.b;
  const vals=data.map(d=>d[key]);
  const validVals=vals.filter(v=>v!=null);
  const maxRaw=Math.max(...validVals,metaVal||0,0.01);
  const max=maxRaw*1.2;
  const n=data.length;
  const xP=i=>P.l+(n>1?i/(n-1):0.5)*cW;
  const yP=v=>P.t+cH-(Math.max(0,v)/max)*cH;
  ctx.setLineDash([]);
  for(let i=0;i<=4;i++){
    const y=P.t+(i/4)*cH;
    ctx.strokeStyle=GRID_C;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+cW,y);ctx.stroke();
    ctx.fillStyle=TICK_C;ctx.font="9px 'DM Mono',monospace";ctx.textAlign="right";
    ctx.fillText(fmt(max-(i/4)*max),P.l-5,y+3);
  }
  if(metaVal!=null){
    const mY=yP(metaVal);
    ctx.strokeStyle=color+"55";ctx.lineWidth=1;ctx.setLineDash([4,3]);
    ctx.beginPath();ctx.moveTo(P.l,mY);ctx.lineTo(P.l+cW,mY);ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle=color;ctx.font="9px 'Inter',sans-serif";ctx.textAlign="left";
    ctx.fillText("Meta "+fmt(metaVal),P.l+cW+4,mY-3);
  }
  ctx.beginPath();ctx.strokeStyle=color;ctx.lineWidth=2;ctx.setLineDash([]);
  let started=false;
  vals.forEach((v,i)=>{
    if(v==null){started=false;return;}
    if(!started){ctx.moveTo(xP(i),yP(v));started=true;}
    else ctx.lineTo(xP(i),yP(v));
  });
  ctx.stroke();
  vals.forEach((v,i)=>{
    if(v==null)return;
    ctx.beginPath();ctx.fillStyle=color;ctx.arc(xP(i),yP(v),2.5,0,7);ctx.fill();
  });
  const step=n>60?7:n>30?3:n>14?2:1;
  ctx.fillStyle=TICK_C;ctx.font="9px 'DM Mono',monospace";ctx.textAlign="center";
  data.forEach((d,i)=>{if(i%step===0)ctx.fillText(d.label,xP(i),P.t+cH+18);});
}
// Mesma métrica em BARRAS em vez de linha — usado quando o período é curto
// demais (ex.: 1-2 dias, caso das Aulas) e uma linha não mostra nada de
// útil. Mesma grade dinâmica e linha tracejada de meta do drawMetricLine,
// mas com rótulo formatado (fmt) em cima de cada barra em vez do rótulo
// inteiro arredondado do drawBarSingle.
function drawMetricBar(id,data,key,color,metaVal,cssW,cssH,fmt){
  const ctx=initCanvas(id,cssW,cssH);if(!ctx)return;
  const P={t:14,r:56,b:28,l:52};
  const cW=cssW-P.l-P.r,cH=cssH-P.t-P.b;
  const vals=data.map(d=>d[key]);
  const validVals=vals.filter(v=>v!=null);
  const maxRaw=Math.max(...validVals,metaVal||0,0.01);
  const max=maxRaw*1.25;
  const n=data.length;
  const barW=Math.max(10,Math.min(60,(cW/Math.max(n,1))*0.45));
  const xP=i=>P.l+(n>1?i/(n-1):0.5)*cW;
  const yP=v=>P.t+cH-(Math.max(0,v)/max)*cH;
  ctx.setLineDash([]);
  for(let i=0;i<=4;i++){
    const y=P.t+(i/4)*cH;
    ctx.strokeStyle=GRID_C;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(P.l+cW,y);ctx.stroke();
    ctx.fillStyle=TICK_C;ctx.font="9px 'DM Mono',monospace";ctx.textAlign="right";
    ctx.fillText(fmt(max-(i/4)*max),P.l-5,y+3);
  }
  if(metaVal!=null){
    const mY=yP(metaVal);
    ctx.strokeStyle=color+"55";ctx.lineWidth=1;ctx.setLineDash([4,3]);
    ctx.beginPath();ctx.moveTo(P.l,mY);ctx.lineTo(P.l+cW,mY);ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle=color;ctx.font="9px 'Inter',sans-serif";ctx.textAlign="left";
    ctx.fillText("Meta "+fmt(metaVal),P.l+cW+4,mY-3);
  }
  vals.forEach((v,i)=>{
    if(v==null)return;
    const x=xP(i)-barW/2,y=yP(v),h=Math.max(P.t+cH-y,1);
    ctx.fillStyle=color+"cc";
    ctx.fillRect(x,y,barW,h);
  });
  ctx.textAlign="center";
  vals.forEach((v,i)=>{
    if(v==null)return;
    ctx.fillStyle="#e8edf6";ctx.font="bold 10px 'DM Mono',monospace";
    ctx.fillText(fmt(v),xP(i),yP(v)-4);
  });
  ctx.fillStyle=TICK_C;ctx.font="9px 'DM Mono',monospace";ctx.textAlign="center";
  data.forEach((d,i)=>ctx.fillText(d.label,xP(i),P.t+cH+18));
}

// ── Carrinho: Principal (KPIs + gráficos) ───────────────────────────────────
// A etapa de Carrinho tem só DUAS pernas no och_nov26: TRÁFEGO (aba própria
// "Base Carrinho", com investimento, cliques, impressões e checkouts
// iniciados) e VENDA (aba "Base Vendas", com o valor e a origem de cada
// compra). Não existe ficha de interesse no meio — quem clica vai direto pro
// checkout, e a venda carrega a própria UTM.
function carrinhoMetaRowsInRange(start,end){
  return carrinhoMetaRows().filter(r=>r.date>=start&&r.date<=end);
}
// Vendas do período. Venda sem data (webhook sem timestamp) fica de fora dos
// recortes por período, mas continua no consolidado do lançamento.
function carrinhoVendasInRange(start,end){
  return (S.carrinhoVendas||[]).filter(v=>v.date&&v.date>=start&&v.date<=end);
}
// Métricas consolidadas do Carrinho no período. As vendas orgânicas/de outras
// origens entram em vendas/faturamento/ROAS (elas existem e foram pagas), mas
// o custo por venda de tráfego é calculado só sobre as vendas com FBAds na
// UTM — senão o investimento ficaria dividido por vendas que ele não gerou.
function carrinhoMetrics(start,end){
  const metaRows=carrinhoMetaRowsInRange(start,end);
  const spend=metaRows.reduce((a,r)=>a+r.spend,0);
  const clicks=metaRows.reduce((a,r)=>a+r.clicks,0);
  const impressions=metaRows.reduce((a,r)=>a+(r.impressions||0),0);
  const checkouts=metaRows.reduce((a,r)=>a+(r.checkout||0),0);
  const vendas=carrinhoVendasInRange(start,end);
  const vendasTotal=vendas.length;
  const vTraf=vendas.filter(v=>v.tipo==="traf");
  const vendasTraf=vTraf.length;
  const vendasOrg=vendasTotal-vendasTraf;
  const faturamento=vendas.reduce((a,v)=>a+(v.valorUSD||0),0);
  const faturamentoTraf=vTraf.reduce((a,v)=>a+(v.valorUSD||0),0);
  return{spend,clicks,impressions,checkouts,vendasTotal,vendasTraf,vendasOrg,
    faturamento,faturamentoTraf,
    ticket:vendasTotal>0?faturamento/vendasTotal:null,
    custoVenda:vendasTotal>0?spend/vendasTotal:null,
    custoVendaTraf:vendasTraf>0?spend/vendasTraf:null,
    custoCheckout:checkouts>0?spend/checkouts:null,
    txCheckoutVenda:checkouts>0?(vendasTotal/checkouts)*100:null,
    txConvVenda:clicks>0?(vendasTotal/clicks)*100:null,
    roas:spend>0?faturamento/spend:null,
    cpc:clicks>0?spend/clicks:null,
    ctr:impressions>0?(clicks/impressions)*100:null,
    cpm:impressions>0?(spend/impressions)*1000:null};
}
// Série diária: mídia (Base Carrinho) + vendas/faturamento (Base Vendas).
function getCarrinhoDaily(start,end){
  const metaByDate={};
  for(const r of carrinhoMetaRows()){
    if(r.date<start||r.date>end)continue;
    if(!metaByDate[r.date])metaByDate[r.date]={spend:0,clicks:0,checkout:0};
    const m=metaByDate[r.date];
    m.spend+=r.spend;m.clicks+=r.clicks;m.checkout+=(r.checkout||0);
  }
  const vByDate={},vTrafByDate={},fatByDate={};
  for(const v of (S.carrinhoVendas||[])){
    if(!v.date||v.date<start||v.date>end)continue;
    vByDate[v.date]=(vByDate[v.date]||0)+1;
    if(v.tipo==="traf")vTrafByDate[v.date]=(vTrafByDate[v.date]||0)+1;
    fatByDate[v.date]=(fatByDate[v.date]||0)+(v.valorUSD||0);
  }
  const dates=new Set([...Object.keys(metaByDate),...Object.keys(vByDate)]);
  return [...dates].sort().map(d=>{
    const m=metaByDate[d]||{spend:0,clicks:0,checkout:0};
    const vendas=vByDate[d]||0, vendasTraf=vTrafByDate[d]||0, faturamento=fatByDate[d]||0;
    return{date:d,label:fDate(d),spend:m.spend,clicks:m.clicks,checkout:m.checkout,
      vendas,vendasTraf,vendasOrg:vendas-vendasTraf,faturamento,
      custoVenda:vendas>0?m.spend/vendas:null,
      roas:m.spend>0?faturamento/m.spend:null};
  });
}

// ── Carrinho: Vendas ─────────────────────────────────────────────────────────
// Cada venda traz a própria origem (UTM do checkout), mas só a UTM com
// FBAds é tráfego. As demais aparecem nas tabelas de origem/canal com o
// nome real da origem ("(orgânico / sem UTM)" quando o campo vem vazio) e
// ficam fora da atribuição por campanha/anúncio.
function carrinhoNormOrigem(o){
  const s=String(o||"").trim();
  return s||"(não informado)";
}
function carrinhoCanalKey(origem,canal){
  const c=String(canal||"").trim();
  return c||carrinhoNormOrigem(origem);
}
// Agrupa as vendas do período por UTM source (origem) ou por UTM medium
// (canal), com faturamento e representatividade de cada uma.
function getCarrinhoVendaGrupos(start,end,keyFn){
  const by={};
  for(const v of carrinhoVendasInRange(start,end)){
    const k=keyFn(v);
    if(!by[k])by[k]={chave:k,vendas:0,faturamento:0};
    by[k].vendas++;by[k].faturamento+=(v.valorUSD||0);
  }
  const totV=Object.values(by).reduce((a,x)=>a+x.vendas,0);
  const totF=Object.values(by).reduce((a,x)=>a+x.faturamento,0);
  return Object.values(by).map(x=>({...x,
    ticket:x.vendas>0?x.faturamento/x.vendas:null,
    repres:totV>0?(x.vendas/totV)*100:0,
    represFat:totF>0?(x.faturamento/totF)*100:0}));
}
function getCarrinhoVendasDaily(start,end){
  return getCarrinhoDaily(start,end).map(d=>({date:d.date,label:d.label,vendas:d.vendas,
    vendasTraf:d.vendasTraf,vendasOrg:d.vendasOrg,faturamento:d.faturamento}));
}

function setCarrinhoCanalSearch(v){S.carrinhoCanalSearch=v;preservaFoco(()=>render());}
function sortCarrinhoOrigem(col){

function sortCarrinhoCanal(col){

// Investimento TOTAL de tráfego do lançamento inteiro: captação, lives da
// captação, aquecimento, lembrete, aulas e carrinho. É a base do ROAS do
// lançamento — a venda no fim do funil é fruto de tudo que foi gasto antes,
// não só da verba do próprio carrinho.
// O filtro na Base Meta - captação evita contar o Carrinho DUAS vezes: se
// alguma campanha de carrinho ainda estiver naquela aba, ela é descartada
// aqui e o valor vem de carrinhoMetaRows(), que é a fonte oficial da etapa.
function investimentoTotalLancamento(){
  const soma=arr=>(arr||[]).reduce((a,r)=>a+(r.spend||0),0);
  return soma((S.metaRows||[]).filter(r=>campaignStage(r.campName)!=="Carrinho"))
        +soma(S.livesCaptacaoRows)
        +soma(carrinhoMetaRows())
        +soma(S.aquecimentoRows)
        +soma(S.lembreteRows)
        +soma(S.aulasRows)
        +soma(S.grupoVipRows);
}

// ── Carrinho: Campanhas/Anúncios ────────────────────────────────────────────
// Mídia da aba "Base Carrinho" agregada por campanha e por anúncio, cruzada
// com as vendas de TRÁFEGO (UTM contendo FBAds). As orgânicas e as de outras
// origens não aparecem aqui — elas estão na aba Vendas.
function getCarrinhoCampRows(start,end){
  const rows=carrinhoMetaRowsInRange(start,end);
  const byCamp={};
  for(const r of rows){
    const key=r.campName||"(sem campanha)";
    if(!byCamp[key])byCamp[key]={campName:key,spend:0,clicks:0,impressions:0,checkout:0};
    const c=byCamp[key];
    c.spend+=r.spend;c.clicks+=r.clicks;c.impressions+=r.impressions;c.checkout+=(r.checkout||0);
  }
  const vendasByCamp={}, fatByCamp={};
  for(const v of carrinhoVendasInRange(start,end)){
    if(v.tipo!=="traf")continue;
    const cn=v.campName||"(sem atribuição)";
    vendasByCamp[cn]=(vendasByCamp[cn]||0)+1;
    fatByCamp[cn]=(fatByCamp[cn]||0)+(v.valorUSD||0);
  }
  return Object.values(byCamp).map(c=>{
    const vendas=vendasByCamp[c.campName]||0, faturamento=fatByCamp[c.campName]||0;
    return{...c,vendas,faturamento,
      cpc:c.clicks>0?c.spend/c.clicks:null,
      ctr:c.impressions>0?(c.clicks/c.impressions)*100:null,
      cpm:c.impressions>0?(c.spend/c.impressions)*1000:null,
      custoVenda:vendas>0?c.spend/vendas:null,
      roas:c.spend>0?faturamento/c.spend:null,
      txConvVenda:c.clicks>0?(vendas/c.clicks)*100:0};
  });
}
function carrinhoAdRows(start,end,selectedCamps){
  const hasSel=selectedCamps&&selectedCamps.size>0;
  let rows=carrinhoMetaRowsInRange(start,end);
  if(hasSel)rows=rows.filter(r=>selectedCamps.has(r.campName||"(sem campanha)"));
  const byAd={};
  for(const r of rows){
    const key=r.adName||"(sem nome)";
    if(!byAd[key])byAd[key]={adName:key,campName:r.campName,igUrl:r.igUrl||"",spend:0,clicks:0,impressions:0,checkout:0};
    const a=byAd[key];
    a.spend+=r.spend;a.clicks+=r.clicks;a.impressions+=r.impressions;a.checkout+=(r.checkout||0);
    if(!a.igUrl&&r.igUrl)a.igUrl=r.igUrl;
  }
  const vendasByAd={}, fatByAd={};
  for(const v of carrinhoVendasInRange(start,end)){
    if(v.tipo!=="traf")continue;
    if(hasSel&&!selectedCamps.has(v.campName))continue;
    const an=v.adName||"(sem atribuição)";
    vendasByAd[an]=(vendasByAd[an]||0)+1;
    fatByAd[an]=(fatByAd[an]||0)+(v.valorUSD||0);
  }
  return Object.values(byAd).map(a=>{
    const vendas=vendasByAd[a.adName]||0, faturamento=fatByAd[a.adName]||0;
    return{...a,vendas,faturamento,
      cpc:a.clicks>0?a.spend/a.clicks:null,
      ctr:a.impressions>0?(a.clicks/a.impressions)*100:null,
      cpm:a.impressions>0?(a.spend/a.impressions)*1000:null,
      custoVenda:vendas>0?a.spend/vendas:null,
      roas:a.spend>0?faturamento/a.spend:null,
      txConvVenda:a.clicks>0?(vendas/a.clicks)*100:0};
  });
}

// Soma do planejamento de uma etapa até hoje (inclusive) — usado nos
// resumos pra mostrar "(planej até hoje: R$ x)" ao lado do realizado.
// Planejado de UMA aula até hoje. A Base Meta - Aulas junta as 3 campanhas
// numa aba só e o planoAulas tem uma linha por dia de aula, na ordem (27, 28
// e 29/10) — então o planejado da Aula N é a linha N do plano. Só conta se a
// data da aula já chegou; aula que ainda não aconteceu devolve 0.
function planoAulaAteHoje(aulaNum){
  const p=(PLANO_AULAS||[])[aulaNum-1];
  if(!p)return null;
  return p.date<=todayISO()?p.investimento:0;
}
function planoAcumAteHoje(plano){
  if(!plano||!plano.length)return null;
  const hoje=todayISO();
  return plano.filter(x=>x.date<=hoje).reduce((a,x)=>a+x.investimento,0);
}

function copyStageResumo(scope,btn){
  let text="";
  if(scope==="aquecimento")text=aquecimentoResumoText();
  else if(scope==="lembrete")text=lembreteResumoText();
  else if(scope==="aulas")text=aulasResumoText();
  else if(scope==="grupovip")text=grupoVipResumoText();
  else if(scope==="carrinho")text=carrinhoResumoText();
  if(!text||!btn)return;
  navigator.clipboard.writeText(text).then(()=>{
    const orig=btn.innerHTML;btn.innerHTML="✓ Copiado!";btn.style.color="#4ade80";
    setTimeout(()=>{btn.innerHTML=orig;btn.style.color="";},1800);
  }).catch(()=>alert("Não foi possível copiar. Selecione o texto manualmente."));
}

// ── Análise completa por etapa (Aquecimento/Lembrete/Aula01/02/03) ─────────
// KPIs + gráfico "Acumulado por dia" (toggle CPC/Tx75%/Cptx75%) + gráfico "%
// do investimento por dia" + tabela de anúncios sortável/buscável — mesmo
// padrão de completude da referência ("oro_jul26 | Mini Debriefing"), com
// nossos dados reais de cada etapa.
function stageMetricCfg(metas){
  metas=metas||{};
  return {
    cpc:   {key:"cpc",   label:"CPC",             color:CHART_GAP, meta:metas.cpc?metas.cpc.val:null,       fmt:fUSD},
    tx75:  {key:"tx75",  label:"Tx 75%",          color:CHART_LEAD,meta:metas.tx75?metas.tx75.val:null,      fmt:v=>fPct(v)},
    cptx75:{key:"cptx75",label:"Custo por Tx 75%",color:CHART_INV, meta:metas.cptx75?metas.cptx75.val:null, fmt:fUSD},
  };
}
// Agrega as linhas de anúncio de uma etapa por DIA (pro gráfico de tendência
// e pro gráfico de % de investimento).
function stageDailyAgg(rows){
  const byDate={};
  for(const r of rows){
    if(!byDate[r.date])byDate[r.date]={date:r.date,spend:0,clicks:0,impressions:0,video75:0,view3s:0};
    const d=byDate[r.date];
    d.spend+=r.spend;d.clicks+=r.clicks;d.impressions+=r.impressions;d.video75+=r.video75;d.view3s+=(r.view3s||0);
  }
  return Object.keys(byDate).sort().map(k=>{
    const d=byDate[k];
    return{...d,label:fDate(d.date),
      cpc:d.clicks>0?d.spend/d.clicks:null,
      tx75:d.view3s>0?(d.video75/d.view3s)*100:null,   // ÷ quem viu 3s (ver stageMetrics)
      cptx75:d.video75>0?d.spend/d.video75:null};
  });
}
// Agrega as linhas de anúncio de uma etapa por ANÚNCIO (pro Anúncio/Investido/
// Cliques/CPC/Impressões/75% Assistido/Views 3s/Tx75%/Cptx75%/Ver da tabela).
function stageAdAgg(rows){
  const byAd={};
  for(const r of rows){
    const key=r.adName||"(sem nome)";
    if(!byAd[key])byAd[key]={adName:key,igUrl:r.igUrl||"",spend:0,clicks:0,impressions:0,video75:0,view3s:0};
    const a=byAd[key];
    a.spend+=r.spend;a.clicks+=r.clicks;a.impressions+=r.impressions;a.video75+=r.video75;a.view3s+=(r.view3s||0);
    if(!a.igUrl&&r.igUrl)a.igUrl=r.igUrl;
  }
  return Object.values(byAd).map(a=>({...a,
    cpc:a.clicks>0?a.spend/a.clicks:null,
    tx75:a.view3s>0?(a.video75/a.view3s)*100:null,   // ÷ quem viu 3s (ver stageMetrics)
    cptx75:a.video75>0?a.spend/a.video75:null}));
}
function setStageChartMetric(scope,metric){S.stageChartMetric[scope]=metric;render();}
function setStageAdSearch(scope,v){S.stageAdSearch[scope]=v;preservaFoco(()=>render());}
function sortStageAds(scope,col){
  const s=S.stageAdSort[scope];
  if(s.col===col)s.dir=s.dir==="asc"?"desc":"asc";else{s.col=col;s.dir="desc";}
  render();
}
// KPI card com input embutido (pro Alcance manual) — mesmo visual do kpiCard,
// mas o valor é um campo editável em vez de texto estático.
function kpiCardManual(lbl,inputId,value,setterCall,sub){
  return `<div class="kc">
    <div class="kc-lbl">${lbl}</div>
    <input id="${inputId}" value="${value||""}" placeholder="inserir" inputmode="numeric"
      oninput="${setterCall}"
      onkeydown="if(event.key==='Enter')this.blur()"
      style="width:100%;background:transparent;border:none;border-bottom:1px solid ${value?"rgba(251,191,36,.4)":"rgba(255,255,255,.15)"};outline:none;padding:2px 0;font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:600;letter-spacing:-.02em;color:${value?"#fbbf24":"var(--text-strong)"}"/>
    ${sub?`<div class="kc-sub">${sub}</div>`:""}
  </div>`;
}
// HTML completo da análise de uma etapa (usado direto nas abas Aquecimento/
// Lembrete, e 3x dentro da aba Aulas — uma vez por aula). "scope" identifica
// o estado independente (toggle de gráfico, busca e ordenação da tabela) e
// os ids dos canvases; "alcanceKey" é a chave em S.manualAlcance.
// Aviso na página da etapa quando a aba dela falhou — diz o nome da aba e o
// motivo, em vez de deixar a tela vazia sem explicação.
function stageErroHtml(chave){
  const msg=S.stageErrors[chave];
  if(!msg)return "";
  return `<div class="err" style="margin-top:10px">⚠️ ${msg}</div>`;
}
function stageAnalysisHtml(scope,rows,metas,alcanceKey){
  metas=metas||{};
  const m=stageMetrics(rows);
  const alcance=S.manualAlcance[alcanceKey];
  const freq=alcance>0?m.impressions/alcance:null;
  const cfg=stageMetricCfg(metas);
  const chartMetric=S.stageChartMetric[scope]||"cpc";
  const mc=cfg[chartMetric]||cfg.cpc;

  const adsAll=stageAdAgg(rows);
  const q=(S.stageAdSearch[scope]||"").trim().toLowerCase();
  const adsF=q?adsAll.filter(a=>a.adName.toLowerCase().includes(q)):adsAll;
  const {col,dir}=S.stageAdSort[scope];
  const adsSorted=[...adsF].sort((a,b)=>{
    const av=a[col],bv=b[col];
    if(av==null&&bv==null)return 0;
    if(av==null)return 1;
    if(bv==null)return -1;
    if(typeof av==="string")return dir==="asc"?av.localeCompare(bv):bv.localeCompare(av);
    return dir==="asc"?av-bv:bv-av;
  });
  function thS(colKey,lbl){
    const active=col===colKey;
    const arrow=active?(dir==="asc"?" ↑":" ↓"):" ↕";
    return `<th onclick="sortStageAds('${scope}','${colKey}')" style="text-align:right;cursor:pointer">${lbl}<span style="color:${active?"#60a5fa":"var(--hint)"};margin-left:3px">${arrow}</span></th>`;
  }
  const trendCid="c-trend-"+scope, pctCid="c-pct-"+scope, trendTid="t-trend-"+scope;

  return `
    <div class="g4" style="margin-bottom:13px">
      ${kpiCard("Investido total",fUSD(m.spend),"","var(--text-strong)")}
      ${kpiCard("Cliques",m.clicks.toLocaleString("pt-BR"),"","var(--text-strong)")}
      ${kpiCard("CPC",m.cpc!=null?fUSD(m.cpc):"—",metas.cpc?`Meta: ${fUSD(metas.cpc.val)}`:"sem meta",metas.cpc&&m.cpc!=null?statusColor(m.cpc,metas.cpc.val,metas.cpc.higher):"var(--text-strong)",false,m.cpc,metas.cpc?metas.cpc.val:null,metas.cpc?metas.cpc.higher:null)}
      ${kpiCardManual("Alcance (manual 🔧)",`manual-alcance-${scope}`,alcance,`setManualAlcance('${alcanceKey}',this.value)`,"API não fornece este dado")}
    </div>
    <div class="g3" style="margin-bottom:20px">
      ${kpiCard("Frequência",freq!=null?freq.toFixed(2).replace(".",","):"—",metas.frequencia?`Meta: ${metas.frequencia.val}`:"sem meta","var(--text-strong)",false,freq,metas.frequencia?metas.frequencia.val:null,metas.frequencia?metas.frequencia.higher:null)}
      ${kpiCard("Tx 75%",m.tx75!=null?fPct(m.tx75):"—",metas.tx75?`Meta: ${metas.tx75.val}%`:"sem meta","var(--text-strong)",false,m.tx75,metas.tx75?metas.tx75.val:null,metas.tx75?metas.tx75.higher:null)}
      ${kpiCard("Custo por Tx 75%",m.cptx75!=null?fUSD(m.cptx75):"—",metas.cptx75?`Meta: ${fUSD(metas.cptx75.val)}`:"sem meta","var(--text-strong)",false,m.cptx75,metas.cptx75?metas.cptx75.val:null,metas.cptx75?metas.cptx75.higher:null)}
    </div>

    <div class="cc" style="position:relative;margin-bottom:14px">
      <div class="ch">
        <span class="ct">Acumulado por dia</span>
        <div class="presets">
          ${["cpc","tx75","cptx75"].map(k=>`<button class="btn-pre${chartMetric===k?" on":""}" onclick="setStageChartMetric('${scope}','${k}')">${cfg[k].label}</button>`).join("")}
        </div>
      </div>
      <div style="position:relative"><canvas id="${trendCid}"></canvas><div class="tip" id="${trendTid}"></div></div>
    </div>

    <div class="cc" style="position:relative;margin-bottom:20px">
      <div class="ch"><span class="ct">% do investimento por dia</span></div>
      <div style="position:relative"><canvas id="${pctCid}"></canvas></div>
    </div>

    <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
      <div class="section-lbl" style="margin-bottom:0;margin-top:0">Anúncios</div>
      <span style="font-size:10px;color:var(--hint)">${adsSorted.length} anúncio(s)</span>
    </div>
    <div style="position:relative;margin-bottom:10px">
      <input id="busca-anuncio-${scope}" oninput="setStageAdSearch('${scope}',this.value)" value="${S.stageAdSearch[scope]||""}" placeholder="Buscar anúncio…" style="width:100%;padding:8px 12px;background:var(--card);border:1px solid var(--border);border-radius:9px;color:var(--text);font-size:12px;font-family:'DM Sans',sans-serif;outline:none;box-sizing:border-box"/>
    </div>
    <div class="cc" style="padding:0;overflow:hidden;margin-bottom:6px">
      <div style="overflow-x:auto">
      <table>
        <thead><tr>
          <th onclick="sortStageAds('${scope}','adName')" style="cursor:pointer">Anúncio</th>
          ${thS("spend","Investido")}
          ${thS("clicks","Cliques")}
          ${thS("cpc","CPC")}
          ${thS("impressions","Impressões")}
          ${thS("video75","75% Assistido")}
          ${thS("view3s","Views 3s")}
          ${thS("tx75","Tx75%")}
          ${thS("cptx75","Cptx75%")}
          <th>Ver</th>
        </tr></thead>
        <tbody>
          ${adsSorted.length===0?`<tr><td colspan="10" style="text-align:center;color:var(--hint);padding:20px">Sem dados de anúncios no período</td></tr>`:
          adsSorted.map(a=>`<tr>
            <td>${a.adName}</td>
            <td class="mono" style="text-align:right">${fUSD(a.spend)}</td>
            <td class="mono" style="text-align:right">${a.clicks.toLocaleString("pt-BR")}</td>
            <td class="mono" style="text-align:right">${a.cpc!=null?fUSD(a.cpc):"—"}</td>
            <td class="mono" style="text-align:right">${a.impressions.toLocaleString("pt-BR")}</td>
            <td class="mono" style="text-align:right">${a.video75.toLocaleString("pt-BR")}</td>
            <td class="mono" style="text-align:right">${a.view3s.toLocaleString("pt-BR")}</td>
            <td class="mono" style="text-align:right">${a.tx75!=null?fPct(a.tx75):"—"}</td>
            <td class="mono" style="text-align:right">${a.cptx75!=null?fUSD(a.cptx75):"—"}</td>
            <td>${a.igUrl?`<a href="${a.igUrl}" target="_blank" rel="noopener" style="color:#60a5fa">Ver ↗</a>`:"—"}</td>
          </tr>`).join("")}
        </tbody>
      </table>
      </div>
    </div>`;
}
// Desenha os 2 gráficos de uma etapa depois que o HTML de stageAnalysisHtml
// já está no DOM (precisa dos canvases existirem pra medir largura).
// "chartStyle" controla o gráfico "Acumulado por dia": "line" (padrão, pra
// etapas com vários dias de histórico) ou "bar" (pra etapas que rodam num
// período muito curto — ex.: Aulas, 1 dia cada — onde uma linha não mostra
// nada de útil).
function mountStageCharts(scope,rows,metas,chartStyle){
  const daily=stageDailyAgg(rows);
  const totalSpend=rows.reduce((a,r)=>a+r.spend,0);
  const cfg=stageMetricCfg(metas);
  const mc=cfg[S.stageChartMetric[scope]||"cpc"]||cfg.cpc;
  const trendCid="c-trend-"+scope, pctCid="c-pct-"+scope, trendTid="t-trend-"+scope;
  const box1=document.getElementById(trendCid)?.parentElement;
  if(box1){
    if(chartStyle==="bar")drawMetricBar(trendCid,daily,mc.key,mc.color,mc.meta,box1.clientWidth,200,mc.fmt);
    else drawMetricLine(trendCid,daily,mc.key,mc.color,mc.meta,box1.clientWidth,200,mc.fmt);
  }
  setupTip(trendCid,trendTid,daily,[{name:mc.label,color:mc.color,key:mc.key,fmt:mc.fmt}],52,12);
  const box2=document.getElementById(pctCid)?.parentElement;
  if(box2)drawBarPercent(pctCid,daily,"spend",totalSpend,CHART_INV,box2.clientWidth,180);
}

// ── Render: Aulas (Aula 01 / Aula 02 / Aula 03 / Consolidado, em sub-abas) ──
// Cada aula é identificada pelo NOME DA CAMPANHA (via aulaNumberFromCampaign)
// — não por uma coluna própria, já que a Base Meta - Aulas mistura as 3
// campanhas numa aba só. Só a Aula 01 tem metas de benchmark por enquanto.
// "Consolidado" soma as linhas das 3 aulas (KPIs, gráfico e tabela de
// anúncios combinados) — sem meta própria, já que não existe benchmark
// consolidado das 3 aulas juntas.
const AULAS_TABS={
  aula01:      {num:1,   scope:"aula01",         metas:AULA01_METAS, alcanceKey:"aula01",           label:"Aula 01"},
  aula02:      {num:2,   scope:"aula02",         metas:null,         alcanceKey:"aula02",           label:"Aula 02"},
  aula03:      {num:3,   scope:"aula03",         metas:null,         alcanceKey:"aula03",           label:"Aula 03"},
  consolidado: {num:null,scope:"aulaConsolidado",metas:null,         alcanceKey:"aulasConsolidado", label:"Consolidado"},
};
function setAulasSubTab(tab){ S.aulasSubTab=tab; render(); }
function aulasSubTabBar(){
  return `<nav class="hdr-tabs" style="margin-bottom:16px;border-bottom:1px solid var(--border);padding-bottom:10px">${
    Object.entries(AULAS_TABS).map(([k,c])=>
      `<button class="htab${S.aulasSubTab===k?" htab-active":""}" onclick="setAulasSubTab('${k}')">${c.label}</button>`).join("")
  }</nav>`;
}
function aulasRowsForTab(cfg){
  return cfg.num!=null
    ? S.aulasRows.filter(r=>aulaNumberFromCampaign(r.campName)===String(cfg.num))
    : S.aulasRows.filter(r=>aulaNumberFromCampaign(r.campName)!=null); // consolidado: soma das 3 aulas
}
function renderAulas(){
  const el=document.getElementById("page-aulas");if(!el)return;

// ── Render: Planejado / Realizado ──────────────────────────────────────────
// Resumo por etapa (Captação, Aquecimento, Lembrete, Aulas, Carrinho) +
// detalhe diário completo da Captação (única etapa com meta de leads também).
// Emoji apontando pra linha de hoje nas tabelas de Planejado/Realizado — sutil,
// sem badge/borda, só o 👈 ao lado da data.
function hojeBadge(isToday){
  return isToday?` 👈`:"";
}
// Menor e maior data entre TODAS as etapas do plano (Captação ∪ Aquecimento ∪
// Lembrete ∪ Aulas ∪ Grupo VIP ∪ Carrinho) — usado pra avisar quando "hoje" cai antes do
// lançamento começar ou depois dele acabar (não tem linha "HOJE" pra mostrar
// nesses casos, então o aviso substitui o apontador).
function planoDateRange(){
  const allDates=[...PLANO_DIARIO,...PLANO_AQUECIMENTO,...PLANO_LEMBRETE,...PLANO_AULAS,...PLANO_GRUPO_VIP,...PLANO_CARRINHO].map(p=>p.date);
  if(!allDates.length)return null;
  return{min:allDates.reduce((a,d)=>d<a?d:a),max:allDates.reduce((a,d)=>d>a?d:a)};
}
function renderPlanoReal(){
  const el=document.getElementById("page-planoreal");if(!el)return;
  const today=todayISO();
  const plano=PLANO_DIARIO;
  const range=planoDateRange();
  const diffDays=(a,b)=>Math.round((Date.parse(a+"T00:00:00Z")-Date.parse(b+"T00:00:00Z"))/86400000);
  let hojeNotice=null;
  if(range){
    if(today<range.min)hojeNotice=`📅 Faltam ${diffDays(range.min,today)} dia(s) pro início do plano (${fDateBR(range.min)}) — nenhuma linha "HOJE" ainda.`;
    else if(today>range.max)hojeNotice=`📅 Plano encerrado há ${diffDays(today,range.max)} dia(s) (terminou em ${fDateBR(range.max)}) — sem linha "HOJE" pra mostrar.`;
  }

  const rows=plano.map(p=>{
    const isFuture=p.date>today;
    const investReal=isFuture?null:stageSpendForDate("Captação",p.date);
    const leadsReal=isFuture?null:(S.leadsByDate[p.date]||0);
    return{...p,isFuture,isToday:p.date===today,investReal,leadsReal};
  });

  const totalInvestPlan=plano.reduce((a,p)=>a+p.investimento,0);
  const totalLeadsPlan=plano.reduce((a,p)=>a+p.leads,0);
  const totalInvestReal=rows.reduce((a,r)=>a+(r.investReal||0),0);
  const totalLeadsReal=rows.reduce((a,r)=>a+(r.leadsReal||0),0);

  const ateHoje=rows.filter(r=>r.date<=today);
  const investPlanAteHoje=ateHoje.reduce((a,r)=>a+r.investimento,0);
  const leadsPlanAteHoje=ateHoje.reduce((a,r)=>a+r.leads,0);

  const diasTotal=plano.length;

  // Comparação de investimento nesta aba: quanto MAIS investido em relação
  // ao plano, melhor (ficar abaixo do plano é ruim — sinal de ritmo de
  // verba atrasado); por isso higherIsBetter=true aqui (ao contrário da
  // Principal, onde investimento menor é mais eficiente).
  const investAteHojeColor=investPlanAteHoje>0?statusColor(totalInvestReal,investPlanAteHoje,true):"var(--text-strong)";
  const leadsAteHojeColor=leadsPlanAteHoje>0?statusColor(totalLeadsReal,leadsPlanAteHoje,true):"var(--text-strong)";

  // Resumo por etapa — só investimento (as demais etapas não têm meta de leads).
  // "real" de cada etapa vem só das campanhas cujo NOME bate com aquela etapa
  // (via campaignStage), não do gasto total da Base Meta no período do plano
  // — senão o investimento de Captação vazaria pro "realizado" de Lembrete
  // etc. só por coincidência de data.
  const etapas=[
    {nome:"Captação",plan:totalInvestPlan,real:totalSpendForStage("Captação")},
    // Lives da captação: sem planejamento (plan = 0), realizado direto da aba.
    {nome:"Lives captação",plan:0,real:(S.livesCaptacaoRows||[]).reduce((a,r)=>a+(r.spend||0),0)},
    {nome:"Aquecimento",plan:PLANO_AQUECIMENTO.reduce((a,p)=>a+p.investimento,0)||PLANO_AQUECIMENTO_TOTAL,real:totalSpendForStage("Aquecimento")},
    {nome:"Lembrete",plan:PLANO_LEMBRETE.reduce((a,p)=>a+p.investimento,0),real:totalSpendForStage("Lembrete")},
    {nome:"Aulas",plan:PLANO_AULAS.reduce((a,p)=>a+p.investimento,0),real:totalSpendForStage("Aulas")},
    {nome:"Carrinho",plan:PLANO_CARRINHO.reduce((a,p)=>a+p.investimento,0),real:totalSpendForStage("Carrinho")},
  ];
  const etapasTotalPlan=etapas.reduce((a,e)=>a+e.plan,0);
  const etapasTotalReal=etapas.reduce((a,e)=>a+e.real,0);

  // Tabela diária de uma etapa sem meta de leads (Aquecimento/Lembrete/
  // Aulas/Grupo VIP/Carrinho) — só Investimento Planejado × Realizado, mesmo padrão
  // visual da tabela de Captação. Investimento realizado é filtrado por
  // CAMPANHA da etapa (via campaignStage), não pelo gasto do dia inteiro —
  // assim uma campanha de Captação rodando na mesma data não conta como
  // "realizado" de Lembrete/Aquecimento só por coincidência de data.
  function stageTable(label,stageName,planArr){
    if(planArr.length===0){
      return `<div class="section-lbl">${label}</div>
        <div class="cc" style="color:var(--hint);font-size:12px;padding:18px 20px;margin-bottom:22px">Sem detalhamento diário informado ainda para esta etapa.</div>`;
    }
    const stageRows=planArr.map(p=>{
      const isFuture=p.date>today;
      const real=isFuture?null:stageSpendForDate(stageName,p.date);
      return{...p,real,isToday:p.date===today};
    });
    const stagePlanTotal=planArr.reduce((a,p)=>a+p.investimento,0);
    const stageRealTotal=stageRows.reduce((a,r)=>a+(r.real||0),0);
    return `
    <div class="section-lbl">${label}</div>
    <div class="cc" style="padding:0;overflow:hidden;margin-bottom:22px">
      <div style="overflow-x:auto">
      <table>
        <thead><tr>
          <th>Data</th>
          <th style="text-align:right">Investimento Planejado</th>
          <th style="text-align:right">Investimento Realizado</th>
        </tr></thead>
        <tbody>
          ${stageRows.map(r=>{
            const investColor=r.real==null?"var(--hint)":statusColor(r.real,r.investimento,true);
            return `<tr id="${r.isToday?"row-hoje-"+stageName:""}" style="background:${r.isToday?"rgba(59,130,246,.08)":"transparent"}">
            <td class="mono">${diaSemana(r.date)}, ${fDate(r.date)}${hojeBadge(r.isToday)}</td>
            <td class="mono" style="text-align:right">${fUSD(r.investimento)}</td>
            <td class="mono" style="text-align:right;color:${investColor}">${r.real==null?"—":fUSD(r.real)}</td>
          </tr>`;}).join("")}
        </tbody>
        <tfoot>
          <tr style="border-top:2px solid var(--border-h)">
            <td style="font-weight:700;color:var(--text-strong)">Total</td>
            <td class="mono" style="text-align:right;font-weight:700">${fUSD(stagePlanTotal)}</td>
            <td class="mono" style="text-align:right;font-weight:700">${fUSD(stageRealTotal)}</td>
          </tr>
        </tfoot>
      </table>
      </div>
    </div>`;
  }

  el.innerHTML=`
    <div class="hdr" style="margin-bottom:6px">
      <div>
        <div class="hdr-title">Planejado / Realizado</div>
        <div class="hdr-sub">lançamento completo · atualizado em: ${S.updated||"—"}</div>
      </div>
      <div style="display:flex;align-items:center;gap:16px">${statusLegend()}</div>
    </div>
    ${S.error?`<div class="err">⚠️ ${S.error}</div>`:""}
    ${hojeNotice?`<div class="notice">${hojeNotice}</div>`:""}

    <div class="section-lbl" style="margin-top:0">Resumo por etapa (investimento)</div>
    <div class="cc" style="padding:0;overflow:hidden;margin-bottom:22px">
      <div style="overflow-x:auto">
      <table>
        <thead><tr><th>Etapa</th><th style="text-align:right">Investimento Planejado</th><th style="text-align:right">Investimento Realizado</th></tr></thead>
        <tbody>
          ${etapas.map(e=>`<tr>
            <td>${e.nome}</td>
            <td class="mono" style="text-align:right">${fUSD(e.plan)}</td>
            <td class="mono" style="text-align:right;color:${e.real>0?statusColor(e.real,e.plan,true):"var(--hint)"}">${e.real>0?fUSD(e.real):"—"}</td>
          </tr>`).join("")}
        </tbody>
        <tfoot>
          <tr style="border-top:2px solid var(--border-h)">
            <td style="font-weight:700;color:var(--text-strong)">Total lançamento</td>
            <td class="mono" style="text-align:right;font-weight:700">${fUSD(etapasTotalPlan)}</td>
            <td class="mono" style="text-align:right;font-weight:700">${fUSD(etapasTotalReal)}</td>
          </tr>
        </tfoot>
      </table>
      </div>
    </div>

    <div class="section-lbl">Captação — detalhe diário (única etapa com meta de leads)</div>
    <div class="g4" style="margin-bottom:20px">
      ${kpiCard("Investimento Planejado",fUSD(totalInvestPlan),`${diasTotal} dias`,"var(--text-strong)")}
      ${kpiCard("Investimento Realizado",fUSD(totalInvestReal),`Investimento planejado até hoje: ${fUSD(investPlanAteHoje)}`,investAteHojeColor,false,totalInvestReal,investPlanAteHoje,true)}
      ${kpiCard("Leads Planejados",totalLeadsPlan.toLocaleString("pt-BR"),`${diasTotal} dias`,"var(--text-strong)")}
      ${kpiCard("Leads Realizados",totalLeadsReal.toLocaleString("pt-BR"),`Leads planejados até hoje: ${leadsPlanAteHoje.toLocaleString("pt-BR")}`,leadsAteHojeColor,false,totalLeadsReal,leadsPlanAteHoje,true)}
    </div>

    <div class="cc" style="padding:0;overflow:hidden">
      <div style="overflow-x:auto">
      <table>
        <thead><tr>
          <th>Data</th>
          <th style="text-align:right">Investimento Planejado</th>
          <th style="text-align:right">Investimento Realizado</th>
          <th style="text-align:right">Leads Planejados</th>
          <th style="text-align:right">Leads Realizados</th>
        </tr></thead>
        <tbody>
          ${rows.map(r=>{
            const investColor=r.investReal==null?"var(--hint)":statusColor(r.investReal,r.investimento,true);
            const leadsColor=r.leadsReal==null?"var(--hint)":statusColor(r.leadsReal,r.leads,true);
            return `<tr id="${r.isToday?"row-hoje-Captação":""}" style="background:${r.isToday?"rgba(59,130,246,.08)":"transparent"}">
              <td class="mono">${diaSemana(r.date)}, ${fDate(r.date)}${hojeBadge(r.isToday)}</td>
              <td class="mono" style="text-align:right">${fUSD(r.investimento)}</td>
              <td class="mono" style="text-align:right;color:${investColor}">${r.investReal==null?"—":fUSD(r.investReal)}</td>
              <td class="mono" style="text-align:right">${r.leads.toLocaleString("pt-BR")}</td>
              <td class="mono" style="text-align:right;color:${leadsColor}">${r.leadsReal==null?"—":r.leadsReal.toLocaleString("pt-BR")}</td>
            </tr>`;
          }).join("")}
        </tbody>
        <tfoot>
          <tr style="border-top:2px solid var(--border-h)">
            <td style="font-weight:700;color:var(--text-strong)">Total</td>
            <td class="mono" style="text-align:right;font-weight:700">${fUSD(totalInvestPlan)}</td>
            <td class="mono" style="text-align:right;font-weight:700;color:var(--text-strong)" title="Total realizado ainda não é comparável ao plano do período inteiro, que não terminou">${fUSD(totalInvestReal)}</td>
            <td class="mono" style="text-align:right;font-weight:700">${totalLeadsPlan.toLocaleString("pt-BR")}</td>
            <td class="mono" style="text-align:right;font-weight:700;color:var(--text-strong)" title="Total realizado ainda não é comparável ao plano do período inteiro, que não terminou">${totalLeadsReal.toLocaleString("pt-BR")}</td>
          </tr>
        </tfoot>
      </table>
      </div>
    </div>

    ${stageTable("Aquecimento","Aquecimento",PLANO_AQUECIMENTO)}
    ${stageTable("Lembrete","Lembrete",PLANO_LEMBRETE)}
    ${stageTable("Aulas","Aulas",PLANO_AULAS)}
    ${stageTable("Carrinho","Carrinho",PLANO_CARRINHO)}

    <div class="foot">och_nov26 · Planejado × Realizado · planejamento manual + Google Sheets</div>`;
}

// ── Main render ───────────────────────────────────────────────────────────
function render(){
  const loadingEl=document.getElementById("loading");
  if(loadingEl)loadingEl.style.display=S.loading?"flex":"none";
  document.querySelectorAll(".page").forEach(el=>{el.style.display=(el.classList.contains("active")&&!S.loading)?"block":"none";});
  if(S.loading)return;
  renderHeader();
  if(S.currentPage==="captacao"){
    if(S.currentSubPage==="principal")renderPrincipal();
    else if(S.currentSubPage==="anuncios")renderAnuncios();
    else if(S.currentSubPage==="metricas")renderMetricasTrafego();
    else if(S.currentSubPage==="leads")renderLeads();
  }
  else if(S.currentPage==="aquecimento")renderAquecimento();
  else if(S.currentPage==="lembrete")renderLembrete();
  else if(S.currentPage==="aulas")renderAulas();
  else if(S.currentPage==="carrinho"){
    if(S.carrinhoSubPage==="principal")renderCarrinhoPrincipal();
    else if(S.carrinhoSubPage==="vendas")renderCarrinhoVendas();
    else if(S.carrinhoSubPage==="anuncios")renderCarrinhoAnuncios();
  }
  else if(S.currentPage==="planoreal")renderPlanoReal();
  else if(S.currentPage==="resumo")renderResumo();
}

// Fecha o dropdown do seletor de funil ao clicar fora dele.
// IMPORTANTE: usa e.composedPath() em vez de e.target.closest(...). O clique
// no próprio botão do seletor dispara render(), que reconstrói o HTML de
// dentro de #funil-wrap (inclusive o botão clicado) ANTES desse clique
// terminar de borbulhar até aqui — nesse ponto e.target já está desconectado
// do DOM e e.target.closest(...) sempre retorna null, fechando o dropdown na
// mesma hora que ele abre. composedPath() é calculado no início do disparo
// do evento (antes da re-renderização), então continua válido mesmo depois
// do DOM mudar por baixo.
document.addEventListener("click",(e)=>{
  if(!S.funilDropdownOpen)return;
  const wrap=document.getElementById("funil-wrap");
  const path=typeof e.composedPath==="function"?e.composedPath():[];
  if(wrap&&path.includes(wrap))return;
  S.funilDropdownOpen=false;
  renderHeader();
});

loadData();
</script>
</template>
<script>
window.OCH=(function(){
  let frame=null;
  function posiciona(){
    const root=document.getElementById("och-root");
    const hdr=document.querySelector("body > header.app-hdr");
    if(root&&hdr) root.style.top=hdr.getBoundingClientRect().height+"px";
  }
  function mostrar(on){
    const root=document.getElementById("och-root"); if(!root) return;
    root.style.display=on?"block":"none";
    document.body.style.overflow=on?"hidden":"";
    if(!on) return;
    posiciona();
    if(!frame){
      frame=document.createElement("iframe");
      frame.title="och_nov26";
      frame.srcdoc='<!DOCTYPE html><html lang="pt-BR">'+document.getElementById("och-tpl").innerHTML+'</html>';
      root.appendChild(frame);
    }
  }
  window.addEventListener("resize",()=>{ if(FUNIL_ATUAL==="och") posiciona(); });
  return {mostrar};
})();
// Link direto: index.html#och (ou #dds) já abre no projeto.
(function(){ const h=(location.hash||"").slice(1); if(h==="och"||h==="dds") selectFunil(h); })();
</script>
