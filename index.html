function renderTrafego(){
  const el=document.getElementById("page-trafego");if(!el)return;
  refreshPlatformAgg(S.startDate,S.endDate);
  const isFeo=S.currentFunil==="feo";
  const today=todayISO();
  const todayM=getDayMetrics(today);

  // Últimos 3 dias consolidados (D-3 a D-1)
  const p3Start=subDays(today,3);
  const p3End=subDays(today,1);
  const p3Daily=getDailyT(p3Start,p3End);
  const p3Tot=getTotalsT(p3Daily);

  const daily=getDailyT(S.startDate,S.endDate);

  // Definição das métricas: key, label, fmtFn, metaVal, higher, rawKey (para statusColor)
  const METRICS=[
    {key:"spend",    lbl:"Investimento",          fmt:fBRL,  meta:null,                              higher:null},
    {key:"cpv",      lbl:"Custo por Venda",        fmt:fBRL,  meta:isFeo?getFeoMetaCPV():META_CPV,   higher:false},
    {key:"cpc",      lbl:"CPC",                    fmt:fBRL,  meta:isFeo?null:METAS_T.cpc.val,       higher:false},
    {key:"ctr",      lbl:"CTR",                    fmt:fPct,  meta:isFeo?null:METAS_T.ctr.val,       higher:true},
    {key:"cpm",      lbl:"CPM",                    fmt:fBRL,  meta:isFeo?null:METAS_T.cpm.val,       higher:false},
    {key:"connect",  lbl:"Connect Rate",           fmt:fPct,  meta:isFeo?null:METAS_T.connect.val,   higher:true},
    {key:"txPagChk", lbl:"Tx Pág → Checkout",      fmt:fPct,  meta:isFeo?null:METAS_T.txPagChk.val, higher:true},
    {key:"txChkVnd", lbl:"Tx Checkout → Venda",    fmt:fPct,  meta:isFeo?null:METAS_T.txChkVnd.val, higher:true},
  ];

  // Formato da meta para o subtítulo — sempre no formato correto da métrica
  function metaSub(m){
    if(!m.meta) return "";
    return `Meta: ${m.fmt(m.meta)}`;
  }

  // Cards de uma linha de métricas a partir de um objeto com os valores
  function metricsRow(dataObj){
    return METRICS.map(m=>{
      const rawVal=dataObj[m.key]||0;
      const color=m.meta?statusColor(rawVal,m.meta,m.higher):"var(--text-strong)";
      const bord=m.meta?statusBorder(rawVal,m.meta,m.higher):"var(--border)";
      return `<div class="kc" style="padding:12px 14px;border-color:${bord}">
        <div class="kc-lbl">${m.lbl}</div>
        <div class="kc-val" style="color:${color};font-size:17px">${m.fmt(rawVal)}</div>
        ${m.meta?`<div class="kc-sub">${metaSub(m)}</div>`:""}
      </div>`;
    }).join("");
  }

  function overlayBtn(key,which,label){
    const on=S.overlays[key][which];
    const color=which==="inv"?CHART_INV:CHART_CPV;
    return `<button class="btn-overlay${on?" on":""}"
      style="${on?`border-color:${color};color:${color};background:${color}18`:""}"
      onclick="DDS.toggleOverlay('${key}','${which}')">${label}</button>`;
  }

  // Gráficos em grade 2×3
  const CHART_CONFIGS=[
    {key:"ctr",      lbl:"CTR",                    fmt:fPct, meta:isFeo?null:METAS_T.ctr.val,       metaLbl:""},
    {key:"cpm",      lbl:"CPM",                    fmt:fBRL, meta:isFeo?null:METAS_T.cpm.val,       metaLbl:""},
    {key:"cpc",      lbl:"CPC",                    fmt:fBRL, meta:isFeo?null:METAS_T.cpc.val,       metaLbl:""},
    {key:"txPagChk", lbl:"Tx Pág → Checkout",      fmt:fPct, meta:isFeo?null:METAS_T.txPagChk.val, metaLbl:""},
    {key:"txChkVnd", lbl:"Tx Checkout → Venda",    fmt:fPct, meta:isFeo?null:METAS_T.txChkVnd.val, metaLbl:""},
    {key:"connect",  lbl:"Connect Rate",           fmt:fPct, meta:isFeo?null:METAS_T.connect.val,   metaLbl:""},
  ];

  function tChart(c){
    return `<div class="cc" style="position:relative">
      <div class="ch">
        <span class="ct">${c.lbl}</span>
        <div style="display:flex;align-items:center;gap:12px">
          <span style="font-size:10px;color:var(--hint)">${c.metaLbl}</span>
          <div class="overlay-btns">
            ${overlayBtn(c.key,"inv","+ Invest.")}
            ${overlayBtn(c.key,"cpv","+ CPV")}
          </div>
        </div>
      </div>
      <div style="position:relative">
        <canvas id="tc-${c.key}"></canvas>
        <div class="tip" id="tt-${c.key}"></div>
      </div>
    </div>`;
  }

  el.innerHTML=`
    <div class="hdr" style="margin-bottom:6px">
      <div>
        <div class="hdr-title">Métricas de Tráfego</div>
        <div class="hdr-sub">atualizado em: ${D().updated||"—"}</div>
      </div>
      <div>${statusLegend()}</div>
    </div>
    ${S.error?`<div class="err">⚠️ ${S.error}</div>`:""}
    ${retoTempFilterBar()}
    <div class="section-lbl">Hoje — ${fDateBR(today)}</div>
    <div style="display:grid;grid-template-columns:repeat(8,1fr);gap:10px;margin-bottom:16px">
      ${metricsRow(todayM)}
    </div>

    <div class="section-lbl">Últimos 3 dias — ${fDateBR(p3Start)} a ${fDateBR(p3End)}</div>
    <div style="display:grid;grid-template-columns:repeat(8,1fr);gap:10px;margin-bottom:16px">
      ${metricsRow(p3Tot)}
    </div>

    ${(()=>{const p7Start=subDays(today,7),p7End=subDays(today,1),p7Tot=getTotalsT(getDailyT(p7Start,p7End));return`
    <div class="section-lbl">Últimos 7 dias — ${fDateBR(p7Start)} a ${fDateBR(p7End)}</div>
    <div style="display:grid;grid-template-columns:repeat(8,1fr);gap:10px;margin-bottom:20px">
      ${metricsRow(p7Tot)}
    </div>`;})()}

    <div class="charts-2x3">
      ${CHART_CONFIGS.map(c=>tChart(c)).join("")}
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:28px">

      <!-- Por Plataforma -->
      <div>
        <div class="section-lbl" style="margin-bottom:10px">Por Plataforma</div>
        <table style="width:100%;border-collapse:collapse;font-size:12px">
          <thead>
            <tr>
              ${["Plataforma","Investimento","Vendas","CPV","Faturamento","ROAS do front"].map(h=>`<th style="padding:7px 12px;text-align:${h==="Plataforma"?"left":"right"};background:var(--surf);border-bottom:1px solid var(--border);color:var(--hint);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px">${h}</th>`).join("")}
            </tr>
          </thead>
          <tbody>
            ${(()=>{
              const mp=S.metaByPlatform||{};
              const vp=S.vendasByPlatform||{};
              const allPlatforms=[...new Set([...Object.keys(mp),...Object.keys(vp)])];
              const order=["instagram","facebook","audience_network","messenger","threads"];
              const sorted=[...order.filter(p=>allPlatforms.includes(p)),...allPlatforms.filter(p=>!order.includes(p))];
              const labels={instagram:"Instagram",facebook:"Facebook",audience_network:"Audience Network",messenger:"Messenger",threads:"Threads"};
              return sorted.map((p,i)=>{
                const m=mp[p]||{spend:0};
                const v=vp[p]||{qtd:0,valor:0};
                const cpv=v.qtd>0?m.spend/v.qtd:0;
                const roas=m.spend>0?v.valor/m.spend:0;
                const bg=i%2===0?"transparent":"rgba(255,255,255,0.02)";
                const dot={instagram:"#e1306c",facebook:"#1877f2",audience_network:"#a259ff",messenger:"#00b2ff",threads:"#000"}[p]||"var(--hint)";
                return `<tr style="background:${bg}">
                  <td style="padding:8px 12px;color:var(--text)"><span style="display:inline-flex;align-items:center;gap:7px"><span style="width:8px;height:8px;border-radius:50%;background:${dot};flex-shrink:0"></span>${labels[p]||p}</span></td>
                  <td style="padding:8px 12px;text-align:right;font-family:'JetBrains Mono',monospace;color:var(--text)">${m.spend>0?fBRL(m.spend):"—"}</td>
                  <td style="padding:8px 12px;text-align:right;font-family:'JetBrains Mono',monospace;color:var(--text-strong);font-weight:600">${v.qtd||"—"}</td>
                  <td style="padding:8px 12px;text-align:right;font-family:'JetBrains Mono',monospace;color:var(--text)">${cpv>0?fBRL(cpv):"—"}</td>
                  <td style="padding:8px 12px;text-align:right;font-family:'JetBrains Mono',monospace;color:var(--text)">${v.valor>0?fBRL(v.valor):"—"}</td>
                  <td style="padding:8px 12px;text-align:right;font-family:'JetBrains Mono',monospace;color:${roas>=1?"#22c55e":roas>0?"#f59e0b":"var(--hint)"};font-weight:600">${roas>0?roas.toFixed(2)+"x":"—"}</td>
                </tr>`;
              }).join("");
            })()}
          </tbody>
        </table>
      </div>

      <!-- Por Formato -->
      <div>
        <div class="section-lbl" style="margin-bottom:10px">Por Formato</div>
        <table style="width:100%;border-collapse:collapse;font-size:12px">
          <thead>
            <tr>
              ${["Formato","Plataforma","Vendas","CPV","Faturamento","ROAS do front"].map(h=>`<th style="padding:7px 12px;text-align:${h==="Formato"||h==="Plataforma"?"left":"right"};background:var(--surf);border-bottom:1px solid var(--border);color:var(--hint);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px">${h}</th>`).join("")}
            </tr>
          </thead>
          <tbody>
            ${(()=>{
              const vpl=S.vendasByPlacement||{};
              const mp=S.metaByPlatform||{};
              const vp=S.vendasByPlatform||{};
              const sorted=Object.entries(vpl).sort((a,b)=>b[1].qtd-a[1].qtd);
              const fmtLabel=pl=>{
                const p=pl.toLowerCase();
                if(p.includes("reel"))    return "Reels";
                if(p.includes("feed"))    return "Feed";
                if(p.includes("storie"))  return "Stories";
                if(p.includes("instream"))return "In-stream Video";
                if(p.includes("explore")) return "Explore";
                return pl.replace(/_/g," ");
              };
              const platKey=pl=>{
                const p=pl.toLowerCase();
                if(p.includes("instagram"))return "instagram";
                if(p.includes("facebook")) return "facebook";
                if(p.includes("messenger"))return "messenger";
                return "";
              };
              const platLabel=pl=>{const m={instagram:"Instagram",facebook:"Facebook",messenger:"Messenger"};return m[pl]||pl;};
              const dotColor=pl=>pl==="instagram"?"#e1306c":pl==="facebook"?"#1877f2":"var(--hint)";
              return sorted.map(([pl,v],i)=>{
                const pk=platKey(pl);
                const platSpend=(mp[pk]||{spend:0}).spend;
                const platQtd=(vp[pk]||{qtd:0}).qtd;
                const estSpend=platQtd>0?(v.qtd/platQtd)*platSpend:0;
                const cpv=v.qtd>0&&estSpend>0?estSpend/v.qtd:0;
                const roas=estSpend>0?v.valor/estSpend:0;
                const bg=i%2===0?"transparent":"rgba(255,255,255,0.02)";
                const dc=dotColor(pk);
                return `<tr style="background:${bg}">
                  <td style="padding:8px 12px;color:var(--text)">${fmtLabel(pl)}</td>
                  <td style="padding:8px 12px"><span style="font-size:10px;padding:2px 7px;border-radius:10px;background:${dc}22;color:${dc}">${platLabel(pk)}</span></td>
                  <td style="padding:8px 12px;text-align:right;font-family:'JetBrains Mono',monospace;color:var(--text-strong);font-weight:600">${v.qtd}</td>
                  <td style="padding:8px 12px;text-align:right;font-family:'JetBrains Mono',monospace;color:var(--text)">${cpv>0?fBRL(cpv):"—"}</td>
                  <td style="padding:8px 12px;text-align:right;font-family:'JetBrains Mono',monospace;color:var(--text)">${fBRL(v.valor)}</td>
                  <td style="padding:8px 12px;text-align:right;font-family:'JetBrains Mono',monospace;color:${roas>=1?"#22c55e":roas>0?"#f59e0b":"var(--hint)"};font-weight:600">${roas>0?roas.toFixed(2)+"x":"—"}</td>
                </tr>`;
              }).join("");
            })()}
          </tbody>
        </table>
      </div>

    </div>
        <p class="foot">Base Meta DDS + Base Compradores DDS · Google Sheets API v4</p>`;

  requestAnimationFrame(()=>{
    const sW=document.getElementById(`tc-${CHART_CONFIGS[0].key}`)?.parentElement?.offsetWidth||500;
    CHART_CONFIGS.forEach(c=>{
      const ov=S.overlays[c.key];
      drawChartWithOverlay(`tc-${c.key}`,daily,c.key,c.fmt,c.meta,c.metaLbl,ov.inv,ov.cpv,sW,170);
      const tipLines=[{key:c.key,color:CHART_COLOR,name:c.lbl,fmt:c.fmt}];
      if(ov.inv) tipLines.push({key:"spend",color:CHART_INV,name:"Investimento",fmt:fBRL});
      if(ov.cpv) tipLines.push({key:"cpv",  color:CHART_CPV,name:"CPV",         fmt:fBRL});
      setupTip(`tc-${c.key}`,`tt-${c.key}`,daily,tipLines,52,ov.inv||ov.cpv?52:12);
    });
  });
}

// ── Render Campanhas + Anúncios (aba unificada) ───────────────────────────
function renderAnuncios(){
  const el=document.getElementById("page-anuncios");if(!el)return;
  const isFeo=S.currentFunil==="feo";
  const _focusedId=document.activeElement?.id; // preserva foco dos inputs de busca
  const dd=D();
  const start=S.startDate, end=S.endDate;

  // ── 0. Mapas compartilhados: identidade, compradores por adId, gasto total por evento ─
  const _identMap=new Map();
  function _getIdKeys(r){
    const ks=[];
    const em=(r["Email"]||"").toLowerCase().trim();
    const cpf=(r["CPF Comprador"]||"").replace(/[^\d]/g,"");
    const tel=(r["Telefone"]||"").replace(/[^\d]/g,"");
    if(em) ks.push("e:"+em);
    if(cpf) ks.push("c:"+cpf);
    if(tel) ks.push("t:"+tel);
    return ks;
  }
  for(const r of dd.funilRows){
    const ks=_getIdKeys(r);if(!ks.length)continue;
    let canonical=null;
    for(const k of ks){if(_identMap.has(k)){canonical=_identMap.get(k);break;}}
    if(!canonical) canonical=ks[0];
    for(const k of ks) _identMap.set(k,canonical);
  }
  function _getCanonical(r){
    const ks=_getIdKeys(r);
    for(const k of ks){if(_identMap.has(k)) return _identMap.get(k);}
    return ks[0]||null;
  }
  // adBuyersMap: adId → Set<buyerKey> (compradores do produto PRINCIPAL atribuídos a cada adId)
  // Reto funnel: só "reto"; FEO funnel: só "feo" (Reto upsell não conta como comprador do front-end)
  const primaryProdId=isFeo?"feo":FRONT_ID;
  const adBuyersMap=new Map();
  for(const r of dd.funilRows){
    const dt=toISO(r["Data da compra"]||"")||"";
    if(dt<start||dt>end) continue;
    if((r["Status da compra"]||"").trim()!=="Paga") continue;
    if(classifyProduct(r["Nome do produto"]||"",isFeo?"feo":"reto")!==primaryProdId) continue;
    const adId=extractAdId(r["Ad Id"]||"");if(!adId)continue;
    const key=_getCanonical(r);if(!key)continue;
    if(!adBuyersMap.has(adId)) adBuyersMap.set(adId,new Set());
    adBuyersMap.get(adId).add(key);
  }
  // buyerTotalSpent: buyerKey → receita total do comprador (Reto + Cero + Mapa)
  // Sem filtro de data para capturar upsells que ocorrem fora do período
  const buyerTotalSpent=new Map();
  for(const r of dd.funilRows){
    if((r["Status da compra"]||"").trim()!=="Paga") continue;
    const key=_getCanonical(r);if(!key)continue;
    buyerTotalSpent.set(key,(buyerTotalSpent.get(key)||0)+(parseFloat(r["Valor do produto"])||0));
  }
  // keyToProds: buyerKey → Set<productId> (compras pagas, sem filtro de data — para take rate por campanha/anúncio)
  const keyToProds=new Map();
  for(const r of dd.funilRows){
    if((r["Status da compra"]||"").trim()!=="Paga") continue;
    const prodId=classifyProduct(r["Nome do produto"]||"","reto");if(!prodId)continue;
    const key=_getCanonical(r);if(!key)continue;
    if(!keyToProds.has(key)) keyToProds.set(key,new Set());
    keyToProds.get(key).add(prodId);
  }

  // ── 1a. País selecionado → countryAllowedIds (deve ser calculado antes de campRows)
  const hasCountryFilter=S.selectedCountry!=="todos";
  let countryAllowedIds=null;
  if(hasCountryFilter){
    const cEntry=dd.metaByCountry[S.selectedCountry];
    countryAllowedIds=cEntry?new Set([...cEntry.adIds]):new Set();
  }

  // ── 1b. Métricas por país (período filtrado) para a tabela de países ────
  const countryStats={};
  const countryBuyerSets={};
  for(const [adId,adData] of Object.entries(dd.metaByAdId)){
    const country=adData.country;
    if(!countryStats[country]) countryStats[country]={spend:0,clicks:0,impressions:0,qtd:0,funilRev:0,ic:0};
    for(const [d,vals] of Object.entries(adData.byDate)){
      if(d>=start&&d<=end){
        countryStats[country].spend+=vals.spend;
        countryStats[country].clicks+=vals.clicks;
        countryStats[country].impressions+=vals.impressions;
        countryStats[country].ic+=vals.ic||0;
      }
    }
    const vByD=dd.vendasByAdDate[adId]||{};
    for(const [vd,vv] of Object.entries(vByD)){
      if(vd>=start&&vd<=end) countryStats[country].qtd+=vv.qtd;
    }
    if(!countryBuyerSets[country]) countryBuyerSets[country]=new Set();
    for(const ek of (adBuyersMap.get(adId)||new Set())) countryBuyerSets[country].add(ek);
  }
  for(const [country,keys] of Object.entries(countryBuyerSets)){
    if(!countryStats[country]) countryStats[country]={spend:0,clicks:0,impressions:0,qtd:0,funilRev:0};
    for(const ek of keys) countryStats[country].funilRev+=(buyerTotalSpent.get(ek)||0);
  }

  // ── 1c. Constrói linhas de campanha (filtradas por país quando necessário)
  const campRows=[];
  for(const [campName,meta] of Object.entries(dd.metaByCamp)){
    const byDate=dd.metaByCampByDate[campName]||{};
    // Coleta adIds do período
    const adIdsPeriod=new Set();
    for(const [d,vals] of Object.entries(byDate)){
      if(d>=start&&d<=end) vals.adIds.forEach(id=>adIdsPeriod.add(id));
    }
    // Filtra por país se necessário
    const adIdsC=countryAllowedIds
      ? new Set([...adIdsPeriod].filter(id=>countryAllowedIds.has(id)))
      : adIdsPeriod;
    if(adIdsC.size===0) continue;
    // Spend/clicks/impressions — recalcula por adId quando país filtrado
    let cSpend=0,cClicks=0,cImpr=0,cIc=0,cLv=0,cChk=0;
    if(countryAllowedIds){
      for(const adId of adIdsC){
        const adData=dd.metaByAdId[adId];if(!adData)continue;
        for(const [d,vals] of Object.entries(adData.byDate)){
          if(d>=start&&d<=end){cSpend+=vals.spend;cClicks+=vals.clicks;cImpr+=vals.impressions;cIc+=vals.ic||0;cLv+=vals.landingViews||0;cChk+=vals.checkouts||0;}
        }
      }
    } else {
      for(const [d,vals] of Object.entries(byDate)){
        if(d>=start&&d<=end){cSpend+=vals.spend;cClicks+=vals.clicks;cImpr+=vals.impressions;cIc+=vals.ic||0;cLv+=vals.landingViews||0;cChk+=vals.checkouts||0;}
      }
    }
    if(cSpend===0) continue;
    let cQtd=0,cValor=0;
    for(const adId of adIdsC){
      const byD=dd.vendasByAdDate[adId]||{};
      for(const [vd,vv] of Object.entries(byD)){
        if(vd>=start&&vd<=end){ cQtd+=vv.qtd; cValor+=vv.valor; }
      }
    }
    const campEvKeys=new Set();
    for(const adId of adIdsC){
      for(const ek of (adBuyersMap.get(adId)||new Set())) campEvKeys.add(ek);
    }
    let campFunilRev=0;
    for(const ek of campEvKeys) campFunilRev+=(buyerTotalSpent.get(ek)||0);
    let _cCero=0,_cMapa=0;
    for(const ek of campEvKeys){
      const prods=keyToProds.get(ek)||new Set();
      if(ASC1&&prods.has(ASC1.id)) _cCero++;
      if(ASC2&&prods.has(ASC2.id)) _cMapa++;
    }
    campRows.push({campName,spend:cSpend,clicks:cClicks,impressions:cImpr,
      qtd:cQtd,valor:cValor,
      trCero:campEvKeys.size>0?(_cCero/campEvKeys.size)*100:0,
      trMapa:_cCero>0?(_cMapa/_cCero)*100:0,
      cpc:cClicks>0?cSpend/cClicks:0,
      ctr:cImpr>0?(cClicks/cImpr)*100:0,
      cpm:cImpr>0?(cSpend/cImpr)*1000:0,
      cpv:cQtd>0?cSpend/cQtd:0,
      roas:cSpend>0?cValor/cSpend:0,     // só o produto de entrada
      ticket:cQtd>0?cValor/cQtd:0,
      ic:cIc, cpic:cIc>0?cSpend/cIc:0,
      connect:cClicks>0?(cLv/cClicks)*100:0,
      txPagChk:cLv>0?(cChk/cLv)*100:0,
      txChkVnd:cChk>0?(cQtd/cChk)*100:0,
      campStatus:dd.metaByCamp[campName]?.campStatus||'',
      adIds:adIdsC});
  }
  const {col:cCol,dir:cDir}=S.cSort;
  const sortedCamps=[...campRows].sort((a,b)=>{
    const av=a[cCol]??0,bv=b[cCol]??0;
    if(typeof av==="string") return cDir==="asc"?av.localeCompare(bv):bv.localeCompare(av);
    return cDir==="asc"?av-bv:bv-av;
  });
  const filteredCamps=S.campSearch.trim()
    ? sortedCamps.filter(c=>c.campName.toLowerCase().includes(S.campSearch.trim().toLowerCase()))
    : sortedCamps;
  S._campOrder=filteredCamps.map(r=>r.campName);

  // ── 2. allowedAdIds: campRows já está filtrado por país, então a interseção é automática
  const hasFilter=S.selectedCamps.size>0;
  let allowedAdIds=null;
  if(hasFilter){
    allowedAdIds=new Set();
    for(const c of campRows){
      if(S.selectedCamps.has(c.campName)) c.adIds.forEach(id=>allowedAdIds.add(id));
    }
    // campRows.adIds já foram intersectados com countryAllowedIds, não precisa reintersectar
  } else if(countryAllowedIds){
    allowedAdIds=countryAllowedIds;
  }

  // ── 3. Constrói linhas de anúncios ──────────────────────────────────────
  function buildAdRows(start,end,allowedAdIds){
    const rows=[];
    for(const [advCode,meta] of Object.entries(dd.metaByAd)){
      const byDate=dd.metaByAdByDate[advCode]||{};

      // Coleta todos os adIds deste advCode dentro do período
      const adIdsInPeriod=new Set();
      for(const [d,vals] of Object.entries(byDate)){
        if(d>=start&&d<=end) vals.adIds.forEach(id=>adIdsInPeriod.add(id));
      }
      const allIds=adIdsInPeriod.size>0?adIdsInPeriod:meta.adIds;

      // Quando há filtro de campanha, restringe aos adIds permitidos
      const useIds=allowedAdIds
        ? new Set([...allIds].filter(id=>allowedAdIds.has(id)))
        : allIds;
      if(allowedAdIds && useIds.size===0) continue; // pula só com filtro de campanha ativo

      // Spend / clicks / impressions — calculado a partir dos adIds filtrados
      let spend=0,clicks=0,impressions=0,ic=0,video3s=0,video15s=0,landingViews=0,checkouts=0,igUrl="";
      if(allowedAdIds && useIds.size>0){
        // Usa metaByAdId para precisão por campanha
        for(const adId of useIds){
          const adData=dd.metaByAdId[adId];if(!adData)continue;
          for(const [d,vals] of Object.entries(adData.byDate)){
            if(d>=start&&d<=end){
              spend+=vals.spend;clicks+=vals.clicks;impressions+=vals.impressions;
              ic+=vals.ic||0;video3s+=vals.video3s||0;video15s+=vals.video15s||0;
              landingViews+=vals.landingViews||0;checkouts+=vals.checkouts||0;
              if(!igUrl&&vals.igUrl) igUrl=vals.igUrl;
            }
          }
        }
      } else {
        // Sem filtro (ou sem adIds): usa o agregado por advCode
        for(const [d,vals] of Object.entries(byDate)){
          if(d>=start&&d<=end){
            spend+=vals.spend;clicks+=vals.clicks;impressions+=vals.impressions;
            ic+=vals.ic||0;video3s+=vals.video3s||0;video15s+=vals.video15s||0;
            landingViews+=vals.landingViews||0;checkouts+=vals.checkouts||0;
            if(!igUrl&&vals.igUrl) igUrl=vals.igUrl;
          }
        }
      }
      if(spend===0) continue;

      // Vendas (já são por adId — basta filtrar pelos adIds certos)
      let qtd=0,valor=0,taxa=0;
      for(const adId of useIds){
        const byD=dd.vendasByAdDate[adId]||{};
        for(const [vd,vvals] of Object.entries(byD)){
          if(vd>=start&&vd<=end){qtd+=vvals.qtd;valor+=vvals.valor;taxa+=vvals.taxa;}
        }
      }
      if(!igUrl) igUrl=meta.igUrl;

      // Status: ativo se qualquer adId tiver ad+adset+camp todos ACTIVE
      let isActive=false, hasStatusData=false;
      for(const adId of useIds){
        const adData=dd.metaByAdId[adId];
        if(!adData) continue;
        if(adData.adStatus) hasStatusData=true;
        if(adData.adStatus==="ACTIVE"&&adData.adsetStatus==="ACTIVE"&&adData.campStatus==="ACTIVE"){
          isActive=true; break;
        }
      }

      // Ticket ascensão (funil completo, sem filtro de data)
      let totalAscensoes=0;
      const adEvKeys=new Set();
      for(const adId of useIds){
        for(const eventKey of (adBuyersMap.get(adId)||new Set())){
          totalAscensoes+=(buyerTotalSpent.get(eventKey)||0);
          adEvKeys.add(eventKey);
        }
      }
      let _aCero=0,_aMapa=0;
      for(const ek of adEvKeys){
        const prods=keyToProds.get(ek)||new Set();
        if(ASC1&&prods.has(ASC1.id)) _aCero++;
        if(ASC2&&prods.has(ASC2.id)) _aMapa++;
      }
      rows.push({advCode,adName:dd.metaByAd[advCode]?.adName||advCode,campName:dd.metaByAd[advCode]?.campName||"",spend,clicks,impressions,qtd,valor,igUrl,
        trCero:adEvKeys.size>0?(_aCero/adEvKeys.size)*100:0,
        trMapa:_aCero>0?(_aMapa/_aCero)*100:0,
        cpc:clicks>0?spend/clicks:0,
        ctr:impressions>0?(clicks/impressions)*100:0,
        cpm:impressions>0?(spend/impressions)*1000:0,
        cpv:qtd>0?spend/qtd:0,
        ticket:qtd>0?valor/qtd:0,
        ticketAsc:qtd>0?totalAscensoes/qtd:0,
        roas:spend>0?valor/spend:0,     // só o produto de entrada
        ic, cpic:ic>0?spend/ic:0,
        connect:clicks>0?(landingViews/clicks)*100:0,
        txPagChk:landingViews>0?(checkouts/landingViews)*100:0,
        txChkVnd:checkouts>0?(qtd/checkouts)*100:0,
        hookRate:impressions>0?(video3s/impressions)*100:0,
        holdRate:video3s>0?(video15s/video3s)*100:0,
        isActive, hasStatusData});
    }
    return rows.filter(r=>r.spend>0);
  }

  const adRows=buildAdRows(start,end,allowedAdIds);

  // ── 4. Totais KPI (do período filtrado) ─────────────────────────────────
  // Se há filtro de campanhas, agrega só das campanhas selecionadas; caso contrário usa dados diários
  let tot;
  if(hasFilter){
    tot=campRows.filter(c=>S.selectedCamps.has(c.campName))
      .reduce((a,c)=>({spend:a.spend+c.spend,clicks:a.clicks+c.clicks,
        impressions:a.impressions+c.impressions,qtd:a.qtd+c.qtd,valor:a.valor+c.valor}),
        {spend:0,clicks:0,impressions:0,qtd:0,valor:0});
  } else {
    const _da=D();
    const dailyA=[];
    for(const d of Array.from(new Set([...Object.keys(_da.meta),...Object.keys(_da.vendas)])).sort()){
      if(d<start||d>end) continue;
      const m=_da.meta[d]||{spend:0,clicks:0,impressions:0};
      const v=_da.vendas[d]||{qtd:0,valor:0};
      dailyA.push({spend:m.spend,clicks:m.clicks,impressions:m.impressions,qtd:v.qtd,valor:v.valor});
    }
    tot=dailyA.reduce((a,d)=>({spend:a.spend+d.spend,clicks:a.clicks+d.clicks,
      impressions:a.impressions+d.impressions,qtd:a.qtd+d.qtd,valor:a.valor+d.valor}),
      {spend:0,clicks:0,impressions:0,qtd:0,valor:0});
  }
  const totCpc=tot.clicks>0?tot.spend/tot.clicks:0;
  const totCtr=tot.impressions>0?(tot.clicks/tot.impressions)*100:0;
  const totCpm=tot.impressions>0?(tot.spend/tot.impressions)*1000:0;
  const totCpv=tot.qtd>0?tot.spend/tot.qtd:0;
  const totTicket=tot.qtd>0?tot.valor/tot.qtd:0;
  {
    const _dd=D();const _pId=FRONT_ID;
    const _bSpent=new Map(),_bPrinc=new Set();
    for(const r of _dd.funilRows){
      const dt=toISO(r["Data da compra"]||"")||"";
      if(dt<start||dt>end) continue;
      if((r["Status da compra"]||"").trim()!=="Paga") continue;
      const em=(r["Email"]||"").toLowerCase().trim();
      const cpf=(r["CPF Comprador"]||"").replace(/[^\d]/g,"");
      const tel=(r["Telefone"]||"").replace(/[^\d]/g,"");
      const id=em||cpf||tel;if(!id) continue;
      _bSpent.set(id,(_bSpent.get(id)||0)+(parseFloat(r["Valor do produto"])||0));
      if(classifyProduct(r["Nome do produto"]||"",_pId)===_pId) _bPrinc.add(id);
    }
    let _fat=0;for(const k of _bPrinc)_fat+=(_bSpent.get(k)||0);
    var totTicketAsc=_bPrinc.size>0?_fat/_bPrinc.size:0;
  }

  // ── 5. Ordenação anúncios ────────────────────────────────────────────────
  const {col,dir}=S.aSort;
  const sorted=[...adRows].sort((a,b)=>{
    const av=a[col]??0,bv=b[col]??0;
    if(typeof av==="string") return dir==="asc"?av.localeCompare(bv):bv.localeCompare(av);
    return dir==="asc"?av-bv:bv-av;
  });
  const filteredAds=S.adSearch.trim()
    ? sorted.filter(r=>((r.adName||"")+" "+r.advCode+" "+(r.campName||"")).toLowerCase().includes(S.adSearch.trim().toLowerCase()))
    : sorted;
  S._adOrder=filteredAds.map(r=>r.advCode);

  function sc(v,meta,hi){return (meta===null)?"var(--text)":statusColor(v,meta,hi);}
  function sb(v,meta,hi){return (meta===null)?"var(--border)":statusBorder(v,meta,hi);}

  function thC(col_,lbl,sortFn){
    const active=(sortFn==="camp"?cCol:col)===col_;
    const activeDir=sortFn==="camp"?cDir:dir;
    const arrow=active?(activeDir==="asc"?" ↑":" ↓"):" ↕";
    const fn=sortFn==="camp"?`DDS.sortCampanhas('${col_}')`:`DDS.sortAnuncios('${col_}')`;
    const isName=col_==="campName"||col_==="advCode";
    const align=isName?"left":"right";
    return `<th onclick="${fn}" style="padding:10px 14px;text-align:${align};font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:${active?"var(--text)":"var(--hint)"};cursor:pointer;user-select:none;border-bottom:1px solid var(--border);white-space:nowrap">${lbl}<span style="color:${active?"#60a5fa":"var(--hint)"};font-size:9px;margin-left:3px">${arrow}</span></th>`;
  }

  // ── 6. Render ────────────────────────────────────────────────────────────
  el.innerHTML=`
    <div class="hdr" style="margin-bottom:6px">
      <div>
        <div class="hdr-title">Campanhas / Anúncios</div>
        <div class="hdr-sub">atualizado em: ${dd.updated||"—"} · ${filteredCamps.length}/${sortedCamps.length} campanhas · ${filteredAds.length}/${sorted.length} anúncios${hasFilter?" · filtrando "+S.selectedCamps.size+" campanha"+(S.selectedCamps.size>1?"s":""):""}</div>
      </div>
      <div>${statusLegend()}</div>
    </div>
    ${S.error?`<div class="err">⚠️ ${S.error}</div>`:""}

    <div class="section-lbl">Resumo do período${hasFilter?" · campanhas selecionadas":""}</div>
    <div style="display:grid;grid-template-columns:repeat(${TEM_ASC?7:6},1fr);gap:13px;margin-bottom:20px">
      <div class="kc"><div class="kc-lbl">Investimento</div><div class="kc-val" style="font-size:18px">${fBRL(tot.spend)}</div></div>
      <div class="kc"><div class="kc-lbl">Vendas</div><div class="kc-val" style="font-size:18px">${tot.qtd}</div></div>
      ${(()=>{const _m=isFeo?null:META_CPV;return `<div class="kc" style="border-color:${sb(totCpv,_m,false)}"><div class="kc-lbl">Custo por Venda</div><div class="kc-val" style="color:${sc(totCpv,_m,false)};font-size:18px">${fBRL(totCpv)}</div>${_m?`<div class="kc-sub">meta ${fBRL(_m)}</div>`:""}</div>`;})()}
      <div class="kc" style="border-color:${sb(totTicket,isFeo?null:META_TICKET,true)}"><div class="kc-lbl">Ticket Médio Front</div><div class="kc-val" style="color:${sc(totTicket,isFeo?null:META_TICKET,true)};font-size:18px">${fBRL(totTicket)}</div>${META_TICKET?`<div class="kc-sub">meta ${fBRL(META_TICKET)}</div>`:""}</div>
      ${TEM_ASC?`<div class="kc"><div class="kc-lbl">Ticket Médio Ascensões</div><div class="kc-val" style="font-size:18px">${fBRL(totTicketAsc)}</div><div class="kc-sub">todos os produtos</div></div>`:""}
      <div class="kc" style="border-color:${sb(totCtr,isFeo?null:METAS_T.ctr.val,true)}"><div class="kc-lbl">CTR</div><div class="kc-val" style="color:${sc(totCtr,isFeo?null:METAS_T.ctr.val,true)};font-size:18px">${fPct(totCtr)}</div>${METAS_T.ctr.val?`<div class="kc-sub">meta ${fPct(METAS_T.ctr.val)}</div>`:""}</div>
      <div class="kc" style="border-color:${sb(totCpm,isFeo?null:METAS_T.cpm.val,false)}"><div class="kc-lbl">CPM</div><div class="kc-val" style="color:${sc(totCpm,isFeo?null:METAS_T.cpm.val,false)};font-size:18px">${fBRL(totCpm)}</div>${METAS_T.cpm.val?`<div class="kc-sub">meta ${fBRL(METAS_T.cpm.val)}</div>`:""}</div>
    </div>

    ${(()=>{
      return ""; // DDS: sem tabela de países (a Base Meta DDS não tem Adset Name)
      // Tabela de países — dinâmica, derivada dos adsets do Meta CSV
      const countries=Object.keys(countryStats).sort((a,b)=>{
        if(a==="México") return -1; if(b==="México") return 1;
        return a.localeCompare(b);
      });
      if(countries.length<=1) return "";
      const flagMap={
        "México":"🇲🇽","Argentina":"🇦🇷","Chile":"🇨🇱","Colombia":"🇨🇴",
        "Costa Rica":"🇨🇷","El Salvador":"🇸🇻","Equador":"🇪🇨","EUA":"🇺🇸",
        "Guatemala":"🇬🇹","Peru":"🇵🇪","Brasil":"🇧🇷","Portugal":"🇵🇹",
        "China":"🇨🇳","Espanha":"🇪🇸","Bolívia":"🇧🇴","Paraguai":"🇵🇾",
        "Uruguai":"🇺🇾","Venezuela":"🇻🇪","Panamá":"🇵🇦","Honduras":"🇭🇳",
        "Nicarágua":"🇳🇮","Cuba":"🇨🇺","República Dominicana":"🇩🇴",
      };
      // Linha "Todos" agrega todos os países
      const totRow={spend:0,clicks:0,impressions:0,qtd:0,funilRev:0,ic:0};
      for(const s of Object.values(countryStats)){
        totRow.spend+=s.spend;totRow.clicks+=s.clicks;
        totRow.impressions+=s.impressions;totRow.qtd+=s.qtd;totRow.funilRev+=s.funilRev;totRow.ic+=(s.ic||0);
      }
      function cpRow(c,s,isTodos){
        const sel=!isTodos&&S.selectedCountry===c;
        const bg=sel?"rgba(251,191,36,.12)":"transparent";
        const bord=sel?"border-left:3px solid #fbbf24":"border-left:3px solid transparent";
        const label=isTodos?"🌎 Todos":(flagMap[c]||"🌐")+" "+c;
        const cpc=s.clicks>0?s.spend/s.clicks:0;
        const ctr=s.impressions>0?(s.clicks/s.impressions)*100:0;
        const cpm=s.impressions>0?(s.spend/s.impressions)*1000:0;
        const cpv=s.qtd>0?s.spend/s.qtd:0;
        const roas=s.spend>0?s.funilRev/s.spend:0;
        const ticket=s.qtd>0?s.funilRev/s.qtd:0;
        const safeC=(isTodos?"todos":c).replace(/'/g,"\\'");
        return `<tr data-country="${safeC}" style="border-bottom:1px solid var(--border);background:${bg};${bord};cursor:pointer;transition:background .1s"
          onclick="DDS.selectCountry('${safeC}')"
          onmouseover="this.style.background='${sel?"rgba(251,191,36,.18)":"rgba(255,255,255,.025)"}'"
          onmouseout="this.style.background='${bg}'">
          <td style="padding:9px 14px;font-size:11px;font-weight:${sel||isTodos?"700":"500"};color:${sel?"#fbbf24":isTodos?"var(--text-strong)":"var(--text)"};white-space:nowrap">${label}</td>
          <td style="padding:9px 14px;text-align:right;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text)">${fBRL(s.spend)}</td>
          <td style="padding:9px 14px;text-align:right;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text)">${s.qtd||"—"}</td>
          <td style="padding:9px 14px;text-align:right;font-family:'JetBrains Mono',monospace;font-size:11px;color:${s.qtd>0?sc(cpv,META_CPV,false):"var(--hint)"}">${s.qtd>0?fBRL(cpv):"—"}</td>
          <td style="padding:9px 14px;text-align:right;font-family:'JetBrains Mono',monospace;font-size:11px;color:${s.qtd>0?sc(roas,META_ROAS,true):"var(--hint)"}">${s.qtd>0?roas.toFixed(2)+"x":"—"}</td>
          <td style="padding:9px 14px;text-align:right;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text)">${s.qtd>0?fBRL(ticket):"—"}</td>
          <td style="padding:9px 14px;text-align:right;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text)">${(s.ic||0)>0?fBRL(s.spend/(s.ic||1)):"—"}</td>
          <td style="padding:9px 14px;text-align:right;font-family:'JetBrains Mono',monospace;font-size:11px;color:${sc(ctr,METAS_T.ctr.val,true)}">${fPct(ctr)}</td>
          <td style="padding:9px 14px;text-align:right;font-family:'JetBrains Mono',monospace;font-size:11px;color:${sc(cpm,METAS_T.cpm.val,false)}">${fBRL(cpm)}</td>
          <td style="padding:9px 14px;text-align:right;font-family:'JetBrains Mono',monospace;font-size:11px;color:${sc(cpc,METAS_T.cpc.val,false)}">${fBRL(cpc)}</td>
        </tr>`;
      }
      const thStyle="padding:9px 14px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--hint);border-bottom:1px solid var(--border);white-space:nowrap";
      return `
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
        <span class="section-lbl" style="margin:0">País</span>
        ${hasCountryFilter?`<span style="font-size:10px;color:#fbbf24;background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.3);padding:2px 8px;border-radius:5px">${S.selectedCountry}</span>`:""}
        <span style="font-size:10px;color:var(--hint)">Clique para filtrar campanhas e anúncios por país</span>
      </div>
      <div style="background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:20px">
        <table style="width:100%;border-collapse:collapse;font-size:11px">
          <thead><tr>
            <th style="${thStyle};text-align:left">País</th>
            <th style="${thStyle};text-align:right">Investimento</th>
            <th style="${thStyle};text-align:right">Vendas</th>
            <th style="${thStyle};text-align:right">Custo/Venda</th>
            <th style="${thStyle};text-align:right">ROAS</th>
            <th style="${thStyle};text-align:right">Ticket Médio</th>
            <th style="${thStyle};text-align:right">Custo/IC</th>
            <th style="${thStyle};text-align:right">CTR</th>
            <th style="${thStyle};text-align:right">CPM</th>
            <th style="${thStyle};text-align:right">CPC</th>
          </tr></thead>
          <tbody>
            ${cpRow("todos",totRow,true)}
            ${countries.map(c=>cpRow(c,countryStats[c]||{spend:0,clicks:0,impressions:0,qtd:0,funilRev:0},false)).join("")}
          </tbody>
        </table>
      </div>`;
    })()}

    <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
      <span class="section-lbl" style="margin:0">Campanhas</span>
      ${hasFilter?`<button onclick="DDS.clearCamps()" style="font-size:10px;padding:3px 10px;border-radius:6px;background:rgba(59,130,246,.18);border:1px solid rgba(96,165,250,.35);color:#93c5fd;cursor:pointer;font-family:'DM Sans',sans-serif">✕ Limpar seleção (${S.selectedCamps.size})</button>`:""}
      <input id="camp-search-input" oninput="DDS.setCampSearch(this.value)" value="${S.campSearch.replace(/"/g,'&quot;')}"
        placeholder="Buscar campanha\u2026"
        style="background:var(--surf);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:11px;font-family:'DM Sans',sans-serif;padding:4px 10px;outline:none;width:200px;transition:border-color .15s"
        onfocus="this.style.borderColor='rgba(96,165,250,.5)'" onblur="this.style.borderColor='var(--border)'">
      ${S.campSearch?`<button onclick="DDS.setCampSearch('')" style="font-size:10px;padding:3px 8px;border-radius:6px;background:transparent;border:1px solid var(--border);color:var(--hint);cursor:pointer;font-family:'DM Sans',sans-serif">✕</button>`:""}
      <span style="font-size:10px;color:var(--hint)">Clique para filtrar anúncios por campanha</span>
    </div>
    <div style="background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:20px">
      <div style="overflow-x:auto">
      <table style="width:100%;border-collapse:collapse;font-size:11px">
        <thead><tr>
          ${thC("campName","Campanha","camp")}
          ${thC("campStatus","Status","camp")}
          ${thC("spend","Investimento","camp")}
          ${thC("qtd","Vendas","camp")}
          ${!isFeo&&ASC1?thC("trCero","TR "+shortLbl(ASC1),"camp"):""}
          ${!isFeo&&ASC2?thC("trMapa","TR "+shortLbl(ASC2),"camp"):""}
          ${thC("cpv","Custo/Venda","camp")}
          ${thC("roas","ROAS do front","camp")}
          ${thC("ticket","Ticket Médio","camp")}
          ${thC("cpic","Custo/IC","camp")}
          ${thC("ctr","CTR","camp")}
          ${thC("cpm","CPM","camp")}
          ${thC("cpc","CPC","camp")}
          ${thC("connect","Connect Rate","camp")}
          ${thC("txPagChk","Tx Pág→Chk","camp")}
          ${thC("txChkVnd","Tx Chk→Vnd","camp")}
        </tr></thead>
        <tbody>
          ${filteredCamps.map(r=>{
            const sel=S.selectedCamps.has(r.campName);
            const bg=sel?"rgba(59,130,246,.12)":"transparent";
            const bord=sel?"border-left:3px solid #3b82f6":"border-left:3px solid transparent";
            const safeN=r.campName.replace(/&/g,"&amp;").replace(/"/g,"&quot;");
            return `<tr data-camp="${safeN}" style="border-bottom:1px solid var(--border);background:${bg};${bord};cursor:pointer;transition:background .1s"
              onclick="DDS.toggleCamp(this.dataset.camp,event.shiftKey)"
              onmouseover="this.style.background='${sel?"rgba(59,130,246,.18)":"rgba(255,255,255,.025)"}'"
              onmouseout="this.style.background='${bg}'">

function getFeoMetaActive(){
  const tF=S.feoTempFilter, pF=S.feoPriceFilter;
  if(tF==="todos"&&pF==="todos") return S.feoMeta;
  // Filter dynamically from campByDate, applying both filters
  const res={};
  for(const [camp,byDate] of Object.entries(S.feoMetaByCampByDate)){
    if(tF!=="todos"&&extractTempFromCamp(camp)!==tF) continue;
    if(pF!=="todos"&&extractPriceFromCamp(camp)!==pF) continue;
    for(const [d,m] of Object.entries(byDate)){
      if(!res[d])res[d]={spend:0,clicks:0,impressions:0,landingViews:0,checkouts:0,purchases:0};
      res[d].spend+=m.spend;res[d].clicks+=m.clicks;res[d].impressions+=m.impressions;
      res[d].landingViews+=m.landingViews||0;res[d].checkouts+=m.checkouts||0;
    }

function getFeoVendasActive(){
  const tF=S.feoTempFilter, pF=S.feoPriceFilter;
  if(tF==="todos"&&pF==="todos") return S.feoVendas;

  if(pF!=="todos"){
    // Filtro de preço ativo: usa feoFunilRows que tem _priceTier em TODAS as linhas
    // (UTM primeiro; fallback por valor da compra — inclui vendas sem UTM)
    const res={};
    for(const r of S.feoFunilRows){
      if(classifyProduct(r["Nome do produto"]||"","feo")!=="feo") continue; // só produto principal
      if((r["Status da compra"]||"")!=="Paga") continue;
      if(r._priceTier!==pF) continue; // só inclui o tier exato; null = não classificado → exclui
      const d=r["Data da compra"]||""; if(!d) continue;
      if(tF!=="todos"){
        // Filtro de temp sobreposto: aplica só a rows com UTM (sem UTM não tem temp)
        const ad=r["Ad Id"]?S.feoMetaByAdId[r["Ad Id"]]:null;
        if(!ad||extractTempFromCamp(ad.campName)!==tF) continue;
      }
      if(!res[d])res[d]={qtd:0,valor:0,taxa:0};
      res[d].qtd+=1;res[d].valor+=(parseFloat(r["Valor do produto"])||0);
    }
    return res;
  }

  // Só filtro de temp (sem preço): usa fvByAdDate (vendas com UTM por adId/data)
  const res={};
  for(const [adId,byDate] of Object.entries(S.feoVendasByAdDate)){
    const ad=S.feoMetaByAdId[adId]; if(!ad) continue;
    if(extractTempFromCamp(ad.campName)!==tF) continue;
    for(const [d,vv] of Object.entries(byDate)){
      if(!res[d])res[d]={qtd:0,valor:0,taxa:0};
      res[d].qtd+=vv.qtd;res[d].valor+=vv.valor;
    }
  }
  return res;
}
function getFeoFunilRows(){
  const tF=S.feoTempFilter, pF=S.feoPriceFilter;
  let rows=tF==="todos"?S.feoFunilRows:(S.feoFunilRowsByTemp[tF]||[]);

    // Todos os rows agora têm _priceTier: UTM primeiro, fallback por valor
    // Se _priceTier desconhecido, inclui (buyer matching em buildFunilData garante correção)
    return !r._priceTier || r._priceTier===pF;
  });
  return rows;
}

function classifyProduct(name, funil){
  if(!name) return null;

// Deduplicação de eventos webhook:
// Mesma pessoa + mesmo produto + dentro de 7 dias → mantém o mais recente por data/hora
// Se data/hora igual → hierarquia: Reembolsado > Aguardando Reembolso > Paga > Em Recuperacao > Expirado > outros
function deduplicateFunilRows(rows){
  const STATUS_PRIORITY={"Reembolsado":6,"Aguardando Reembolso":5,"Paga":4,"Em Recuperacao":3,"Expirado":2,"Aberta":1,"":0};
  function sp(st){ return STATUS_PRIORITY[st]||0; }

  // Chave: email+cpf+tel+produto+janela7dias
  // Agrupa por chave e mantém o de maior prioridade/data
  const groups=new Map();
  for(const r of rows){
    const em=(r["Email"]||"").toLowerCase().trim();
    const cpf=(r["CPF Comprador"]||"").replace(/[^\d]/g,"");
    const tel=(r["Telefone"]||"").replace(/[^\d]/g,"");
    const prod=(r["Nome do produto"]||"").trim().toUpperCase();
    const dataBruta=r["Data da compra"]||"";
    const dateStr=toISO(dataBruta)||"";
    const identity=em||cpf||tel;
    if(!identity||!prod||!dateStr) { /* sem chave — adiciona direto */ groups.set(Math.random().toString(),r); continue; }

    // Encontra grupo existente com mesma identidade + produto dentro de 7 dias
    let found=null;
    for(const [k,g] of groups){
      if(!g._identity||!g._prod) continue;
      if(g._prod!==prod) continue;
      // verifica identidade
      const gEm=(g["Email"]||"").toLowerCase().trim();
      const gCpf=(g["CPF Comprador"]||"").replace(/[^\d]/g,"");
      const gTel=(g["Telefone"]||"").replace(/[^\d]/g,"");
      const identMatch=(em&&gEm&&em===gEm)||(cpf&&gCpf&&cpf===gCpf)||(tel&&gTel&&tel===gTel);
      if(!identMatch) continue;
      // verifica janela 7 dias
      const d1=new Date((g._dateStr||"")+"T12:00:00Z");
      const d2=new Date(dateStr+"T12:00:00Z");
      const diffDays=Math.abs((d2-d1)/(86400000));
      if(diffDays<=7){ found=k; break; }
    }

    const rWithMeta={...r,_identity:identity,_prod:prod,_dateStr:dateStr};
    if(found){
      const existing=groups.get(found);
      // Mantém o mais recente; se empate, maior prioridade de status
      const existDate=existing._dateStr||"";
      const newDate=dateStr;
      const existSP=sp(existing["Status da compra"]||"");
      const newSP=sp(r["Status da compra"]||"");
      if(newDate>existDate||(newDate===existDate&&newSP>existSP)){
        groups.set(found,rWithMeta);
      }
    } else {
      groups.set(Math.random().toString(),rWithMeta);
    }
  }
  return Array.from(groups.values());
}

function buildFunilData(rows, start, end, funil){
  const f=funil||"reto";
  const primaryId=getFunilSteps(f)[0].id; // produto de entrada do funil
  // filtered: só para análise de status/perdas — respeita período
  const filtered = rows.filter(r=>{
    if(!start && !end) return true;
    const d = toISO(r["Data da compra"]||r["Data"]);
    if(!d) return true;
    if(start && d<start) return false;
    if(end   && d>end)   return false;
    return true;
  });

  // Para buyers: usa TODAS as linhas (sem filtro de período)
  // O período só controla se a compra entra nos totais, não quem é o comprador
  const allRows = rows;

  // Agrupa por comprador (e-mail + cpf + telefone)
  // Identifica o comprador único
  function buyerKey(r){
    // Retorna chaves únicas: cada campo é prefixado para evitar colisão entre email/cpf/tel
    const keys=[];
    const em=(r["Email"]||"").toLowerCase().trim();
    const cpf=(r["CPF Comprador"]||"").replace(/[^\d]/g,"");
    const tel=(r["Telefone"]||"").replace(/[^\d]/g,"");
    if(em)  keys.push("e:"+em);
    if(cpf) keys.push("c:"+cpf);
    if(tel) keys.push("t:"+tel);
    return keys;
  }

  // Mapeia comprador -> conjunto de produtos comprados com data
  // Estrutura: {keys: Set, products: [{id, date, valor, status}]}
  const buyers = new Map(); // normalizedKey -> buyer obj

  function getOrCreate(r){
    const keys = buyerKey(r);
    // procura buyer existente que compartilhe pelo menos 1 chave
    for(const [k,b] of buyers){
      for(const key of keys){
        if(key && b.keys.has(key)){
          // adiciona as novas keys a esse buyer
          keys.forEach(k2=>{ if(k2) b.keys.add(k2); });
          return b;
        }
      }
    }
    // novo buyer
    const b={keys:new Set(keys.filter(Boolean)), products:[]};
    const mapKey = keys[0] || Math.random().toString();
    buyers.set(mapKey, b);
    return b;
  }

  for(const r of allRows){
    const prodId = classifyProduct(r["Nome do produto"],f);
    if(!prodId) continue;
    const buyer = getOrCreate(r);
    const d = toISO(r["Data da compra"]||r["Data"]) || "";
    const status = normalizeStatus((r["Status da compra"]||"").trim());
    const valor  = (parseFloat(r["Valor do produto"])||0);
    const taxa   = parseBRLAbs(r["Taxa da plataforma"]);
    buyer.products.push({id:prodId, date:d, status, valor, taxa});
  }

  // Conta: só conta produtos comprados APÓS a primeira compra do manual (status Paga)
  const counts = {};
  const fat    = {};
  const taxa   = {};
  getFunilSteps(f).forEach(s=>{ counts[s.id]=0; fat[s.id]=0; taxa[s.id]=0; });

  // Status analysis
  const statusCounts = {};
  const statusVals   = {};
  const statusByProd = {};
  getFunilSteps(f).forEach(s=>{ statusByProd[s.id]={}; });

  // All rows for status analysis (sem filtro de funil)
  for(const r of filtered){
    const prodId=classifyProduct(r["Nome do produto"],f);
    if(!prodId) continue;
    const st=normalizeStatus((r["Status da compra"]||"").trim());
    const val=(parseFloat(r["Valor do produto"])||0);
    statusCounts[st]=(statusCounts[st]||0)+1;
    statusVals[st]=(statusVals[st]||0)+val;
    if(!statusByProd[prodId]) statusByProd[prodId]={};
    statusByProd[prodId][st]=(statusByProd[prodId][st]||0)+1;
  }

  // Funil: só Paga, dentro do período
  // OBs de faturamento (produto principal + OBs diretos via isOB)
  const OB_FAT_IDS = new Set(getFunilSteps(f).filter(s=>s.id===primaryId||s.isOB).map(s=>s.id));

  // Passo 1: agrupa por comprador+data para calcular faturamento do produto principal
  // (evita duplicatas entre webhook e histórica)
  {
    const ST_PRI={"Reembolsado":6,"Aguardando Reembolso":5,"Paga":4,"Em Recuperacao":3,"Expirado":2,"Aberta":1,"":0};
    const grupos=new Map();
    for(const r of filtered){
      const prodId=classifyProduct(r["Nome do produto"],f);
      if(!OB_FAT_IDS.has(prodId)) continue; // só produto principal + OBs diretos aqui
      const st=normalizeStatus((r["Status da compra"]||"").trim());
      if(!st) continue;
      const d=toISO(r["Data da compra"]||r["Data"])||"";
      const em=(r["Email"]||"").toLowerCase().trim();
      const cpf=(r["CPF Comprador"]||"").replace(/[^\d]/g,"");
      const tel=(r["Telefone"]||"").replace(/[^\d]/g,"");
      const identity=em||cpf||tel;
      // Fallback: se não há identity (sheet sem data.buyer.email/tel), usa order_date como chave única
      // (parseHotmartRows já deduplica por order_date, então não conta duplicatas)
      const orderKey=r._orderDate||"";
      const key=identity?identity+"|"+d:(orderKey?"_ord_"+orderKey:null);
      if(!key) continue;
      if(!grupos.has(key)) grupos.set(key,{st,d,valor:0,taxa:0,hasPrimary:false,obCounts:{}});
      const g=grupos.get(key);
      if((ST_PRI[st]||0)>(ST_PRI[g.st]||0)) g.st=st;
      if(prodId===primaryId) g.hasPrimary=true;
      if(st==="Paga"){
        const _v=parseFloat(r["Valor do produto"])||0;
        if(prodId===primaryId){
          g.valor += _v;
          g.taxa  += parseBRLAbs(r["Taxa da plataforma"]);
        } else {
          // OB: acumula valor separadamente para fat[obId]
          if(!g.obVals) g.obVals={};
          g.obVals[prodId]=(g.obVals[prodId]||0)+_v;
          g.obCounts[prodId]=(g.obCounts[prodId]||0)+1;
        }
      }
    }
    for(const [,g] of grupos){
      if(!g.hasPrimary || g.st!=="Paga") continue;
      counts[primaryId]++;
      fat[primaryId] += g.valor;
      taxa[primaryId]+= g.taxa;
      // Contagem e faturamento dos OBs desta transação
      for(const [obId, obQtd] of Object.entries(g.obCounts)){
        counts[obId]=(counts[obId]||0)+obQtd;
        fat[obId]=(fat[obId]||0)+((g.obVals||{})[obId]||0);
      }
    }
  }

  // Passo 2: upsell e ascensão (planLucro, curso) — por comprador, após produto principal
  for(const [,buyer] of buyers){
    const paid = buyer.products.filter(p=>p.status==="Paga");
    const mainPurchases = paid.filter(p=>p.id===primaryId).sort((a,b)=>a.date.localeCompare(b.date));
    if(!mainPurchases.length) continue;
    const mainDate = mainPurchases[0].date;
    const others = paid.filter(p=>{
      if(OB_FAT_IDS.has(p.id)) return false; // OBs já contados acima
      // Tolerância de 1 dia: order bumps são simultâneos mas Hotmart pode gravar
      // o upsell como data local do comprador (ex: México GMT-6) e o principal como UTC,
      // resultando em 1 dia de diferença aparente.
      if(p.date < subDays(mainDate,1)) return false;
      if(start && p.date < start) return false;
      if(end   && p.date > end)   return false;
      return true;
    });
    for(const p of others){
      counts[p.id]=(counts[p.id]||0)+1;
      fat[p.id]=(fat[p.id]||0)+p.valor;
      taxa[p.id]=(taxa[p.id]||0)+(p.taxa||0);
    }
  }

  const manualCount = counts[primaryId] || 1;
  const totalFat  = Object.values(fat).reduce((a,b)=>a+b,0);
  // Taxa Eduzz: inclui Paga + Reembolsado + Aguardando Reembolso
  // (Eduzz cobra taxa mesmo em reembolsos)
  const totalTaxaPaga = Object.values(taxa).reduce((a,b)=>a+b,0);
  let totalTaxaReemb = 0;
  for(const r of filtered){
    const st=normalizeStatus((r["Status da compra"]||"").trim());
    if(st!=="Reembolsado" && st!=="Aguardando Reembolso") continue;
    const prodId=classifyProduct(r["Nome do produto"],f);
    if(!prodId) continue;
    totalTaxaReemb += parseBRLAbs(r["Taxa da plataforma"]);
  }
  const totalTaxa = totalTaxaPaga + totalTaxaReemb;

  // Spend no período — respeita filtro de temperatura via getMetaActive()
  let totalSpend=0;
  const _metaD=getMetaActive();
  for(const d of Object.keys(_metaD)){
    if(start && d<start) continue;
    if(end   && d>end)   continue;
    totalSpend+=_metaD[d].spend||0;
  }

  return {
    counts, fat, manualCount, totalFat, totalSpend, buyers,
    roas: totalSpend>0 ? totalFat/totalSpend : 0,
    ltv:  totalFat/manualCount,
    lucro: totalFat - totalTaxa - (totalSpend*TAXA_IMPOSTO),
    taxaAscensao: (function(){
      const _upsell1Id=getFunilSteps(f)[1]?.id;
      if(!manualCount||!_upsell1Id) return 0;
      let cnt=0;
      for(const [,buyer] of buyers){
        const paid=buyer.products.filter(p=>p.status==="Paga");
        // compra do produto principal deve estar dentro do período filtrado
        const mp=paid.filter(p=>p.id===primaryId
          &&(!start||p.date>=start)&&(!end||p.date<=end))
          .sort((a,b)=>a.date.localeCompare(b.date))[0];
        if(!mp) continue;
        const ascendeu=paid.some(p=>p.id===_upsell1Id&&p.date>=mp.date);
        if(ascendeu) cnt++;
      }
      return (cnt/manualCount)*100;
    })(),
    taxaMapa: (function(){
      const _upsell1Id=getFunilSteps(f)[1]?.id;
      const _upsell2Id=getFunilSteps(f)[2]?.id;
      const upsell1Count=counts[_upsell1Id||""]||0;
      if(!_upsell2Id||!upsell1Count) return 0;
      let cnt=0;
      for(const [,buyer] of buyers){
        const paid=buyer.products.filter(p=>p.status==="Paga");
        // compra do upsell1 deve estar dentro do período filtrado
        const cp=paid.filter(p=>p.id===_upsell1Id
          &&(!start||p.date>=start)&&(!end||p.date<=end))
          .sort((a,b)=>a.date.localeCompare(b.date))[0];
        if(!cp) continue;
        const comprou=paid.some(p=>p.id===_upsell2Id&&p.date>=cp.date);
        if(comprou) cnt++;
      }
      return (cnt/upsell1Count)*100;
    })(),
    statusCounts, statusVals, statusByProd, buyers,
  };
}

  const gridCols=2*steps.length;   // LTV + take rates + tickets

  // Daily take rate data (only for Reto funil)
  var _trDays=[],_trPoints=[];
  if(!isFeoFunil&&s1&&S.startDate&&S.endDate){
    var _vbk=new Set();
    for(var [,_byr] of fd.buyers){
      if(!_byr.products.some(function(p){return p.id===s0.id&&p.status==="Paga";})) continue;
      for(var _k of _byr.keys) _vbk.add(_k);
    }
    var _cd=new Date(S.startDate);
    var _eD=new Date(S.endDate);
    var _dmap={};
    while(_cd<=_eD){
      var _ds=_cd.toISOString().slice(0,10);
      _trDays.push(_ds);
      _dmap[_ds]={reto:0,cero:0,mapa:0};
      _cd.setDate(_cd.getDate()+1);
    }
    for(var _r of _funilRows){
      if((_r["Status da compra"]||"")!=="Paga") continue;
      var _rd=toISO(_r["Data da compra"]||"")||"";
      if(!_rd||!_dmap[_rd]) continue;
      var _pid=classifyProduct(_r["Nome do produto"]||"",funil);
      if(!_pid) continue;
      if(_pid!==s0.id){
        var _em=(_r["Email"]||"").toLowerCase().trim();
        var _tel=(_r["Telefone"]||"").replace(/\D/g,"");
        if(!(_em&&_vbk.has("e:"+_em))&&!(_tel&&_vbk.has("t:"+_tel))) continue;
      }
      if(_pid===s0.id) _dmap[_rd].reto++;
      else if(_pid===s1.id) _dmap[_rd].cero++;
      else if(s2&&_pid===s2.id) _dmap[_rd].mapa++;
    }
    // Taxa por dia isolado (igual ao que a célula mostra ao filtrar por aquele dia)
    for(var _ds2 of _trDays){
      var _dp=_ds2.split("-");
      var _dR=_dmap[_ds2].reto,_dC=_dmap[_ds2].cero,_dM=_dmap[_ds2].mapa;
      _trPoints.push({label:_dp[2]+"/"+_dp[1],date:_ds2,
        reto:_dR,cero:_dC,mapa:_dM,
        trCero:_dR>0?(_dC/_dR)*100:0,
        trMapa:_dC>0?(_dM/_dC)*100:0});
    }
  }
  el.innerHTML=`
    <div class="hdr">
      <div>
        <div class="hdr-title">Métricas do Funil</div>
        <div class="hdr-sub">base: ${cnt0} compradores do ${s0.label} · atualizado em: ${_dd.updated||"—"}</div>
      </div>
    </div>
    ${retoTempFilterBar()}

    <div class="g4" style="margin-bottom:14px">
      <div class="kc"><div class="kc-lbl">Investimento</div><div class="kc-val kc-val-sm">${fBRL(totalSpend)}</div><div class="kc-sub">Meta Ads</div></div>
      <div class="kc"><div class="kc-lbl">Faturamento total</div><div class="kc-val kc-val-sm">${fBRL(totalFat)}</div><div class="kc-sub">${steps.map(s=>shortLbl(s)).join(" + ")}</div></div>
      <div class="kc"><div class="kc-lbl">ROAS funil</div><div class="kc-val kc-val-sm" style="color:${roasC}">${roas.toFixed(2)}x</div></div>
      <div class="kc"><div class="kc-lbl">Lucro bruto</div><div class="kc-val kc-val-sm" style="color:${lucroC}">${fBRL(lucro)}</div></div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(${gridCols},1fr);gap:10px;margin-bottom:20px">
      <div class="kc"><div class="kc-lbl">LTV médio</div><div class="kc-val kc-val-sm">${fBRL(ltv)}</div><div class="kc-sub">por comprador ${shortLbl(s0)}</div></div>
      ${isFeoFunil
        ? steps.slice(1).map((s,i)=>{
            const cnt=counts[s.id]||0;
            const pct=cnt0>0?(cnt/cnt0)*100:0;
            return `<div class="kc"><div class="kc-lbl">Take rate ${shortLbl(s)}</div><div class="kc-val kc-val-sm" style="color:${upsellColors[i%upsellColors.length]}">${pct.toFixed(1)}%</div><div class="kc-sub">${cnt} de ${cnt0} compraram</div></div>`;
          }).join("")
        : [
            s1?`<div class="kc"><div class="kc-lbl">Take rate ${shortLbl(s1)}</div><div class="kc-val kc-val-sm">${taxaAscensao.toFixed(1)}%</div><div class="kc-sub">${cnt1} de ${cnt0} compraram</div></div>`:"",
            s2?`<div class="kc"><div class="kc-lbl">Take rate ${shortLbl(s2)}</div><div class="kc-val kc-val-sm" style="color:#34d399">${(taxaMapa||0).toFixed(1)}%</div><div class="kc-sub">${cnt2} de ${cnt1} compraram</div></div>`:"",
          ].join("")
      }
      ${ticketCards}
    </div>

    <div style="display:grid;grid-template-columns:1fr 260px;gap:14px;margin-bottom:20px;align-items:start">
      <div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px">
        <div class="section-lbl">Funil de conversão</div>
        <svg viewBox="0 0 ${SW} ${SH}" style="width:100%;max-width:${SW}px;display:block;margin:0 auto">${svgBlocks}</svg>
      </div>
      <div style="display:flex;flex-direction:column;gap:10px">
        ${kpiCountCards}
        ${qtdReemb>0?`<div class="kc"><div class="kc-lbl" style="color:var(--red)">Reembolsos</div><div class="kc-val kc-val-sm" style="color:var(--red)">${qtdReemb} · ${fBRLShort(valReemb)}</div><div class="kc-sub">${pctReemb.toFixed(1)}% do fat.</div></div>`:""}
        ${qtdAbrt>0?`<div class="kc"><div class="kc-lbl" style="color:var(--amber)">Em aberto</div><div class="kc-val kc-val-sm" style="color:var(--amber)">${qtdAbrt} · ${fBRLShort(valAbrt)}</div><div class="kc-sub">${pctAbrt.toFixed(1)}% do fat.</div></div>`:""}
      </div>
    </div>

    <div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:20px">
      <div style="display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--border);padding-bottom:12px">
        ${tabs.map(t=>`<button onclick="DDS.setAnaTab('${t.k}')" style="font-size:11px;font-weight:600;padding:5px 13px;border-radius:8px;border:1px solid ${S.aTab===t.k?"rgba(96,165,250,.4)":"var(--border)"};background:${S.aTab===t.k?"rgba(59,130,246,.16)":"transparent"};color:${S.aTab===t.k?"#93c5fd":"var(--muted)"};cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s">${t.l}</button>`).join("")}
      </div>
      ${anaContent}
    </div>
    ${!isFeoFunil&&_trPoints.length>0?`
    <div style="display:grid;grid-template-columns:${s2?"1fr 1fr":"1fr"};gap:14px;margin-bottom:20px">
      <div class="cc" style="position:relative">
        <div class="ch"><span class="ct">Take rate ${shortLbl(s1)} (por dia)</span></div>
        <div style="position:relative"><canvas id="c-tr-cero"></canvas><div class="tip" id="t-tr-cero"></div></div>
      </div>
      ${s2?`<div class="cc" style="position:relative">
        <div class="ch"><span class="ct">Take rate ${shortLbl(s2)} (por dia)</span></div>
        <div style="position:relative"><canvas id="c-tr-mapa"></canvas><div class="tip" id="t-tr-mapa"></div></div>
      </div>`:""}
    </div>`:""}
    <p style="font-size:10px;color:var(--hint);text-align:center;font-family:'JetBrains Mono',monospace">${s0.label} · Base Compradores DDS + Base Meta DDS</p>`;

  if(!isFeoFunil&&_trPoints.length>0){
    requestAnimationFrame(function(){
      const trW1=document.getElementById("c-tr-cero")?.parentElement?.offsetWidth||380;
      drawLineChart("c-tr-cero",_trPoints,"trCero",function(v){return v.toFixed(1)+"%";},"#f59e0b",META_TAKE_RATE_ASC1,META_TAKE_RATE_ASC1?"Meta "+META_TAKE_RATE_ASC1+"%":null,trW1,170);
      setupTip("c-tr-cero","t-tr-cero",_trPoints,[
        {key:"trCero",color:"#f59e0b",name:"Take rate "+shortLbl(s1),fmt:function(v){return v.toFixed(1)+"%";}},
        {key:"reto",color:"var(--muted)",name:"Vendas "+shortLbl(s0),fmt:function(v){return v+" vdas";}},
        {key:"cero",color:"#f59e0b",name:"Vendas "+shortLbl(s1),fmt:function(v){return v+" vdas";}}
      ],52,12);
      if(s2){
        const trW2=document.getElementById("c-tr-mapa")?.parentElement?.offsetWidth||380;
        drawLineChart("c-tr-mapa",_trPoints,"trMapa",function(v){return v.toFixed(1)+"%";},"#34d399",null,null,trW2,170);
        setupTip("c-tr-mapa","t-tr-mapa",_trPoints,[
          {key:"trMapa",color:"#34d399",name:"Take rate "+shortLbl(s2),fmt:function(v){return v.toFixed(1)+"%";}},
          {key:"cero",color:"var(--muted)",name:"Vendas "+shortLbl(s1),fmt:function(v){return v+" vdas";}},
          {key:"mapa",color:"#34d399",name:"Vendas "+shortLbl(s2),fmt:function(v){return v+" vdas";}}
        ],52,12);

}

// ── Render Resumo Diário ───────────────────────────────────────────────────
function renderResumo(){
  const el=document.getElementById("page-resumo");if(!el)return;
  const isFeo=S.currentFunil==="feo";
  const funilTitle=isFeo?"Planilla Finanzas en Orden":FUNIL_NOME;
  const _resumoFocus=document.activeElement?.id;
  const today=todayISO(), yest=yesterdayISO();
  const start=S.startDate||today, end=S.endDate||today;

  // Agrega métricas para um período
  function periodMetrics(s,e){
    const daily=getDailyT(s,e);
    const t=getTotalsT(daily);
    // faturamento (receita) do período — usa getVendasActive() para respeitar filtros de temp/preço
    const vA=getVendasActive();
    let valor=0;
    for(const d of Object.keys(vA).filter(d=>d>=s&&d<=e)) valor+=(vA[d]?.valor||0);
    t.valor=valor;
    t.roas=t.spend>0?valor/t.spend:0;
    t.cpv=t.vendas>0?t.spend/t.vendas:0;
    // % por temperatura (apenas Reto; morno = quente)
    // Denominador = vendas com UTM atribuída (quente+morno+frio), excluindo orgânicas
    if(!isFeo){
      let qQtd=0, fQtd=0;
      for(const d of Object.keys(S.vendasByTemp.quente||{}).filter(d=>d>=s&&d<=e)) qQtd+=(S.vendasByTemp.quente[d]?.qtd||0);
      for(const d of Object.keys(S.vendasByTemp.morno||{}).filter(d=>d>=s&&d<=e))  qQtd+=(S.vendasByTemp.morno[d]?.qtd||0);
      for(const d of Object.keys(S.vendasByTemp.frio||{}).filter(d=>d>=s&&d<=e))   fQtd+=(S.vendasByTemp.frio[d]?.qtd||0);
      const atribQtd=qQtd+fQtd;
      t.pctQuente=atribQtd>0?Math.round((qQtd/atribQtd)*100):null;
      t.pctFrio  =atribQtd>0?Math.round((fQtd/atribQtd)*100):null;
    }
    return t;
  }

  const tot  = periodMetrics(start, end);
  const ontem= periodMetrics(yest,  yest);
  const hojeBase = periodMetrics(today, today);
  const hoje = {...hojeBase};
  if(S.manualSpendHoje!==null){
    hoje.spend=S.manualSpendHoje;
    hoje.cpv=hoje.vendas>0?hoje.spend/hoje.vendas:0;
    hoje.roas=hoje.spend>0?hoje.valor/hoje.spend:0;
  }

  // Emoji de status
  function em(val, meta, higher){
    if(!meta||val===0) return "";
    const ratio=higher ? val/meta : meta/val;
    if(ratio>=1)   return "🟢";
    if(ratio>=0.85) return "🟡";
    return "🔴";
  }

  // Formata data "dd/mm"
  function fDM(iso){ if(!iso) return "—"; const [,m,d]=iso.split("-"); return `${d}/${m}`; }

  // Label do período filtrado
  const dateLabel= start===end ? fDM(start) : `${fDM(start)} a ${fDM(end)}`;

  // Bloco de texto formatado para copiar (WhatsApp markdown)
  function block(label, m, isTotal){
    const _bCpvM=isFeo?getFeoMetaCPV():META_CPV;
    const cpvE  =em(m.cpv,      _bCpvM,                     false);
    const roasE =em(m.roas,     isFeo?null:META_ROAS,        true);
    const pcE   =em(m.txPagChk, isFeo?null:METAS_T.txPagChk.val, true);
    const cvE   =em(m.txChkVnd, isFeo?null:METAS_T.txChkVnd.val, true);
    const cnE   =em(m.connect,  isFeo?null:METAS_T.connect.val,   true);
    const cpcE  =em(m.cpc,      isFeo?null:METAS_T.cpc.val,       false);
    const ctrE  =em(m.ctr,      isFeo?null:METAS_T.ctr.val,       true);
    const cpmE  =em(m.cpm,      isFeo?null:METAS_T.cpm.val,       false);
    const vLabel=isTotal?"Vendas Mensal":"Vendas";
    const cpvLabel=isTotal?"Custo por venda Mensal":"Custo por venda";
    const cpvMeta=_bCpvM?` ${cpvE} ${fBRL(_bCpvM)}`:``;
    const pcMeta=METAS_T.txPagChk.val?` ${pcE} ${METAS_T.txPagChk.val}%`:"";
    const cvMeta=METAS_T.txChkVnd.val?` ${cvE} ${METAS_T.txChkVnd.val}%`:"";
    const cnMeta=METAS_T.connect.val?` ${cnE} ${METAS_T.connect.val}%`:"";
    const cpcMeta=METAS_T.cpc.val?` ${cpcE} ${fBRL(METAS_T.cpc.val)}`:"";
    const ctrMeta=METAS_T.ctr.val?` ${ctrE} ${METAS_T.ctr.val}%`:"";
    const cpmMeta=METAS_T.cpm.val?` ${cpmE} ${fBRL(METAS_T.cpm.val)}`:"";
    return (
`*-> ${label}*
Investimento:\t${fBRL(m.spend)}\t
${vLabel}:\t${m.vendas}\t
${cpvLabel}:\t${fBRL(m.cpv)}${cpvMeta}
ROAS:\t${m.roas.toFixed(2)}\t
${!isFeo?`
% vendas quente:\t${m.pctQuente!=null?m.pctQuente+"%":"—"}\t
% vendas frio:\t${m.pctFrio!=null?m.pctFrio+"%":"—"}\t`:""}
Tx conv PgV-Checkout:\t${m.txPagChk.toFixed(1)}%${pcMeta}
Tx conv Checkout-Vendas:\t${m.txChkVnd.toFixed(1)}%${cvMeta}
Connect Rate:\t${m.connect.toFixed(2)}%${cnMeta}

CPC:\t${fBRL(m.cpc)}${cpcMeta}
CTR:\t${m.ctr.toFixed(2)}%${ctrMeta}
CPM:\t${fBRL(m.cpm)}${cpmMeta}`
    );
  }

  const _feoPrice=isFeo&&S.feoPriceFilter!=="todos"?" "+S.feoPriceFilter.replace("pesos"," pesos"):"";
  const _resumoTitle=FUNIL_NOME;
  const resumoText =
`*${_resumoTitle}*\t\t

_${dateLabel}_\t\t

${block("Total", tot, true)}

${block("Ontem", ontem, false)}

${block("Hoje", hoje, false)}`;

  // ── Visual ────────────────────────────────────────────────────────────────
  function row(lbl, val, metaVal, emoji){
    const hasVal=val!==null&&val!==undefined;
    return `<div style="display:grid;grid-template-columns:220px 1fr auto;gap:8px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.04);align-items:center">
      <span style="color:var(--muted);font-size:12px">${lbl}</span>
      <span style="font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text-strong)">${hasVal?val:"—"}</span>
      <span style="font-size:13px;min-width:28px;text-align:right">${emoji||""}<span style="font-size:10px;color:var(--hint);margin-left:4px">${metaVal||""}</span></span>
    </div>`;
  }

  function section(label, m, isTotal, isHoje=false){
    const _sCpvM=isFeo?getFeoMetaCPV():META_CPV;
    const cpvE  =em(m.cpv,      _sCpvM,                          false);
    const roasE =em(m.roas,     isFeo?null:META_ROAS,            true);
    const pcE   =em(m.txPagChk, isFeo?null:METAS_T.txPagChk.val, true);
    const cvE   =em(m.txChkVnd, isFeo?null:METAS_T.txChkVnd.val, true);
    const cnE   =em(m.connect,  isFeo?null:METAS_T.connect.val,   true);
    const cpcE  =em(m.cpc,      isFeo?null:METAS_T.cpc.val,       false);
    const ctrE  =em(m.ctr,      isFeo?null:METAS_T.ctr.val,       true);
    const cpmE  =em(m.cpm,      isFeo?null:METAS_T.cpm.val,       false);
    const vLabel=isTotal?"Vendas (período)":"Vendas";
    const cpvLabel=isTotal?"Custo por venda":"Custo por venda";
    const isManual=isHoje&&S.manualSpendHoje!==null;
    const spendRow=isHoje?`
      <div style="display:grid;grid-template-columns:220px 1fr auto;gap:8px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.04);align-items:center">
        <span style="color:var(--muted);font-size:12px">Investimento</span>
        <div style="display:flex;align-items:center;gap:6px">
          <input id="manual-spend-input"
            value="${isManual?String(m.spend.toFixed(2)).replace('.',','):''}"
            placeholder="${fBRL(m.spend)}"
            onblur="DDS.setManualSpendHoje(this.value||'0')"
            onkeydown="if(event.key==='Enter')this.blur()"
            style="background:${isManual?'rgba(251,191,36,.08)':'var(--surf)'};border:1px solid ${isManual?'rgba(251,191,36,.5)':'var(--border)'};border-radius:6px;color:${isManual?'#fbbf24':'var(--text-strong)'};font-family:'JetBrains Mono',monospace;font-size:12px;padding:3px 8px;outline:none;width:120px;transition:all .15s"
            onfocus="this.style.borderColor='rgba(96,165,250,.5)'"
            onblur2="this.style.borderColor='${isManual?'rgba(251,191,36,.5)':'var(--border)'}'">
          ${isManual?`<button onclick="DDS.clearManualSpend()" title="Restaurar valor do Sheets" style="font-size:10px;padding:2px 7px;border-radius:5px;background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.35);color:#fbbf24;cursor:pointer;font-family:'DM Sans',sans-serif">↩ Restaurar</button>`:''}
        </div>
        <span style="font-size:13px;min-width:28px;text-align:right">${isManual?'✏️':''}</span>
      </div>`:row("Investimento", fBRL(m.spend), "", "");
    return `
    <div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:14px">
      <div style="font-size:13px;font-weight:700;color:var(--text-strong);margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border)">→ ${label}</div>
      ${spendRow}
      ${row(vLabel, m.vendas, "", "")}
      ${row(cpvLabel, fBRL(m.cpv), _sCpvM?`meta ${fBRL(_sCpvM)}`:"", cpvE)}
      ${row("ROAS do front", m.roas.toFixed(2), META_ROAS?`meta ${META_ROAS}x`:"", roasE)}
      <div style="height:10px"></div>
      ${!isFeo?row("% vendas quente", m.pctQuente!=null?m.pctQuente+"%":"—", "", ""):""}
      ${!isFeo?row("% vendas frio",   m.pctFrio  !=null?m.pctFrio+"%":"—",   "", ""):""}
      ${!isFeo?`<div style="height:10px"></div>`:""}
      ${row("Tx conv PgV-Checkout", m.txPagChk.toFixed(1)+"%", METAS_T.txPagChk.val?`meta ${METAS_T.txPagChk.val}%`:"", pcE)}
      ${row("Tx conv Checkout-Vendas", m.txChkVnd.toFixed(1)+"%", METAS_T.txChkVnd.val?`meta ${METAS_T.txChkVnd.val}%`:"", cvE)}
      ${row("Connect Rate", m.connect.toFixed(2)+"%", METAS_T.connect.val?`meta ${METAS_T.connect.val}%`:"", cnE)}
      <div style="height:10px"></div>
      ${row("CPC", fBRL(m.cpc), METAS_T.cpc.val?`meta ${fBRL(METAS_T.cpc.val)}`:"", cpcE)}
      ${row("CTR", m.ctr.toFixed(2)+"%", METAS_T.ctr.val?`meta ${METAS_T.ctr.val}%`:"", ctrE)}
      ${row("CPM", fBRL(m.cpm), METAS_T.cpm.val?`meta ${fBRL(METAS_T.cpm.val)}`:"", cpmE)}
    </div>`;
  }

  // Melhoria 3: variáveis para card de investimento (sem backtick aninhado)
  const _mSpend    = S.manualSpendHoje!==null;
  const _spendVal  = _mSpend ? String(S.manualSpendHoje.toFixed(2)).replace('.',',') : '';
  const _spendPH   = fBRL(hojeBase.spend);
  const _spendBg   = _mSpend ? 'rgba(251,191,36,.08)' : 'var(--surf)';
  const _spendBord = _mSpend ? 'rgba(251,191,36,.5)' : 'var(--border)';
  const _spendCol  = _mSpend ? '#fbbf24' : 'var(--text-strong)';
  const _spendExtra= _mSpend
    ? '<span style="font-size:10px;color:#fbbf24;background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.3);padding:2px 8px;border-radius:5px">&#x270F;&#xFE0F; manual</span>'
      + ' <button onclick="DDS.clearManualSpend()" style="font-size:10px;padding:3px 9px;border-radius:6px;background:transparent;border:1px solid var(--border);color:var(--hint);cursor:pointer">&#x21A9; Restaurar</button>'
    : '<span style="font-size:10px;color:var(--hint)">Edite para substituir o valor do Sheets &middot; Enter para aplicar</span>';

  el.innerHTML=`
    <div class="hdr" style="margin-bottom:16px">
      <div>
        <div class="hdr-title">Resumo diário</div>
        <div class="hdr-sub">período: ${dateLabel} · ontem: ${fDM(yest)} · hoje: ${fDM(today)} · somente ${funilTitle}</div>
      </div>
      <div>
        <button onclick="DDS.copyResumo()" style="display:inline-flex;align-items:center;gap:6px;padding:8px 18px;background:rgba(59,130,246,.18);border:1px solid rgba(96,165,250,.35);color:#93c5fd;border-radius:9px;cursor:pointer;font-size:12px;font-weight:600;font-family:'DM Sans',sans-serif;transition:all .15s" onmouseover="this.style.background='rgba(59,130,246,.28)'" onmouseout="this.style.background='rgba(59,130,246,.18)'">
          📋 Copiar resumo
        </button>
      </div>
    </div>
    ${S.error?`<div class="err">⚠️ ${S.error}</div>`:""}
    ${retoTempFilterBar()}
    <div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 20px;max-width:560px;margin-bottom:12px;display:flex;align-items:center;gap:14px;flex-wrap:wrap">
      <span style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;white-space:nowrap">Hoje — Investimento</span>
      <input id="manual-spend-input"
        value="${_spendVal}"
        placeholder="${_spendPH}"
        onkeydown="if(event.key==='Enter')this.blur()"
        onblur="DDS.setManualSpendHoje(this.value||'0');this.style.borderColor='${_spendBord}'"
        onfocus="this.style.borderColor='rgba(96,165,250,.5)'"
        style="background:${_spendBg};border:1px solid ${_spendBord};border-radius:7px;color:${_spendCol};font-family:'JetBrains Mono',monospace;font-size:12px;padding:5px 10px;outline:none;width:130px;transition:all .15s">
      ${_spendExtra}
    </div>
    <div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:24px;max-width:560px">
      <pre id="resumo-preview" style="font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text);white-space:pre-wrap;line-height:1.8;margin:0;user-select:all">${resumoText.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</pre>
    </div>
    <p class="foot">Ontem e Hoje são sempre datas fixas · Total reflete o filtro de datas do header</p>`;

  // Armazena texto para o botão copiar
  el._resumoText=resumoText;
  // Restaura foco no input manual de investimento
  if(document.activeElement?.id==="manual-spend-input"||_resumoFocus==="manual-spend-input"){
    requestAnimationFrame(()=>{
      const inp=document.getElementById("manual-spend-input");
      if(inp){inp.focus();const l=inp.value.length;inp.setSelectionRange(l,l);}
    });
  }
}

function copyResumo(){
  const el=document.getElementById("page-resumo");
  const text=el?._resumoText||"";
  if(!text) return;
  navigator.clipboard.writeText(text).then(()=>{
    const btns=document.querySelectorAll("[onclick='DDS.copyResumo()']");
    btns.forEach(b=>{const orig=b.innerHTML;b.innerHTML="✓ Copiado!";b.style.color="#4ade80";setTimeout(()=>{b.innerHTML=orig;b.style.color="";},1800);});
  }).catch(()=>{ alert("Não foi possível copiar. Selecione o texto manualmente."); });
}

// ── Render ─────────────────────────────────────────────────────────────────

function render(){
  renderHeader();
  const ld=document.getElementById("loading");
  if(S.firstLoad&&S.loading){ld.style.display="flex";return;}
  ld.style.display="none";
  // Painel de erro visível
  const errEl=document.getElementById("err-panel");
  if(errEl){
    if(S.error){
      errEl.style.display="flex";
      errEl.innerHTML=`<div style="background:#1e1014;border:1px solid #f87171;border-radius:12px;padding:24px 28px;max-width:700px;width:100%">
        <div style="color:#f87171;font-weight:700;font-size:15px;margin-bottom:12px">⚠️ Erro ao carregar dados</div>
        <code style="display:block;color:#fca5a5;font-size:12px;font-family:'JetBrains Mono',monospace;white-space:pre-wrap;word-break:break-all;line-height:1.6">${S.error}</code>
        <button onclick="DDS.loadData(true)" style="margin-top:16px;padding:8px 18px;background:#3b82f6;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:13px">↻ Tentar novamente</button>
        <button onclick="navigator.clipboard.writeText(${JSON.stringify(JSON.stringify(DDS.S.error))})" style="margin-top:16px;margin-left:8px;padding:8px 18px;background:var(--surf);color:var(--text);border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:13px">📋 Copiar erro</button>
      </div>`;
      return;
    } else { errEl.style.display="none"; }
  }
  {
    if(S.currentPage==="principal") renderPrincipal();
    else if(S.currentPage==="trafego") renderTrafego();
    else if(S.currentPage==="anuncios") renderAnuncios();
    else if(S.currentPage==="funil") renderFunil();
    else if(S.currentPage==="resumo") renderResumo();
  }

}
